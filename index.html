<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Игротека</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;800&family=Golos+Text:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&family=Ruslan+Display&family=Alegreya+SC:wght@700&display=swap">
<style>
/* Layout: a shelf of game boxes — wide cover on top, label strip below; one column on phones, three on desktop. */
:root{
  --bg:#0e0f11;
  --shelf:#17191c;
  --paper:#ece6d8;
  --muted:#8d9095;
  --line:rgba(236,230,216,.12);
  --amber:#f2a33a;
  --stamp:#b3261e;
  --display:"Unbounded", "Arial Black", system-ui, sans-serif;
  --body:"Golos Text", "Segoe UI", system-ui, sans-serif;
  --mono:"IBM Plex Mono", ui-monospace, Menlo, monospace;
  color-scheme:dark;
}
[hidden]{display:none!important}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--paper)}
body{font:400 16px/1.5 var(--body);min-height:100vh;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1180px;margin:0 auto;padding-block:clamp(28px,6vw,64px) 48px;display:flex;flex-direction:column;gap:clamp(28px,5vw,48px)}
header{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap}
h1{margin:0;font:800 clamp(44px,9vw,104px)/.9 var(--display);letter-spacing:-.02em}
h1 span{color:var(--amber)}
.sub{margin:10px 0 0;color:var(--muted);font-size:17px;max-width:48ch}
.seg{display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden}
.seg button{background:transparent;border:0;padding:7px 14px;font:600 12px var(--mono);letter-spacing:.08em;cursor:pointer;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--paper);color:var(--bg)}
.seg button:focus-visible,.box:focus-visible{outline:2px solid var(--amber);outline-offset:3px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:20px}
.box{display:flex;flex-direction:column;background:var(--shelf);border:1px solid var(--line);border-radius:10px;overflow:hidden;text-decoration:none;color:inherit;transition:transform .2s,border-color .2s}
.box:hover{transform:translateY(-3px);border-color:rgba(236,230,216,.3)}
.cover{position:relative;aspect-ratio:16/10;overflow:hidden;max-width:100%}
.label{padding:18px 18px 20px;display:flex;flex-direction:column;gap:10px;flex:1}
.label h2{margin:0;font:800 22px/1.15 var(--display);letter-spacing:-.01em}
.label p{margin:0;color:var(--muted);font-size:15px}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tags i{font:500 11px var(--mono);font-style:normal;letter-spacing:.04em;padding:4px 8px;border:1px solid var(--line);border-radius:999px;color:var(--paper)}
.play{margin-top:auto;display:inline-flex;align-items:center;gap:8px;font:600 14px var(--body);color:var(--amber)}
.play::after{content:"→";transition:transform .2s}
.box:hover .play::after{transform:translateX(4px)}
/* SVO cover */
.svo{background:linear-gradient(180deg,#07080a 0%,#151a1f 70%,#2a2d30 100%)}
.svo .bld{position:absolute;bottom:0;display:grid;gap:5px;padding:8px;background:#3a3e40}
.svo .bld b{display:block;width:10px;height:13px;background:#0c1013}
.svo .bld b.l{background:#e0a548;box-shadow:0 0 8px rgba(224,165,72,.6)}
.svo .snow{position:absolute;inset:0;background-image:radial-gradient(1.5px 1.5px at 20% 30%,#dfe5e8 50%,transparent 51%),radial-gradient(1px 1px at 60% 20%,#dfe5e8 50%,transparent 51%),radial-gradient(1.5px 1.5px at 80% 60%,#dfe5e8 50%,transparent 51%),radial-gradient(1px 1px at 35% 70%,#dfe5e8 50%,transparent 51%),radial-gradient(1.2px 1.2px at 90% 15%,#dfe5e8 50%,transparent 51%),radial-gradient(1px 1px at 10% 85%,#dfe5e8 50%,transparent 51%);opacity:.8}
.svo .stamp{position:absolute;left:8%;top:22%;font:400 clamp(44px,9vw,76px)/1 "Ruslan Display",Impact,serif;color:var(--stamp);border:.06em solid currentColor;padding:.05em .18em 0;transform:rotate(-6deg);background:rgba(7,8,10,.35)}
.svo .esc{position:absolute;left:8%;top:9%;font:400 clamp(16px,2.6vw,22px) "Ruslan Display",Impact,serif;color:var(--paper)}
/* Guess cover */
.gw{background:radial-gradient(ellipse at 50% 0%,#2b221b,#15110e 75%);display:grid;place-items:center}
.gw .tiles{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;width:82%}
.gw .t{aspect-ratio:3/4;border-radius:3px;background:#efe7d6;display:grid;place-items:center}
.gw .t::before{content:"";width:58%;aspect-ratio:1;border-radius:50%;background:var(--c,#1c1814);box-shadow:inset 0 0 0 3px #efe7d6,inset 0 0 0 5px var(--r,#b3262a)}
.gw .t.d{background:repeating-linear-gradient(45deg,#2b221b 0 5px,#201914 5px 10px);box-shadow:inset 0 0 0 1px rgba(239,231,214,.14)}
.gw .t.d::before{display:none}
.gw .t.h{box-shadow:0 0 0 3px #c8a24a}
.gw .q{position:absolute;right:7%;top:9%;font:700 clamp(40px,7vw,64px)/1 "Alegreya SC",Georgia,serif;color:#c8a24a}
/* soon */
.soon{border-style:dashed;background:transparent}
.soon .cover{display:grid;place-items:center;background:repeating-linear-gradient(-45deg,transparent 0 14px,rgba(236,230,216,.03) 14px 28px)}
.soon .cover span{font:800 64px var(--display);color:rgba(236,230,216,.12)}
.soon .play{color:var(--muted)}.soon .play::after{content:""}
footer{color:var(--muted);font-size:13px;border-top:1px solid var(--line);padding-top:16px}
@media (prefers-reduced-motion:reduce){.box,.play::after{transition:none}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1 id="h1">Игро<span>тека</span></h1>
      <p class="sub" data-t="sub"></p>
    </div>
    <div class="seg" role="group" aria-label="Language"><button type="button" id="lRu">RU</button><button type="button" id="lEn">EN</button></div>
  </header>

  <main class="grid">
    <a class="box" href="escape-from-commissariat.html">
      <div class="cover svo" aria-hidden="true">
        <div class="snow"></div>
        <div class="bld" id="b1" style="left:46%;width:30%;height:78%"></div>
        <div class="bld" id="b2" style="left:79%;width:24%;height:58%"></div>
        <div class="esc">Escape from</div>
        <div class="stamp">SVO</div>
      </div>
      <div class="label">
        <div class="tags"><i data-t="t_3d"></i><i data-t="t_horror"></i><i data-t="t_coop8"></i></div>
        <h2>Escape from SVO</h2>
        <p data-t="d_svo"></p>
        <span class="play" data-t="play"></span>
      </div>
    </a>

    <a class="box" href="guess-who.html">
      <div class="cover gw" aria-hidden="true"><div class="tiles" id="tiles"></div><div class="q">?</div></div>
      <div class="label">
        <div class="tags"><i data-t="t_board"></i><i data-t="t_two"></i><i data-t="t_online"></i></div>
        <h2 data-t="n_gw"></h2>
        <p data-t="d_gw"></p>
        <span class="play" data-t="play"></span>
      </div>
    </a>

    <div class="box soon" aria-disabled="true">
      <div class="cover" aria-hidden="true"><span>+</span></div>
      <div class="label">
        <h2 data-t="n_soon"></h2>
        <p data-t="d_soon"></p>
        <span class="play" data-t="soon"></span>
      </div>
    </div>
  </main>

  <footer data-t="foot"></footer>
</div>
<script>
(()=>{
const D={
 sub:['Браузерные игры. Играйте одни или зовите друзей по коду комнаты.','Browser games. Play alone or invite friends with a room code.'],
 t_3d:['3D','3D'],t_horror:['хоррор','horror'],t_coop8:['кооп до 8','co-op up to 8'],t_board:['настолка','tabletop'],t_two:['1–2 игрока','1–2 players'],t_online:['онлайн','online'],
 d_svo:['Ночь, спальный район, повестка уже в пути. Найдите паспорт и уезжайте, пока вас не нашли.','Night in a commuter district and a draft summons on its way. Find your passport and get out before they find you.'],
 n_gw:['Угадай героя','Guess the Hero'],d_gw:['Загадайте героя из «Ведьмака», LoL, Dota 2, «Звёздных войн» или «Игры престолов» и угадайте героя соперника.','Pick a hero from The Witcher, LoL, Dota 2, Star Wars or Game of Thrones and guess your opponent’s.'],
 n_soon:['Следующая игра','Next game'],d_soon:['Здесь появится новая игра.','A new game will appear here.'],soon:['Скоро','Coming soon'],play:['Играть','Play'],
 foot:['Язык и громкость запоминаются для всех игр на этом сайте.','Language and volume are remembered across all games on this site.']
};
let cfg={lang:(navigator.language||'').toLowerCase().startsWith('ru')?'ru':'en'};
try{Object.assign(cfg,JSON.parse(localStorage.getItem('svo-cfg')||'{}'));}catch(e){}
const L=()=>cfg.lang==='en'?1:0;
function apply(){
  document.documentElement.lang=cfg.lang;document.title=L()?'Game Shelf':'Игротека';
  document.getElementById('h1').innerHTML=L()?'Game <span>Shelf</span>':'Игро<span>тека</span>';
  document.querySelectorAll('[data-t]').forEach(el=>el.textContent=D[el.dataset.t][L()]);
  document.getElementById('lRu').setAttribute('aria-pressed',cfg.lang==='ru');document.getElementById('lEn').setAttribute('aria-pressed',cfg.lang==='en');
}
function setLang(l){cfg.lang=l;try{const all=JSON.parse(localStorage.getItem('svo-cfg')||'{}');all.lang=l;localStorage.setItem('svo-cfg',JSON.stringify(all));}catch(e){}apply();}
document.getElementById('lRu').onclick=()=>setLang('ru');document.getElementById('lEn').onclick=()=>setLang('en');
// cover art
for(const [id,cols,rows] of [['b1',6,10],['b2',4,7]]){const b=document.getElementById(id);b.style.gridTemplateColumns=`repeat(${cols},1fr)`;
  for(let i=0;i<cols*rows;i++){const w=document.createElement('b');if(Math.random()<.14)w.className='l';b.appendChild(w);}}
const tiles=document.getElementById('tiles'),cs=['#1c1814','#b3262a','#2f6fb3','#5f9a46','#e5c33a','#8fb4c8'],rs=['#c8a24a','#b8b2a3','#c0682e'];
for(let i=0;i<18;i++){const t=document.createElement('div');t.className='t'+([2,5,7,11,13,16].includes(i)?' d':'')+(i===9?' h':'');t.style.setProperty('--c',cs[i%cs.length]);t.style.setProperty('--r',rs[i%rs.length]);tiles.appendChild(t);}
apply();
})();
</script>
</body>
</html>
