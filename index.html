<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ORION</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;800&family=Golos+Text:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&family=Ruslan+Display&family=Alegreya+SC:wght@700&family=Noto+Sans+Runic&display=swap">
<!-- Font Awesome Free. With a Pro licence, swap this line for your kit: <script src="https://kit.fontawesome.com/XXXX.js" crossorigin="anonymous"></script> -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
<style>
/* Layout: a player's desk — profile and trophy case side by side, two oversized doors (shelf, tamada) underneath.
   The lobby lives in a popover you can pull from anywhere; notifications stack top-right above everything, games included. */
:root{
  --bg:#0e0f11;
  --shelf:#17191c;
  --shelf2:#1f2226;
  --paper:#ece6d8;
  --muted:#8d9095;
  --line:rgba(236,230,216,.12);
  --amber:#f2a33a;
  --stamp:#b3261e;
  --win:#7fd36a;
  --lose:#e0604f;
  --r-common:#c3cbd3;
  --r-rare:#4c9bf0;
  --r-epic:#b26cf5;
  --r-legendary:#f2a33a;
  --display:"Unbounded", "Arial Black", system-ui, sans-serif;
  --body:"Golos Text", "Segoe UI", system-ui, sans-serif;
  --mono:"IBM Plex Mono", ui-monospace, Menlo, monospace;
  color-scheme:dark;
}
[hidden]{display:none!important}
*{box-sizing:border-box}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:rgba(236,230,216,.16);border-radius:8px;border:2px solid transparent;background-clip:padding-box}
::-webkit-scrollbar-thumb:hover{background-color:rgba(242,163,58,.55)}
::-webkit-scrollbar-corner{background:transparent}
@supports not selector(::-webkit-scrollbar){*{scrollbar-width:thin;scrollbar-color:rgba(236,230,216,.2) transparent}}
.sf{--fd:34px}
.sf.ft{-webkit-mask-image:linear-gradient(to bottom,transparent 0,#000 var(--fd));mask-image:linear-gradient(to bottom,transparent 0,#000 var(--fd))}
.sf.fb{-webkit-mask-image:linear-gradient(to top,transparent 0,#000 var(--fd));mask-image:linear-gradient(to top,transparent 0,#000 var(--fd))}
.sf.ft.fb{-webkit-mask-image:linear-gradient(to bottom,transparent 0,#000 var(--fd),#000 calc(100% - var(--fd)),transparent 100%);mask-image:linear-gradient(to bottom,transparent 0,#000 var(--fd),#000 calc(100% - var(--fd)),transparent 100%)}
.modal:not([hidden]){animation:mFade .2s ease-out}
.modal:not([hidden]) .mbox{animation:mPop .32s cubic-bezier(.2,1.25,.4,1)}
.modal.closing{animation:mFadeOut .18s ease-in forwards}
.modal.closing .mbox{animation:mPopOut .18s ease-in forwards}
@keyframes mFade{from{opacity:0}}
@keyframes mFadeOut{to{opacity:0}}
@keyframes mPop{from{opacity:0;scale:.9;translate:0 14px}}
@keyframes mPopOut{to{opacity:0;scale:.94;translate:0 8px}}
#pop:not([hidden]){animation:pIn .22s cubic-bezier(.2,1.3,.4,1)}
#pop.closing{animation:pOut .16s ease-in forwards}
#pop.atChip{transform-origin:top right}
#pop.atFab{transform-origin:left center}
@keyframes pIn{from{opacity:0;scale:.92}}
@keyframes pOut{to{opacity:0;scale:.95}}
.seg{position:relative}
.seg>button{position:relative;z-index:1;transition:color .2s}
.seg>button[aria-pressed="true"]{background:transparent!important}
.seg>.thumb{position:absolute;top:0;bottom:0;left:0;width:0;background:var(--paper);border-radius:999px;transition:left .3s cubic-bezier(.3,1.25,.5,1),width .3s cubic-bezier(.3,1.25,.5,1),opacity .2s;pointer-events:none}
html,body{margin:0;background:var(--bg);color:var(--paper)}
body{font:400 16px/1.5 var(--body);min-height:100vh;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button{font:inherit;color:inherit}
a{color:inherit}
.app{max-width:1180px;margin:0 auto;padding-block:20px 48px;display:flex;flex-direction:column;gap:24px}
.bar{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.logo{font:800 24px var(--display);letter-spacing:.06em;background:none;border:0;padding:0;cursor:pointer;display:flex;align-items:center;gap:10px}
.logo .belt{width:30px;height:22px;fill:var(--amber);filter:drop-shadow(0 0 6px rgba(242,163,58,.7))}
.nav{display:flex;gap:6px;margin-left:8px}
.ib{width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:transparent;color:var(--muted);cursor:pointer;display:grid;place-items:center;font-size:15px;position:relative;transition:color .15s,border-color .15s,background .15s}
.ib:hover{color:var(--paper);border-color:rgba(236,230,216,.35)}
.ib[aria-current="page"]{color:var(--bg);background:var(--paper);border-color:var(--paper)}
.ib[data-tt]:hover::after{content:attr(data-tip);position:absolute;top:calc(100% + 8px);left:50%;translate:-50% 0;white-space:nowrap;font:600 11px var(--mono);letter-spacing:.06em;background:var(--paper);color:var(--bg);padding:5px 8px;border-radius:6px;z-index:5;pointer-events:none}
.grow{flex:1}
.logo span+span{color:var(--amber)}
.chip{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:999px;padding:7px 14px;font:600 12px var(--mono);letter-spacing:.06em;background:transparent;cursor:pointer;color:var(--paper)}
.chip:hover{border-color:rgba(236,230,216,.35)}
.chip .dot{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.chip.on .dot{background:var(--win);box-shadow:0 0 8px var(--win)}
.seg{display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden}
.seg button{background:transparent;border:0;padding:7px 14px;font:600 12px var(--mono);letter-spacing:.08em;cursor:pointer;color:var(--muted);display:inline-flex;align-items:center;gap:7px}
.seg button[aria-pressed="true"]{background:var(--paper);color:var(--bg)}
.btn{font:600 14px var(--body);padding:11px 18px;border:0;border-radius:6px;background:var(--paper);color:var(--bg);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn:hover{background:var(--amber)}
.btn.ghost{background:transparent;color:var(--paper);box-shadow:inset 0 0 0 1px var(--line)}
.btn.ghost:hover{box-shadow:inset 0 0 0 1px var(--amber);color:var(--amber);background:transparent}
.btn.sm{padding:7px 12px;font-size:13px}
.btn.bet{background:var(--amber);color:var(--bg);font:700 12px var(--mono);letter-spacing:.08em;padding:7px 11px}
.btn.bet:hover{background:var(--paper)}
.btn:disabled{opacity:.35;cursor:not-allowed}
.btn:disabled:hover{background:var(--paper)}
.btn.bet:disabled:hover{background:var(--amber)}
:focus-visible{outline:2px solid var(--amber);outline-offset:3px}
.eyebrow{margin:0;font:600 11px var(--mono);letter-spacing:.18em;text-transform:uppercase;color:var(--muted);display:flex;align-items:center;gap:8px}
.muted{color:var(--muted)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
/* home */
#vHome{display:flex;flex-direction:column;gap:20px}
.desk{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.35fr);grid-template-rows:470px;gap:20px;align-items:stretch}
.desk>.card{min-height:0;overflow:hidden}
.card{background:var(--shelf);border:1px solid var(--line);border-radius:14px;padding:clamp(18px,3vw,26px);display:flex;flex-direction:column;gap:18px;min-width:0}
.who{display:flex;gap:18px;align-items:center;min-width:0}
.ava{width:84px;height:84px;flex:none;border-radius:50%;overflow:hidden}
.ava.s{width:40px;height:40px}
.ava svg{width:100%;height:100%;display:block}
.who h1{margin:0;font:800 clamp(28px,4.4vw,44px)/1 var(--display);letter-spacing:-.02em;overflow-wrap:anywhere}
.who p{margin:6px 0 0;color:var(--muted);font-size:17px;font-style:italic;overflow-wrap:anywhere}
.purse{display:flex;align-items:center;gap:22px;flex-wrap:wrap}
.pv{display:flex;align-items:center;gap:12px}
.pv div{display:flex;flex-direction:column}
.gemc{width:42px;height:42px;border-radius:12px;flex:none;display:grid;place-items:center;background:linear-gradient(160deg,#b26cf5,#6a3bc0);color:#fff;font-size:17px;box-shadow:inset 0 0 0 2px rgba(255,255,255,.25)}
.nameRow{display:flex;align-items:center;gap:10px;min-width:0}
.nameRow h1{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ptabs{align-self:flex-start}
.ptabs button{font:600 12px var(--body)!important;letter-spacing:0!important;padding:8px 13px!important}
.ppanel{flex:1;min-height:0;overflow-y:auto;margin-right:-6px;padding-right:6px}
.glist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.glist li{display:flex;align-items:center;gap:10px;padding:9px 11px;border-radius:10px;background:var(--shelf2);font-size:14px}
.glist li .gi{width:32px;height:32px;border-radius:9px;display:grid;place-items:center;flex:none;color:var(--rc);background:color-mix(in srgb,var(--rc) 16%,transparent)}
.glist li .t{flex:1;min-width:0}
.glist li .t small{display:block;color:var(--muted);font:500 11px var(--mono)}
.res{font:700 11px var(--mono);letter-spacing:.08em;text-transform:uppercase;padding:4px 8px;border-radius:999px;white-space:nowrap}
.res.win{color:#0b1408;background:var(--win)}.res.lose{color:var(--paper);background:rgba(224,96,79,.35)}.res.play{color:var(--bg);background:var(--amber)}.res.aborted,.res.done{color:var(--muted);background:rgba(255,255,255,.07)}
.sgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.sbox{padding:10px 12px;border-radius:10px;background:var(--shelf2);display:flex;flex-direction:column;gap:2px}
.sbox b{font:800 20px var(--display);font-variant-numeric:tabular-nums}
.sbox span{font:600 11px var(--mono);color:var(--muted);letter-spacing:.04em;display:flex;gap:6px;align-items:center}
.sbox.wide{grid-column:1/-1}
.gpl{display:flex;gap:8px;flex-wrap:wrap;margin-top:4px}
.gpl span{display:inline-flex;gap:6px;align-items:center;font:600 12px var(--mono);padding:4px 9px;border-radius:999px;background:rgba(255,255,255,.06)}
.empty{color:var(--muted);font-size:14px;padding:14px 4px}
.coin{width:42px;height:42px;border-radius:50%;flex:none;display:grid;place-items:center;background:radial-gradient(circle,#f7b955 0 50%,#c27d1c 51% 58%,#f2a33a 59%);box-shadow:inset 0 0 0 3px #c27d1c;color:#7a4a0c;font-size:16px}
.purse b{font:800 40px/1 var(--display);font-variant-numeric:tabular-nums}
.purse span{font:600 11px var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.stats{display:none}
.stats div{font:600 12px var(--mono);color:var(--muted);display:flex;gap:7px;align-items:center}
.stats b{color:var(--paper);font-variant-numeric:tabular-nums}
/* achievements */
.achHead{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.achHead h2{margin:0;font:800 22px var(--display);display:flex;align-items:center;gap:10px}
.achHead h2 i{color:var(--amber)}
.selw{position:relative;display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:999px;padding:0 12px;height:33px;color:var(--muted);font-size:12px}
.selw select{appearance:none;-webkit-appearance:none;background:transparent;border:0;color:var(--paper);font:600 12px/1.2 var(--mono);padding:0 18px 0 0;margin:0;width:auto;cursor:pointer;height:auto;border-radius:0}
.selw select:focus{outline:none}
.selw:focus-within{border-color:var(--amber)}
.selw .fa-chevron-down{position:absolute;right:12px;pointer-events:none;font-size:10px}
.selw option{background:var(--shelf);color:var(--paper)}
.achPts{font:600 12px var(--mono);color:var(--amber);display:inline-flex;gap:6px;align-items:center}
.members .tp{font:600 11px var(--mono);color:var(--muted);white-space:nowrap;display:inline-flex;gap:4px;align-items:center}
.achHead small{font:600 13px var(--mono);color:var(--muted);font-weight:600}
.prog{height:6px;border-radius:3px;background:var(--shelf2);overflow:hidden}
.prog i{display:block;height:100%;background:linear-gradient(90deg,var(--amber),#ffd27a);border-radius:3px;transition:width .6s}
.achGrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));grid-auto-rows:min-content;gap:10px;flex:1;min-height:0;overflow-y:auto;padding:2px 6px 4px 2px;margin-right:-6px;align-content:start}
.ach{position:relative;aspect-ratio:1;height:auto;border-radius:12px;border:1px solid var(--line);background:var(--shelf2);cursor:pointer;display:grid;place-items:center;font-size:24px;color:var(--rc);padding:0;transition:transform .15s,border-color .15s}
.ach:hover{transform:translateY(-2px);border-color:var(--rc)}
.ach.unl{background:radial-gradient(circle at 50% 35%,color-mix(in srgb,var(--rc) 30%,transparent),var(--shelf2) 70%);border-color:color-mix(in srgb,var(--rc) 55%,transparent);box-shadow:0 0 18px color-mix(in srgb,var(--rc) 22%,transparent)}
.ach.lock{color:rgba(236,230,216,.22)}
.ach.lock::after{content:"\f023";font:900 10px "Font Awesome 6 Free";position:absolute;right:7px;bottom:6px;color:var(--muted)}
.ach .rb{position:absolute;left:6px;top:6px;width:6px;height:6px;border-radius:50%;background:var(--rc)}
.ach.new{animation:pop .8s cubic-bezier(.2,1.6,.4,1)}
@keyframes pop{0%{transform:scale(.6)}100%{transform:scale(1)}}
/* doors */
.doors{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.door{position:relative;min-height:clamp(150px,20vw,210px);border-radius:14px;border:1px solid var(--line);padding:24px;text-align:left;cursor:pointer;overflow:hidden;display:flex;flex-direction:column;justify-content:flex-end;gap:6px;transition:transform .2s,border-color .2s}
.door:hover{transform:translateY(-3px);border-color:rgba(236,230,216,.35)}
.door b{font:800 clamp(30px,5vw,54px)/1 var(--display);letter-spacing:-.02em;position:relative;display:flex;align-items:center;gap:14px}
.door b i{font-size:.6em;color:var(--amber)}
.door>span{color:var(--muted);position:relative;max-width:36ch}
.door.shelfd{background:linear-gradient(135deg,#1d2024,#121315)}
.door.shelfd::before{content:"";position:absolute;right:-20px;top:-20px;width:60%;height:120%;background:repeating-linear-gradient(90deg,transparent 0 22px,rgba(242,163,58,.08) 22px 26px);transform:skewX(-12deg)}
.door.tam{background:radial-gradient(circle at 85% 15%,rgba(179,38,30,.45),transparent 55%),linear-gradient(135deg,#221615,#121315)}
.door.tam::before{content:"?";position:absolute;right:24px;top:6px;font:800 clamp(80px,12vw,150px)/1 var(--display);color:rgba(236,230,216,.08)}
/* rarity */
.rar{display:inline-flex;align-items:center;gap:6px;font:700 10px var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--rc);padding:4px 9px;border-radius:999px;background:color-mix(in srgb,var(--rc) 14%,rgba(0,0,0,.55));border:1px solid color-mix(in srgb,var(--rc) 50%,transparent);backdrop-filter:blur(4px)}
/* shelf */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:20px}
.box{position:relative;display:flex;flex-direction:column;background:var(--shelf);border:1px solid var(--line);border-radius:12px;overflow:hidden;text-align:left;padding:0;cursor:pointer;transition:transform .2s,border-color .2s,box-shadow .2s}
.box:hover{transform:translateY(-3px);border-color:var(--rc);box-shadow:0 10px 40px color-mix(in srgb,var(--rc) 20%,transparent)}
.box .rar{position:absolute;right:12px;top:12px;z-index:2}
.box.legendary{border-color:color-mix(in srgb,var(--rc) 45%,transparent)}
.cover{position:relative;aspect-ratio:16/10;overflow:hidden;width:100%}
.label{padding:18px 18px 20px;display:flex;flex-direction:column;gap:10px;flex:1}
.label h2{margin:0;font:800 22px/1.15 var(--display);letter-spacing:-.01em}
.label p{margin:0;color:var(--muted);font-size:15px}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tags i{font:500 11px var(--mono);font-style:normal;letter-spacing:.04em;padding:4px 8px;border:1px solid var(--line);border-radius:999px}
.play{margin-top:auto;font:600 14px var(--body);color:var(--amber);display:flex;align-items:center;gap:8px}
.svo{background:linear-gradient(180deg,#07080a 0%,#151a1f 70%,#2a2d30 100%)}
.svo .bld{position:absolute;bottom:0;display:grid;gap:5px;padding:8px;background:#3a3e40}
.svo .bld b{display:block;width:10px;height:13px;background:#0c1013}
.svo .bld b.l{background:#e0a548;box-shadow:0 0 8px rgba(224,165,72,.6)}
.svo .stamp{position:absolute;left:8%;top:24%;font:400 clamp(44px,8vw,70px)/1 "Ruslan Display",Impact,serif;color:var(--stamp);border:.06em solid currentColor;padding:.05em .18em 0;transform:rotate(-6deg);background:rgba(7,8,10,.35)}
.svo .esc{position:absolute;left:8%;top:10%;font:400 clamp(16px,2.4vw,22px) "Ruslan Display",Impact,serif}
.gw{background:radial-gradient(ellipse at 50% 0%,#2b221b,#15110e 75%);display:grid;place-items:center}
.gw .tiles{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;width:82%}
.gw .t{aspect-ratio:3/4;border-radius:3px;background:#efe7d6;display:grid;place-items:center}
.gw .t::before{content:"";width:58%;aspect-ratio:1;border-radius:50%;background:var(--c,#1c1814);box-shadow:inset 0 0 0 3px #efe7d6,inset 0 0 0 5px var(--r,#b3262a)}
.gw .t.d{background:repeating-linear-gradient(45deg,#2b221b 0 5px,#201914 5px 10px)}
.gw .t.d::before{display:none}
.gw .q{position:absolute;right:7%;top:9%;font:700 clamp(40px,7vw,64px)/1 "Alegreya SC",Georgia,serif;color:#c8a24a}
.quizc{background:radial-gradient(ellipse 70% 60% at 50% 0%,rgba(255,210,63,.3),transparent 70%),linear-gradient(160deg,#1b1440,#120d2b);display:grid;place-items:center}
.quizc .qt{display:grid;grid-template-columns:1fr 1fr;gap:8px;width:52%}
.quizc .qt i{aspect-ratio:1;border-radius:10px;display:grid;place-items:center;color:#fff;font-size:clamp(16px,2.4vw,24px);box-shadow:0 4px 0 rgba(0,0,0,.3)}
.quizc .qq{position:absolute;font:900 clamp(60px,10vw,110px)/1 "Arial Black",var(--display);color:#ffd23f;text-shadow:0 6px 0 rgba(0,0,0,.4)}
.runesc{background:radial-gradient(ellipse 70% 60% at 50% 20%,rgba(217,164,65,.28),transparent 70%),linear-gradient(160deg,#241f2d,#110f16);display:grid;place-items:center}
.runesc .rl{display:flex;gap:8px;padding:10px;border-radius:12px;border:2px solid #d9a441;background:#0d0b12;box-shadow:0 0 0 4px #3a2a10}
.runesc .rl i{width:clamp(34px,5vw,46px);aspect-ratio:3/4;border-radius:7px;background:linear-gradient(180deg,#f3ead6,#d6c7a6);display:grid;place-items:center;font-size:clamp(14px,2vw,20px)}
.runesc .gl{position:absolute;font:400 clamp(28px,4vw,40px) "Noto Sans Runic","Segoe UI Historic",serif;color:#5ee6c8;text-shadow:0 0 16px #5ee6c8}
.evhead{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:20px}
.evhead h2{margin:6px 0 8px;font:800 clamp(34px,5vw,56px)/1 var(--display)}
.evhead p.muted{margin:0;max-width:60ch}
.evgrid{display:grid;grid-template-columns:1.4fr 1fr;gap:20px}
.soon{align-self:flex-start;font:700 11px var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--bg);background:var(--amber);padding:5px 10px;border-radius:999px}
.bracket{display:grid;grid-template-columns:repeat(3,1fr);gap:24px;align-items:stretch;min-height:260px;opacity:.55}
.bracket .rnd{display:flex;flex-direction:column;justify-content:space-around;gap:12px}
.bracket .rnd>i{height:36px;border-radius:8px;border:1px dashed rgba(236,230,216,.3);background:repeating-linear-gradient(135deg,transparent 0 8px,rgba(255,255,255,.03) 8px 16px);position:relative}
.bracket .rnd>i::after{content:"";position:absolute;right:-25px;top:50%;width:24px;border-top:1px dashed rgba(236,230,216,.3)}
.bracket .r3>i::after{display:none}
.bracket .fin{display:grid;place-items:center;color:var(--amber);font-size:16px;border-style:solid!important;border-color:var(--amber)!important}
.feat{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:14px}
.feat li{display:flex;gap:14px;align-items:center;font-size:16px}
.feat li i{width:40px;height:40px;border-radius:10px;display:grid;place-items:center;flex:none;background:rgba(242,163,58,.14);color:var(--amber)}
/* tamada */
.tamhead{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap}
.tamhead h2{margin:0;font:800 clamp(34px,6vw,64px)/1 var(--display);letter-spacing:-.02em}
.tcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,270px));gap:22px;perspective:1400px}
.tc{position:relative;aspect-ratio:3/4;border:0;padding:0;background:none;cursor:pointer}
.tc .in{position:absolute;inset:0;transition:transform .7s cubic-bezier(.3,.7,.3,1);transform-style:preserve-3d}
.tc.open .in{transform:rotateY(180deg)}
.tc .bk,.tc .fr{position:absolute;inset:0;border-radius:14px;backface-visibility:hidden;-webkit-backface-visibility:hidden;overflow:hidden}
.tc .bk{background:radial-gradient(circle at 50% 40%,#2a1c1a,#141516);border:1px solid var(--line);display:grid;place-items:center}
.tc .bk::before{content:"?";font:800 120px/1 var(--display);color:rgba(236,230,216,.14)}
.tc .bk::after{content:"";position:absolute;inset:12px;border:1px dashed rgba(236,230,216,.12);border-radius:10px}
.tc .fr{transform:rotateY(180deg);background:var(--shelf);border:1px solid var(--line);display:flex;flex-direction:column}
.tc .fr .cover{aspect-ratio:auto;flex:1}
.tc .fr .rar{position:absolute;right:12px;top:12px;z-index:2}
.tc .fr h3{margin:0;padding:14px 16px;font:800 18px/1.15 var(--display)}
.tc.mine .bk{box-shadow:0 0 0 3px var(--amber)}
.tc.lit .bk,.tc.lit .fr{box-shadow:0 0 0 4px var(--paper),0 0 40px rgba(242,163,58,.5)}
.tc.win .fr{box-shadow:0 0 0 4px var(--rc),0 0 70px color-mix(in srgb,var(--rc) 65%,transparent)}
.tc .votes{position:absolute;left:0;right:0;bottom:34px;display:flex;flex-direction:column;align-items:center;gap:8px;z-index:2;pointer-events:none}
.tc .votes .pips{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;max-width:80%}
.tc .votes .pips i{font-size:18px;color:var(--amber);filter:drop-shadow(0 0 6px rgba(242,163,58,.6))}
.tc .votes span{font:700 15px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--paper);background:rgba(10,10,12,.72);border:1px solid rgba(236,230,216,.18);padding:6px 14px;border-radius:999px;backdrop-filter:blur(4px)}
.tc .votes span.mine{color:var(--amber)}
.tc.open .votes{bottom:74px}
/* frame + lobby tab */
#frameWrap{position:fixed;inset:0;z-index:40;background:#000}
#frame{width:100%;height:100%;border:0;display:block}
#fab{position:fixed;left:0;top:50%;transform:translateY(-50%);z-index:45;border:1px solid var(--line);border-left:0;border-radius:0 10px 10px 0;background:rgba(23,25,28,.88);backdrop-filter:blur(6px);color:var(--paper);padding:12px 9px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:6px;font:600 11px var(--mono)}
#fab:hover{background:var(--shelf2);color:var(--amber)}
#fab i{font-size:16px}
#fab .dot{width:7px;height:7px;border-radius:50%;background:var(--muted)}
#fab.on .dot{background:var(--win)}
/* lobby popover */
#pop{position:fixed;z-index:70;width:min(420px,calc(100vw - 32px));max-height:calc(100vh - 100px);overflow:auto;background:var(--shelf);border:1px solid rgba(236,230,216,.2);border-radius:14px;padding:20px;display:flex;flex-direction:column;gap:14px;box-shadow:0 30px 80px rgba(0,0,0,.65)}
#pop.atChip{top:66px;right:max(16px,calc((100vw - 1180px)/2))}
#pop.atFab{left:52px;top:50%;transform:translateY(-50%)}
.code{font:800 40px/1 var(--display);color:var(--amber);letter-spacing:.06em}
.members{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.members li{display:flex;align-items:center;gap:10px;padding:9px;border-radius:10px;background:var(--shelf2);min-width:0}
.members .info{min-width:0;flex:1;cursor:pointer;background:none;border:0;padding:0;text-align:left}
.members .info b{display:block;font:600 15px var(--body);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.members .info small{display:flex;gap:6px;align-items:center;color:var(--muted);font-size:12px;overflow:hidden;white-space:nowrap}
.members .info small .ig{color:var(--lose)}
.members .ch{font:600 13px var(--mono);font-variant-numeric:tabular-nums;color:var(--amber);white-space:nowrap}
.stake{display:flex;gap:8px;align-items:flex-end;flex-wrap:wrap}
.stake label{flex:1;min-width:140px}
/* modal */
.modal{position:fixed;inset:0;z-index:60;background:rgba(6,7,8,.72);display:grid;place-items:center;overflow:auto;padding-block:24px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.mbox{width:min(520px,100%);background:var(--shelf);border:1px solid var(--line);border-radius:14px;padding:24px;display:flex;flex-direction:column;gap:16px;box-shadow:0 30px 80px rgba(0,0,0,.6)}
.mbox h2{margin:0;font:800 26px/1.15 var(--display);letter-spacing:-.01em}
.mbox p{margin:0}
label{display:flex;flex-direction:column;gap:6px;font:600 11px var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
input[type=text],input[type=number],select{font:500 17px var(--body);color:var(--paper);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:11px 12px;width:100%}
select option:disabled{color:#555}
.note{font-size:14px;color:var(--muted);margin:0}
.note.err{color:var(--lose)}
.evs{display:flex;flex-direction:column;gap:6px;max-height:300px;overflow:auto}
.ev{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 12px;border-radius:8px;border:1px solid var(--line);background:transparent;text-align:left;cursor:pointer}
.ev:hover{border-color:rgba(236,230,216,.35)}
.ev[aria-pressed="true"]{border-color:var(--amber);background:rgba(242,163,58,.08)}
.ev b{font:700 14px var(--mono);color:var(--amber);white-space:nowrap}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tabs button{border:1px solid var(--line);background:transparent;border-radius:999px;padding:6px 12px;font-size:13px;cursor:pointer;display:inline-flex;gap:7px;align-items:center}
.tabs button[aria-pressed="true"]{background:var(--paper);color:var(--bg)}
.payout{font:600 13px var(--mono);color:var(--muted);margin:0}
.bets{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px;max-height:360px;overflow:auto}
.bets li{display:flex;gap:10px;align-items:center;padding:10px 12px;border-radius:8px;background:var(--shelf2);font-size:14px}
.bets li .t{flex:1;min-width:0}
.bets li .t small{display:block;color:var(--muted);font:500 11px var(--mono)}
.bets .st{font:600 12px var(--mono);white-space:nowrap}
.bets .won{color:var(--win)}.bets .lost{color:var(--lose)}.bets .open{color:var(--amber)}.bets .back{color:var(--muted)}
.achBig{width:120px;height:120px;margin:0 auto;border-radius:24px;display:grid;place-items:center;font-size:54px;color:var(--rc);background:radial-gradient(circle at 50% 35%,color-mix(in srgb,var(--rc) 35%,transparent),var(--shelf2) 72%);border:1px solid color-mix(in srgb,var(--rc) 55%,transparent)}
.achBig.lock{color:rgba(236,230,216,.25);background:var(--shelf2);border-color:var(--line)}
.mach{text-align:center;align-items:center}
.mach h2{text-align:center}
.miniach{display:flex;gap:6px;flex-wrap:wrap}
.miniach i{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;font-size:13px;color:var(--rc);background:color-mix(in srgb,var(--rc) 18%,var(--shelf2))}
/* notifications */
#notifs{position:fixed;right:16px;top:16px;z-index:90;display:flex;flex-direction:column;gap:10px;width:min(360px,calc(100vw - 32px));pointer-events:none}
.nt{pointer-events:auto;position:relative;overflow:hidden;background:rgba(23,25,28,.96);backdrop-filter:blur(8px);border:1px solid rgba(236,230,216,.16);border-left:4px solid var(--nc,var(--amber));border-radius:12px;padding:14px 14px 16px;display:grid;grid-template-columns:40px 1fr auto;gap:12px;align-items:start;box-shadow:0 16px 40px rgba(0,0,0,.55);animation:ntIn .35s cubic-bezier(.2,1.3,.4,1)}
.nt.out{animation:ntOut .3s forwards}
@keyframes ntIn{from{transform:translateX(30px);opacity:0}}
@keyframes ntOut{to{transform:translateX(30px);opacity:0}}
.nt .ic{width:40px;height:40px;border-radius:10px;display:grid;place-items:center;background:color-mix(in srgb,var(--nc,var(--amber)) 20%,transparent);color:var(--nc,var(--amber));font-size:18px;overflow:hidden}
.nt .ic .ava{width:40px;height:40px;border-radius:10px}
.nt b{display:block;font:700 14px/1.3 var(--body)}
.nt p{margin:3px 0 0;font-size:13px;color:var(--muted);overflow-wrap:anywhere}
.nt .x{background:none;border:0;color:var(--muted);cursor:pointer;padding:2px 4px;font-size:14px}
.nt .x:hover{color:var(--paper)}
.nt .acts{grid-column:2/4;display:flex;gap:8px;margin-top:2px}
.nt .acts .btn{padding:7px 12px;font-size:13px}
.nt .acts .btn.yes{background:var(--win);color:#0b1408}
.nt .acts .btn.yes:hover{background:var(--paper)}
.nt .delta{grid-column:2/4;display:flex;align-items:baseline;gap:10px;font:800 22px var(--display);font-variant-numeric:tabular-nums}
.nt .delta .d{font:700 14px var(--mono)}
.nt .delta.up{color:var(--win)}.nt .delta.down{color:var(--lose)}
.nt .delta .coin{width:22px;height:22px;font-size:9px;align-self:center}
.nt .tm{position:absolute;left:0;bottom:0;height:3px;background:var(--nc,var(--amber));opacity:.7;transform-origin:left;animation:tm linear forwards}
@keyframes tm{to{transform:scaleX(0)}}
@media (max-width:860px){.desk,.doors{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){.tc .in,.door,.box,.nt{transition:none;animation:none}}
</style>
</head>

<script>
(()=>{
'use strict';
window.__gameShell=true;
const $=s=>document.querySelector(s);
const rnd=()=>Math.random().toString(36).slice(2,8);
const CC=String.fromCharCode;
const BAD=new RegExp('['+CC(0)+'-'+CC(31)+CC(127)+'-'+CC(159)+CC(0x200b)+'-'+CC(0x200f)+CC(0x2028)+'-'+CC(0x202e)+CC(0x2060)+'-'+CC(0x206f)+']','g');
const clean=(s,n=20)=>String(s||'').replace(BAD,'').trim().slice(0,n);
const num=(v,d=0)=>typeof v==='number'&&Number.isFinite(v)?v:d;
const str=(v,n=40)=>typeof v==='string'?v.slice(0,n):'';
const obj=v=>v&&typeof v==='object'&&!Array.isArray(v)?v:null;
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

/* ================= i18n ================= */

function hash(s){let h=2166136261;for(const ch of String(s)){h^=ch.codePointAt(0);h=Math.imul(h,16777619);}return h>>>0;}
function ava(name){const h=hash(name),hue=h%360,h2=(hue+140)%360,sides=3+(h>>>9)%5,rot=(h>>>4)%360;
  const pts=Array.from({length:sides},(_,i)=>{const t=i/sides*Math.PI*2+rot*Math.PI/180;return (50+Math.cos(t)*40).toFixed(1)+','+(50+Math.sin(t)*40).toFixed(1);}).join(' ');
  const ini=String(name||'?').replace(/[^\p{L}\p{N}]/gu,'').slice(0,1).toUpperCase()||'?';
  return `<svg viewBox="0 0 100 100" aria-hidden="true"><rect width="100" height="100" fill="hsl(${hue} 32% 22%)"/><polygon points="${pts}" fill="hsl(${h2} 45% 40%)" stroke="hsl(${h2} 60% 62%)" stroke-width="3"/><circle cx="50" cy="50" r="23" fill="hsl(${hue} 30% 14%)"/><text x="50" y="61" text-anchor="middle" font-family="Unbounded, sans-serif" font-weight="800" font-size="28" fill="#ece6d8">${esc(ini)}</text></svg>`;}

/* ================= modal open/close with motion ================= */
function showM(el){if(!el)return;clearTimeout(el._ct);el.classList.remove('closing');el.hidden=false;}
function hideM(el){if(!el||el.hidden||el.classList.contains('closing'))return;el.classList.add('closing');el._ct=setTimeout(()=>{el.hidden=true;el.classList.remove('closing');},170);}
function segThumb(seg){if(!seg)return;let t=seg.querySelector(':scope>.thumb');if(!t){t=document.createElement('i');t.className='thumb';seg.prepend(t);}
  const b=seg.querySelector(':scope>button[aria-pressed="true"]');if(!b||!b.offsetWidth){t.style.opacity=0;return;}t.style.opacity=1;t.style.left=b.offsetLeft+'px';t.style.width=b.offsetWidth+'px';}
const segAll=()=>document.querySelectorAll('.seg').forEach(segThumb);
/* fade a scroll box's edge only where content continues past it */
function scrollFade(el){const upd=()=>{const t=el.scrollTop>2,b=el.scrollTop+el.clientHeight<el.scrollHeight-2;el.classList.toggle('ft',t);el.classList.toggle('fb',b);};
  el.addEventListener('scroll',upd,{passive:true});try{new ResizeObserver(upd).observe(el);}catch(e){}new MutationObserver(()=>requestAnimationFrame(upd)).observe(el,{childList:true,subtree:true,attributes:true,attributeFilter:['hidden']});upd();}

/* ================= notifications ================= */
const NT=new Map();
function notify(o){
  const box=$('#notifs');const el=document.createElement('div');el.className='nt';el.style.setProperty('--nc',o.color||'var(--amber)');
  const ic=document.createElement('div');ic.className='ic';if(o.avatar){ic.innerHTML=`<div class="ava">${ava(o.avatar)}</div>`;}else ic.innerHTML=`<i class="fa-solid ${o.icon||'fa-bell'}"></i>`;
  const body=document.createElement('div');const b=document.createElement('b');b.textContent=o.title||'';body.appendChild(b);if(o.text){const p=document.createElement('p');p.textContent=o.text;body.appendChild(p);}
  const x=document.createElement('button');x.type='button';x.className='x';x.setAttribute('aria-label',T('close'));x.innerHTML='<i class="fa-solid fa-xmark"></i>';x.onclick=()=>{dismiss(el);if(o.onClose)o.onClose();};
  el.append(ic,body,x);
  if(o.chips){const d=document.createElement('div');const up=o.chips.to>=o.chips.from;d.className='delta '+(up?'up':'down');
    d.innerHTML='<i class="coin"><i class="fa-solid fa-star"></i></i><span class="v"></span><span class="d"></span>';el.appendChild(d);
    d.querySelector('.d').textContent=(up?'+':'−')+fmtN(Math.abs(o.chips.to-o.chips.from));countUp(d.querySelector('.v'),o.chips.from,o.chips.to);}
  if(o.actions){const a=document.createElement('div');a.className='acts';
    for(const ac of o.actions){const bt=document.createElement('button');bt.type='button';bt.className='btn '+(ac.primary?'yes':'ghost');bt.innerHTML=(ac.icon?`<i class="fa-solid ${ac.icon}"></i>`:'')+esc(ac.label);bt.onclick=()=>{dismiss(el);ac.fn();};a.appendChild(bt);}el.appendChild(a);}
  const ttl=o.ttl||5000;const tm=document.createElement('i');tm.className='tm';tm.style.animationDuration=ttl+'ms';el.appendChild(tm);
  el._t=setTimeout(()=>{dismiss(el);if(o.onClose)o.onClose();},ttl);
  if(o.key){if(NT.has(o.key))dismiss(NT.get(o.key));NT.set(o.key,el);el._key=o.key;}
  box.prepend(el);while(box.children.length>5)dismiss(box.lastChild,true);
  return el;
}
function dismiss(el,now){if(!el||el._gone)return;el._gone=true;clearTimeout(el._t);if(el._key&&NT.get(el._key)===el)NT.delete(el._key);if(now){el.remove();return;}el.classList.add('out');setTimeout(()=>el.remove(),300);}
function dismissKey(k){if(NT.has(k))dismiss(NT.get(k));}
function toast(m,icon){notify({title:m,icon:icon||'fa-circle-info',ttl:3200});}
function countUp(el,from,to){const t0=performance.now(),dur=1300;const step=t=>{const k=Math.min(1,(t-t0)/dur);const e=1-Math.pow(1-k,3);el.textContent=fmtN(from+(to-from)*e);if(k<1)requestAnimationFrame(step);};el.textContent=fmtN(from);setTimeout(()=>requestAnimationFrame(step),250);}
function boom(big){if(typeof window.confetti!=='function')return;try{const c=['#f2a33a','#ffd27a','#7fd36a','#ece6d8','#b26cf5'];
  window.confetti({particleCount:big?160:90,spread:big?100:70,origin:{x:.82,y:.12},colors:c,zIndex:95,disableForReducedMotion:true});
  if(big)setTimeout(()=>window.confetti({particleCount:120,angle:60,spread:70,origin:{x:0,y:.7},colors:c,zIndex:95,disableForReducedMotion:true}),250);}catch(e){}}

  sel.onchange=()=>{achG=sel.value;achSig='';renderAch();$('#achGrid').scrollTop=0;};

function renderAch(){
  if(!prof)return;const pool=ACH.filter(a=>achG==='any'||a.g===achG);const list=pool.filter(a=>achF==='all'||(achF==='open'?!!prof.ach[a.id]:!prof.ach[a.id]));const got=pool.filter(a=>prof.ach[a.id]).length;
  const sig=achF+achG+'|'+Object.keys(prof.ach).join()+cfg.lang;if(sig===achSig)return;achSig=sig;

const PFX='gsl1-';const popts=()=>Object.assign({debug:0},window.SVO_PEER||{});
let myLabel='';try{myLabel=sessionStorage.getItem('gs-label')||'';}catch(e){}
if(!/^u[a-z0-9]{6,12}$/.test(myLabel)){myLabel='u'+Math.random().toString(36).slice(2,10);try{sessionStorage.setItem('gs-label',myLabel);}catch(e){}}
const LB={label:myLabel,code:'',hub:null,client:null,conn:null,hubConns:new Set(),hubLabel:null,connected:false,closed:true,others:new Map(),lastAll:0,migrating:false,pend:null,t0:Date.now()};
let where='home',curGame=null,GP=null;
function myPres(){return {v:1,n:prof?prof.name:'',s:prof?prof.status:'',c:prof?prof.chips:0,w:where,t0:LB.t0,gk:curGame,gp:curGame?GP:null,ac:prof?Object.keys(prof.ach||{}):[]};}
function members(){const out=[{label:LB.label,me:true,p:myPres()}];for(const [k,v] of LB.others)out.push({label:k,me:false,p:v.pres});return out;}
function inLobby(){return !!LB.code;}
function deliver(m){try{onEvent(m);}catch(e){console.warn(e);}}
function route(m){const msg={t:'e',l:m.l,to:m.to||null,k:String(m.k||''),d:m.d};if(!msg.to||msg.to===LB.label)deliver(msg);
  for(const c of LB.hubConns){if(!c.open)continue;if(!msg.to||c.label===msg.to){try{c.send(msg);}catch(_){}}}}
function emit(k,d,to){const m={t:'e',l:LB.label,to:to||null,k,d};
  if(!inLobby()){if(!to||to===LB.label)deliver(m);return;}
  if(LB.hub)route(m);else if(LB.conn&&LB.conn.open){try{LB.conn.send(m);}catch(_){}}}
function startHub(cb){
  let ok=false;const hp=new Peer(PFX+LB.code,popts());
  hp.on('open',()=>{ok=true;LB.hub=hp;LB.hubLabel=LB.label;LB.connected=true;cb(true);});
  hp.on('error',e=>{if(!ok){try{hp.destroy();}catch(_){}cb(false,e&&e.type==='unavailable-id'?'taken':'net');}});
  hp.on('connection',c=>{LB.hubConns.add(c);
    c.on('data',m=>{if(!m||typeof m!=='object')return;
      if(m.t==='p'&&typeof m.l==='string'&&m.l.length<40){c.label=m.l;LB.others.set(m.l,{pres:obj(m.d)||{},t:performance.now()});}
      else if(m.t==='e'&&typeof m.l==='string'&&m.l===c.label)route(m);});
    const drop=()=>{LB.hubConns.delete(c);if(c.label)LB.others.delete(c.label);};c.on('close',drop);c.on('error',drop);});
  hp.on('disconnected',()=>{if(!LB.closed&&LB.hub===hp)setTimeout(()=>{try{hp.reconnect();}catch(_){}},1000);});
}
function ensureClient(cb){
  if(LB.client&&LB.client.open&&!LB.client.destroyed){cb(true);return;}
  if(LB.client){try{LB.client.destroy();}catch(_){}}
  const cp=new Peer(popts());LB.client=cp;let opened=false;
  cp.on('open',()=>{opened=true;cb(true);});
  cp.on('error',e=>{if(!opened){cb(false,'net');return;}if(e&&e.type==='peer-unavailable'&&LB.pend)LB.pend(false,'nf');});
  cp.on('disconnected',()=>{if(!LB.closed&&LB.client===cp)setTimeout(()=>{try{cp.reconnect();}catch(_){}},1000);});
}
function connectClient(cb){
  ensureClient((ok,err)=>{
    if(!ok){cb(false,err);return;}
    const c=LB.client.connect(PFX+LB.code,{reliable:true,serialization:'json'});let called=false,to=0;
    const fin=(a,b)=>{if(called)return;called=true;clearTimeout(to);if(LB.pend===fin)LB.pend=null;if(!a){try{c.close();}catch(_){}}cb(a,b);};
    LB.pend=fin;to=setTimeout(()=>fin(false,'timeout'),9000);
    c.on('open',()=>{LB.conn=c;LB.connected=true;LB.lastAll=performance.now();fin(true);});
    c.on('data',m=>{if(!m||typeof m!=='object')return;
      if(m.t==='all'&&obj(m.ps)){LB.lastAll=performance.now();LB.hubLabel=str(m.h);const seen=new Set();
        for(const k in m.ps){if(k===LB.label||k.length>40)continue;LB.others.set(k,{pres:obj(m.ps[k])||{},t:performance.now()});seen.add(k);}
        for(const k of [...LB.others.keys()])if(!seen.has(k))LB.others.delete(k);}
      else if(m.t==='e')deliver(m);});
    c.on('close',()=>{if(LB.conn===c){LB.conn=null;LB.connected=false;if(!LB.closed)migrate();}});
    c.on('error',()=>{});
  });
}
function migrate(){
  if(LB.migrating||LB.closed)return;LB.migrating=true;
  if(LB.hubLabel)LB.others.delete(LB.hubLabel);
  const first=[LB.label,...LB.others.keys()].sort()[0];let tries=0;
  const again=()=>{if(!LB.closed&&tries<40)setTimeout(attempt,1500);};
  const attempt=()=>{if(LB.closed)return;tries++;
    if(first===LB.label||tries>5)startHub(ok=>{if(ok){LB.migrating=false;LB.conn=null;try{LB.client&&LB.client.destroy();}catch(_){}LB.client=null;}else connectClient(ok2=>{if(ok2)LB.migrating=false;else again();});});
    else connectClient(ok=>{if(ok)LB.migrating=false;else again();});};
  setTimeout(attempt,first===LB.label?600:2200);
}
setInterval(()=>{
  if(!inLobby())return;
  if(LB.hub){const now=performance.now();for(const [k,v] of LB.others)if(now-v.t>8000)LB.others.delete(k);
    const ps={};ps[LB.label]=myPres();for(const [k,v] of LB.others)ps[k]=v.pres;const msg={t:'all',h:LB.label,ps};
    for(const c of LB.hubConns)if(c.open){try{c.send(msg);}catch(_){}}}
  else if(LB.conn){
    if(performance.now()-LB.lastAll>4000){const c=LB.conn;LB.conn=null;LB.connected=false;try{c.close();}catch(_){}migrate();}
    else if(LB.conn.open){try{LB.conn.send({t:'p',l:LB.label,d:myPres()});}catch(_){}}}
},100);
function joinLobby(code,create){
  return new Promise(resolve=>{
    if(typeof window.Peer!=='function'){resolve('lib');return;}
    leaveLobby(true);LB.code=code;LB.closed=false;LB.t0=Date.now();
    const done=(ok,err)=>{if(ok){try{sessionStorage.setItem('gs-lobby',code);}catch(e){}resolve('ok');}else{leaveLobby(true);resolve(err||'net');}};
    if(create)startHub(done);else connectClient(done);
  });
}
function leaveLobby(silent){
  LB.closed=true;for(const c of LB.hubConns){try{c.close();}catch(_){}}LB.hubConns.clear();
  try{LB.conn&&LB.conn.close();}catch(_){}try{LB.client&&LB.client.destroy();}catch(_){}try{LB.hub&&LB.hub.destroy();}catch(_){}
  LB.conn=null;LB.client=null;LB.hub=null;LB.hubLabel=null;LB.connected=false;LB.others.clear();LB.code='';LB.migrating=false;
  if(!silent){try{sessionStorage.removeItem('gs-lobby');}catch(e){}}
}
addEventListener('pagehide',()=>leaveLobby(true));



/* ================= events ================= */
function memberName(label){if(label===LB.label)return prof.name;const o=LB.others.get(label);return o&&o.pres.n?clean(o.pres.n):'—';}
function onEvent(m){
  const k=m.k,d=obj(m.d)||{};
  if(k==='tam')onTam(m.l,d);
  else if(k==='bet')onBetBroadcast(d);
  else if(k==='gstart')onGStart(d);
  else if(k==='gev')onGev(d);
  else if(k==='gend')onGEnd(d);
  else if(k==='gabort')abortSession(str(d.gid));
  else if(k==='inv')onInvite(m.l,d);
  else if(k==='g'){const w=frameWin();if(curGame&&d.game===curGame&&w)w.postMessage({svo:1,type:'ev',from:m.l,k:'g',d},'*');
    if(obj(d.m)&&d.m.t==='dec'&&m.l!==LB.label)notify({avatar:memberName(m.l),title:T('declined',{n:memberName(m.l)}),ttl:3500,color:'var(--lose)'});}
}

/* ================= invites ================= */
let pendingAccept=null;
function sendInvite(to,game){if(!inLobby()||!GM[game])return;if(bump('inv')>=5)unlock('p_inviter');emit('inv',{id:rnd(),game},to);notify({icon:'fa-paper-plane',title:T('inv_sent'),text:T('inv_sent_d',{n:memberName(to)}),ttl:3000});}
function onInvite(from,d){
  const game=str(d.game);if(!GM[game]||from===LB.label)return;const n=memberName(from);
  notify({avatar:n,color:rc(GM[game].r),title:T('inv_t'),text:T('inv',{n,g:gname(game)}),ttl:30000,key:'inv'+from,
    actions:[{label:T('accept'),icon:'fa-check',primary:true,fn:()=>acceptInvite(from,game)},{label:T('decline'),icon:'fa-xmark',fn:()=>emit('g',{game,m:{t:'dec'}},from)}],
    onClose:null});
}
function acceptInvite(from,game){
  closePop();pendingAccept={from,game};
  if(curGame===game){flushAccept();return;}
  openGame(game);
}
function flushAccept(){if(!pendingAccept||curGame!==pendingAccept.game)return;const w=frameWin();if(!w)return;w.postMessage({svo:1,type:'accept',from:pendingAccept.from,game:pendingAccept.game},'*');pendingAccept=null;}

/* ================= bets ================= */
const pools={};const sessions={};
function pool(g){return pools[g]||(pools[g]={total:0,by:{}});}
function odds(evId,sub){const e=EV[evId];const p=pool(e.g);const key=evId+'|'+(sub||'');const pe=p.by[key]||0;return Math.max(1.1,Math.round(e.base*(500+p.total-pe)/(500+pe)*100)/100);}
function onBetBroadcast(d){const e=EV[str(d.ev)];if(!e)return;const amt=Math.max(0,Math.min(1e7,Math.floor(num(d.amt))));const p=pool(e.g);p.total+=amt;const key=e.id+'|'+str(d.sub);p.by[key]=(p.by[key]||0)+amt;}
function runningGid(g){for(const id in sessions){const s=sessions[id];if(s.game===g&&!s.ended)return id;}return null;}
function inGame(label){for(const id in sessions){const s=sessions[id];if(!s.ended&&s.players.includes(label))return s.game;}return null;}
function evText(b){const e=EV[b.ev];return e?e.t[L()].replace('{n}',b.subName||''):b.ev;}
function payWin(b){b.st='won';b.won=Math.round(b.stake*b.k);const from=prof.chips;prof.chips+=b.won;prof.streak++;prof.cnt.lose=0;prof.best=Math.max(prof.best,b.won);if(b.k>=4)setTimeout(()=>unlock('p_underdog'),300);
  notify({icon:'fa-sack-dollar',color:'var(--win)',title:T('won_t'),text:evText(b),chips:{from,to:prof.chips},ttl:7000});boom(b.won>=1000);
  unlock('p_win');if(prof.streak>=3)unlock('p_streak');if(b.won>=1000)unlock('p_big');checkWealth();}
function payLose(b){b.st='lost';prof.streak=0;if(bump('lose')>=5)unlock('p_lose5');notify({icon:'fa-heart-crack',color:'var(--lose)',title:T('lost_t'),text:evText(b),chips:{from:prof.chips+b.stake,to:prof.chips},ttl:6000});}
function onGStart(d){const gid=str(d.gid),game=str(d.game);if(!gid||!GM[game])return;
  const players=Array.isArray(d.players)?d.players.map(x=>str(x)).filter(Boolean).slice(0,8):[];
  if(!sessions[gid])sessions[gid]={game,players,first:{},ended:false,seen:performance.now()};
  if(players.includes(LB.label)){markPlayed(game);if(!Array.isArray(prof.games))prof.games=[];if(!prof.games.some(g=>g.gid===gid)){prof.games.unshift({gid,game,t:Date.now(),st:'play'});prof.games=prof.games.slice(0,40);}}
  for(const b of prof.bets)if(b.st==='open'&&b.game===game&&!b.gid&&(!b.sub||players.includes(b.sub)))b.gid=gid;saveProf();renderHome();}
function onGev(d){
  const gid=str(d.gid),game=str(d.game),ev=str(d.ev),sub=str(d.sub);if(!gid||!GM[game])return;
  if(sub===LB.label){ownEvent(ev,obj(d.x));const ge=(prof.games||[]).find(g=>g.gid===gid);if(ge){if(['svo.escape','gw.win','quiz.win','runes.castle'].includes(ev))ge.res='win';saveProf();}}
  const s=sessions[gid]||(sessions[gid]={game,players:[],first:{},ended:false,seen:performance.now()});if(s.ended)return;
  if(sub&&!s.players.includes(sub))s.players.push(sub);
  let firstSub=null;if(EVENTS.some(e=>e.kind==='first'&&e.on===ev)){if(s.first[ev]===undefined){s.first[ev]=sub;firstSub=sub;}}
  let ch=false;
  for(const b of prof.bets){if(b.st!=='open'||b.gid!==gid)continue;const E=EV[b.ev];if(!E)continue;
    if(E.kind==='yes'&&E.id===ev&&b.sub===sub){payWin(b);ch=true;}
    else if(E.kind==='first'&&E.on===ev&&firstSub!==null){if(b.sub===firstSub)payWin(b);else payLose(b);ch=true;}}
  if(ch){saveProf();renderHome();}
}
function onGEnd(d){
  const gid=str(d.gid),game=str(d.game);if(!gid||!GM[game])return;const s=sessions[gid]||(sessions[gid]={game,players:[],first:{},ended:false});if(s.ended)return;s.ended=true;
  const sum=obj(d.sum)||{};const players=Array.isArray(sum.players)?sum.players.map(x=>str(x)):s.players;const escd=Array.isArray(sum.esc)?sum.esc.map(x=>str(x)):[];const q=num(sum.q,-1);
  const groupWin={'svo.all_escape':players.length>0&&players.every(p=>escd.includes(p)),'svo.none_escape':escd.length===0,'gw.fast':q>=0&&q<8,'gw.long':q>14};
  if(Array.isArray(sum.g))for(const e of EVENTS)if(e.kind==='group'&&e.g===game&&!(e.id in groupWin))groupWin[e.id]=sum.g.includes(e.id);
  if(game==='svo'&&players.length>=2&&players.includes(LB.label)&&groupWin['svo.all_escape'])unlock('svo_all');
  for(const b of prof.bets){if(b.st!=='open'||b.gid!==gid)continue;const E=EV[b.ev];
    if(E&&E.kind==='group'&&groupWin[b.ev])payWin(b);else payLose(b);}
  const ge=(prof.games||[]).find(g=>g.gid===gid);if(ge){ge.st='done';if(!ge.res)ge.res=players.includes(LB.label)?'lose':'done';}
  pools[game]={total:0,by:{}};saveProf();renderHome();
}
function abortSession(gid){const s=sessions[gid];if(s)s.ended=true;let ch=false;const ge=(prof.games||[]).find(g=>g.gid===gid);if(ge&&ge.st==='play'){ge.st='aborted';ch=true;}
  for(const b of prof.bets)if(b.st==='open'&&b.gid===gid){b.st='back';prof.chips+=b.stake;notify({icon:'fa-rotate-left',title:T('refund_t'),text:T('refund',{e:evText(b)}),chips:{from:prof.chips-b.stake,to:prof.chips}});ch=true;}
  if(ch){saveProf();renderHome();}}
setInterval(()=>{ // games everyone walked away from: refund
  const ms=members();
  for(const id in sessions){const s=sessions[id];if(s.ended)continue;const alive=s.players.length===0||s.players.some(p=>{const m=ms.find(x=>x.label===p);const gp=m&&obj(m.p.gp);return m&&m.p.w===s.game&&gp&&(gp.g===id||gp.gid===id);});
    if(alive){s.seen=performance.now();continue;}if(performance.now()-s.seen<15000)continue;abortSession(id);}
  if(LB.hub&&members().length>=3)unlock('p_host');
},2000);
let BET={game:'svo',who:null,ev:null};
function openBet(game,who){
  BET.game=GM[game]?game:(curGame||'svo');BET.ev=null;
  const tabs=$('#betGames');tabs.innerHTML='';
  for(const g of GAMES){const b=document.createElement('button');b.type='button';b.innerHTML=`<i class="fa-solid ${g.icon}"></i>`+esc(gname(g.id));b.setAttribute('aria-pressed',g.id===BET.game);b.onclick=()=>openBet(g.id,BET.who);tabs.appendChild(b);}
  const sel=$('#betWho');sel.innerHTML='';const ms=members();

  const target=who===undefined?BET.who:who;
  sel.value=target&&ms.some(m=>m.label===target)?target:'';BET.who=sel.value||null;
  renderBetEvs();closePop();showM($('#mBet'));
}
function renderBetEvs(){
  const box=$('#betEvs');box.innerHTML='';const who=BET.who;
  const list=EVENTS.filter(e=>e.g===BET.game&&(who?e.kind!=='group':e.kind==='group'));

  for(const e of list){const b=document.createElement('button');b.type='button';b.className='ev';b.setAttribute('aria-pressed',BET.ev===e.id);
    const t=document.createElement('span');t.textContent=e.t[L()].replace('{n}',subName);const k=document.createElement('b');k.textContent='×'+odds(e.id,who).toFixed(2);b.append(t,k);
    b.onclick=()=>{BET.ev=e.id;renderBetEvs();};box.appendChild(b);}
  updatePay();
}
function updatePay(){
  $('#betBal').textContent=T('balance',{n:fmtN(prof.chips)});
  const amt=Math.floor(num(+$('#betAmt').value,0));const n=$('#betNote');n.classList.remove('err');n.textContent='';
  const otherTarget=BET.who&&BET.who!==LB.label;let block=false;

  else{const k=odds(BET.ev,BET.who);$('#betPay').textContent=T('pay',{k:k.toFixed(2),p:fmtN(amt*k)});}
  if(!inLobby()&&(otherTarget||!BET.who)){n.textContent=T('need_lobby_bet');block=true;}
  else if(BET.who&&inGame(BET.who)){n.textContent=T('busy_bet',{n:BET.who===LB.label?prof.name:memberName(BET.who)});n.classList.add('err');block=true;}

  else if(amt>prof.chips){n.textContent=T('low');n.classList.add('err');block=true;}
  $('#betGo').disabled=block;
}
$('#betWho').onchange=e=>{BET.who=e.target.value||null;BET.ev=null;renderBetEvs();};
$('#betAmt').oninput=updatePay;
document.querySelectorAll('[data-amt]').forEach(b=>b.onclick=()=>{$('#betAmt').value=b.dataset.amt==='all'?prof.chips:b.dataset.amt;updatePay();});

/* ================= tamada ================= */
let TM=null;
function startTamada(){
  const order=GAMES.map(g=>g.id);for(let i=order.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[order[i],order[j]]=[order[j],order[i]];}
  unlock('p_tamada');if(bump('tam')>=5)unlock('p_tam5');emit('tam',{a:'start',id:rnd(),order,by:LB.label});
}
function joinTamada(){if(!TM)return;if(curGame)closeGame(true);closePop();show('vTamada');renderTam();}
function onTam(from,d){
  const a=str(d.a);
  if(a==='start'){const order=Array.isArray(d.order)?d.order.map(x=>str(x)).filter(x=>GM[x]):[];if(!order.length)return;
    TM={id:str(d.id),order,votes:{},by:str(d.by),phase:'vote',result:null};
    if(from===LB.label){joinTamada();return;}
    const n=memberName(from);
    notify({avatar:n,color:'var(--stamp)',title:T('tam_call_t'),text:T('tam_call',{n}),ttl:45000,key:'tam',
      actions:[{label:T('accept'),icon:'fa-check',primary:true,fn:joinTamada},{label:T('decline'),icon:'fa-xmark',fn:()=>{}}]});
    return;}
  if(!TM||str(d.id)!==TM.id)return;

    case 'start':emit('gstart',{game:curGame,gid:str(m.gid),players:Array.isArray(m.players)?m.players.map(x=>str(x)).slice(0,8):[]});break;
    case 'abort':emit('gabort',{gid:str(m.gid)});break;
    case 'end':emit('gend',{game:curGame,gid:str(m.gid),sum:obj(m.sum)||{}});break;
    case 'bet':openBet(curGame,str(m.target)||null);break;
    case 'invite':sendInvite(str(m.to),curGame);break;
    case 'stake':{const amt=Math.floor(num(m.amt));const ok=amt>0&&amt<=prof.chips&&amt<=100000;if(ok){const from=prof.chips;prof.chips-=amt;saveProf();notify({icon:'fa-coins',title:T('stake_t'),text:gname(curGame),chips:{from,to:prof.chips},ttl:3500});renderHome();}
      const w=frameWin();if(w)w.postMessage({svo:1,type:'stake',id:str(m.id),ok},'*');break;}
    case 'payout':{const amt=Math.max(0,Math.min(1e6,Math.floor(num(m.amt))));const st=Math.max(0,Math.floor(num(m.stake)));if(!amt)break;const from=prof.chips;prof.chips+=amt;saveProf();
      notify({icon:amt>st?'fa-sack-dollar':'fa-coins',color:amt>st?'var(--win)':'var(--amber)',title:T('payout_t'),text:gname(curGame),chips:{from,to:prof.chips},ttl:6000});if(amt>st)boom(amt>=1000);if(amt>=1000)unlock('r_rich');checkWealth();renderHome();break;}
    case 'lobby':openPop();break;
    case 'exit':closeGame();break;
    case 'lang':if(m.lang==='ru'||m.lang==='en'){cfg.lang=m.lang;applyLang();}break;
  }
});
addEventListener('keydown',e=>{if(e.key==='Escape'){if(!$('#pop').hidden){closePop();return;}for(const id of ['mBet','mView','mBets','mAch'])if(!$('#'+id).hidden){hideM($('#'+id));return;}if(!$('#mProfile').hidden&&prof)hideM($('#mProfile'));}});

/* ================= lang + boot ================= */
function applyLang(){
  document.documentElement.lang=cfg.lang;document.title='ORION';document.querySelectorAll('[data-tt]').forEach(el=>el.dataset.tip=T(el.dataset.tt));
  document.querySelectorAll('[data-t]').forEach(el=>el.textContent=T(el.dataset.t));
  $('#lRu').setAttribute('aria-pressed',cfg.lang==='ru');$('#lEn').setAttribute('aria-pressed',cfg.lang==='en');
  renderAchFilter();requestAnimationFrame(segAll);achSig='';popSig='';panSig='';renderHome();renderPop();if(!$('#vShelf').hidden)renderShelf();if(TM&&!$('#vTamada').hidden)renderTam();if(!$('#mBet').hidden)renderBetEvs();
}
$('#lRu').onclick=()=>setLang('ru');$('#lEn').onclick=()=>setLang('en');
setTimeout(segAll,60);if(document.fonts&&document.fonts.ready)document.fonts.ready.then(segAll);
setInterval(()=>{renderChip();renderPop();if(TM&&TM.phase==='vote'&&where==='tamada'){renderTamNote();maybeFinish();}},500);
function renderTamNote(){const vs=voters();$('#tamNote').textContent=T('tam_note',{v:vs.filter(v=>TM.votes[v]).length,n:Math.max(vs.length,1)});}
applyLang();show('vHome');
if(!prof)openProfile(true);
try{const c=sessionStorage.getItem('gs-lobby');if(c&&/^[a-z0-9]{3,8}$/.test(c)){joinLobby(c,false).then(r=>{if(r==='nf')joinLobby(c,true).then(()=>renderHome());else renderHome();});}}catch(e){}
})();
</script>
</body>
