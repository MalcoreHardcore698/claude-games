<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Игротека</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;800&family=Golos+Text:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&family=Ruslan+Display&family=Alegreya+SC:wght@700&display=swap">
<style>
/* Layout: a player's desk — profile card and lobby side by side, two oversized doors (shelf, tamada) underneath; games open full-screen on top. */
:root{
  --bg:#0e0f11;
  --shelf:#17191c;
  --shelf2:#1f2226;
  --paper:#ece6d8;
  --muted:#8d9095;
  --line:rgba(236,230,216,.12);
  --amber:#f2a33a;
  --stamp:#b3261e;
  --win:#7fb36a;
  --lose:#c8564a;
  --display:"Unbounded", "Arial Black", system-ui, sans-serif;
  --body:"Golos Text", "Segoe UI", system-ui, sans-serif;
  --mono:"IBM Plex Mono", ui-monospace, Menlo, monospace;
  color-scheme:dark;
}
[hidden]{display:none!important}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--paper)}
body{font:400 16px/1.5 var(--body);min-height:100vh;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button{font:inherit;color:inherit}
a{color:inherit}
.app{max-width:1180px;margin:0 auto;padding-block:20px 48px;display:flex;flex-direction:column;gap:28px}
.bar{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.logo{font:800 22px var(--display);letter-spacing:-.02em;text-decoration:none;margin-right:auto;background:none;border:0;padding:0;cursor:pointer}
.logo span+span{color:var(--amber)}
.chip{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:999px;padding:7px 14px;font:600 12px var(--mono);letter-spacing:.06em;background:transparent;cursor:pointer;color:var(--paper)}
.chip .dot{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.chip.on .dot{background:var(--win)}
.seg{display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden}
.seg button{background:transparent;border:0;padding:7px 14px;font:600 12px var(--mono);letter-spacing:.08em;cursor:pointer;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--paper);color:var(--bg)}
.btn{font:600 14px var(--body);padding:12px 18px;border:0;border-radius:6px;background:var(--paper);color:var(--bg);cursor:pointer}
.btn:hover{background:var(--amber)}
.btn.ghost{background:transparent;color:var(--paper);box-shadow:inset 0 0 0 1px var(--line)}
.btn.ghost:hover{box-shadow:inset 0 0 0 1px var(--amber);color:var(--amber);background:transparent}
.btn.sm{padding:7px 12px;font-size:13px}
.btn.bet{background:var(--amber);color:var(--bg);font:700 12px var(--mono);letter-spacing:.08em;padding:7px 12px}
.btn.bet:hover{background:var(--paper)}
.btn:disabled{opacity:.4;cursor:not-allowed}
:focus-visible{outline:2px solid var(--amber);outline-offset:3px}
.eyebrow{margin:0;font:600 11px var(--mono);letter-spacing:.18em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}
/* home */
.desk{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:20px;align-items:start}
.card{background:var(--shelf);border:1px solid var(--line);border-radius:14px;padding:clamp(18px,3vw,28px);display:flex;flex-direction:column;gap:18px;min-width:0}
.who{display:flex;gap:18px;align-items:center;min-width:0}
.ava{width:84px;height:84px;flex:none;border-radius:50%;overflow:hidden}
.ava.s{width:40px;height:40px}
.ava svg{width:100%;height:100%;display:block}
.who h1{margin:0;font:800 clamp(30px,5vw,48px)/1 var(--display);letter-spacing:-.02em;overflow-wrap:anywhere}
.who p{margin:6px 0 0;color:var(--muted);font-size:17px;font-style:italic;overflow-wrap:anywhere}
.purse{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.coin{width:42px;height:42px;border-radius:50%;flex:none;background:radial-gradient(circle,var(--amber) 0 52%,#c27d1c 53% 60%,var(--amber) 61%);box-shadow:inset 0 0 0 3px #c27d1c}
.purse b{font:800 40px/1 var(--display);font-variant-numeric:tabular-nums}
.purse span{font:600 11px var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.code{font:800 44px/1 var(--display);color:var(--amber);letter-spacing:.06em}
.members{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.members li{display:flex;align-items:center;gap:12px;padding:10px;border-radius:10px;background:var(--shelf2);min-width:0}
.members .info{min-width:0;flex:1;cursor:pointer;background:none;border:0;padding:0;text-align:left}
.members .info b{display:block;font:600 15px var(--body);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.members .info small{display:block;color:var(--muted);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.members .ch{font:600 13px var(--mono);font-variant-numeric:tabular-nums;color:var(--amber);white-space:nowrap}
.doors{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.door{position:relative;min-height:clamp(150px,22vw,230px);border-radius:14px;border:1px solid var(--line);padding:24px;text-align:left;cursor:pointer;overflow:hidden;display:flex;flex-direction:column;justify-content:flex-end;gap:6px;transition:transform .2s,border-color .2s}
.door:hover{transform:translateY(-3px);border-color:rgba(236,230,216,.35)}
.door b{font:800 clamp(30px,5vw,56px)/1 var(--display);letter-spacing:-.02em;position:relative}
.door span{color:var(--muted);position:relative;max-width:36ch}
.door.shelfd{background:linear-gradient(135deg,#1d2024,#121315)}
.door.shelfd::before{content:"";position:absolute;right:-20px;top:-20px;width:60%;height:120%;background:repeating-linear-gradient(90deg,transparent 0 22px,rgba(242,163,58,.08) 22px 26px);transform:skewX(-12deg)}
.door.tam{background:radial-gradient(circle at 85% 15%,rgba(179,38,30,.45),transparent 55%),linear-gradient(135deg,#221615,#121315)}
.door.tam::before{content:"?";position:absolute;right:24px;top:6px;font:800 clamp(80px,12vw,150px)/1 var(--display);color:rgba(236,230,216,.08)}
/* shelf */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:20px}
.box{display:flex;flex-direction:column;background:var(--shelf);border:1px solid var(--line);border-radius:12px;overflow:hidden;text-align:left;padding:0;cursor:pointer;transition:transform .2s,border-color .2s}
.box:hover{transform:translateY(-3px);border-color:rgba(236,230,216,.3)}
.cover{position:relative;aspect-ratio:16/10;overflow:hidden;width:100%}
.label{padding:18px 18px 20px;display:flex;flex-direction:column;gap:10px;flex:1}
.label h2{margin:0;font:800 22px/1.15 var(--display);letter-spacing:-.01em}
.label p{margin:0;color:var(--muted);font-size:15px}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tags i{font:500 11px var(--mono);font-style:normal;letter-spacing:.04em;padding:4px 8px;border:1px solid var(--line);border-radius:999px}
.play{margin-top:auto;font:600 14px var(--body);color:var(--amber)}
.svo{background:linear-gradient(180deg,#07080a 0%,#151a1f 70%,#2a2d30 100%)}
.svo .bld{position:absolute;bottom:0;display:grid;gap:5px;padding:8px;background:#3a3e40}
.svo .bld b{display:block;width:10px;height:13px;background:#0c1013}
.svo .bld b.l{background:#e0a548;box-shadow:0 0 8px rgba(224,165,72,.6)}
.svo .stamp{position:absolute;left:8%;top:24%;font:400 clamp(44px,8vw,70px)/1 "Ruslan Display",Impact,serif;color:var(--stamp);border:.06em solid currentColor;padding:.05em .18em 0;transform:rotate(-6deg);background:rgba(7,8,10,.35)}
.svo .esc{position:absolute;left:8%;top:10%;font:400 clamp(16px,2.4vw,22px) "Ruslan Display",Impact,serif}
.gw{background:radial-gradient(ellipse at 50% 0%,#2b221b,#15110e 75%);display:grid;place-items:center}
.gw .tiles{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;width:82%}
.gw .t{aspect-ratio:3/4;border-radius:3px;background:#efe7d6;display:grid;place-items:center}
.gw .t::before{content:"";width:58%;aspect-ratio:1;border-radius:50%;background:var(--c,#1c1814);box-shadow:inset 0 0 0 3px #efe7d6,inset 0 0 0 5px var(--r,#b3262a)}
.gw .t.d{background:repeating-linear-gradient(45deg,#2b221b 0 5px,#201914 5px 10px)}
.gw .t.d::before{display:none}
.gw .q{position:absolute;right:7%;top:9%;font:700 clamp(40px,7vw,64px)/1 "Alegreya SC",Georgia,serif;color:#c8a24a}
/* tamada */
.tamhead{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap}
.tamhead h2{margin:0;font:800 clamp(34px,6vw,64px)/1 var(--display);letter-spacing:-.02em}
.tcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,320px));gap:20px;perspective:1400px}
.tc{position:relative;aspect-ratio:3/4;border:0;padding:0;background:none;cursor:pointer}
.tc .in{position:absolute;inset:0;transition:transform .7s cubic-bezier(.3,.7,.3,1);transform-style:preserve-3d}
.tc.open .in{transform:rotateY(180deg)}
.tc .bk,.tc .fr{position:absolute;inset:0;border-radius:14px;backface-visibility:hidden;-webkit-backface-visibility:hidden;overflow:hidden}
.tc .bk{background:radial-gradient(circle at 50% 40%,#2a1c1a,#141516);border:1px solid var(--line);display:grid;place-items:center}
.tc .bk::before{content:"?";font:800 120px/1 var(--display);color:rgba(236,230,216,.14)}
.tc .bk::after{content:"";position:absolute;inset:12px;border:1px dashed rgba(236,230,216,.12);border-radius:10px}
.tc .fr{transform:rotateY(180deg);background:var(--shelf);border:1px solid var(--line);display:flex;flex-direction:column}
.tc .fr .cover{aspect-ratio:auto;flex:1}
.tc .fr h3{margin:0;padding:14px 16px;font:800 18px/1.15 var(--display)}
.tc.mine .bk{box-shadow:0 0 0 3px var(--amber)}
.tc.lit .bk,.tc.lit .fr{box-shadow:0 0 0 4px var(--paper),0 0 40px rgba(242,163,58,.5)}
.tc.win .fr{box-shadow:0 0 0 4px var(--amber),0 0 60px rgba(242,163,58,.6)}
.tc .vote{position:absolute;left:12px;bottom:12px;font:600 11px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--amber);z-index:2}
/* frame */
#frameWrap{position:fixed;inset:0;z-index:40;background:#000}
#frame{width:100%;height:100%;border:0;display:block}
/* modal */
.modal{position:fixed;inset:0;z-index:60;background:rgba(6,7,8,.72);display:grid;place-items:center;overflow:auto;padding-block:24px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.mbox{width:min(520px,100%);background:var(--shelf);border:1px solid var(--line);border-radius:14px;padding:24px;display:flex;flex-direction:column;gap:16px;box-shadow:0 30px 80px rgba(0,0,0,.6)}
.mbox h2{margin:0;font:800 26px/1.15 var(--display);letter-spacing:-.01em}
.mbox p{margin:0}
label{display:flex;flex-direction:column;gap:6px;font:600 11px var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
input[type=text],input[type=number],select{font:500 17px var(--body);color:var(--paper);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:11px 12px;width:100%}
.note{font-size:14px;color:var(--muted)}
.note.err{color:var(--lose)}
.evs{display:flex;flex-direction:column;gap:6px;max-height:300px;overflow:auto}
.ev{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 12px;border-radius:8px;border:1px solid var(--line);background:transparent;text-align:left;cursor:pointer}
.ev:hover{border-color:rgba(236,230,216,.35)}
.ev[aria-pressed="true"]{border-color:var(--amber);background:rgba(242,163,58,.08)}
.ev b{font:700 14px var(--mono);color:var(--amber);white-space:nowrap}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tabs button{border:1px solid var(--line);background:transparent;border-radius:999px;padding:6px 12px;font-size:13px;cursor:pointer}
.tabs button[aria-pressed="true"]{background:var(--paper);color:var(--bg)}
.stake{display:flex;gap:8px;align-items:flex-end;flex-wrap:wrap}
.stake label{flex:1;min-width:140px}
.payout{font:600 13px var(--mono);color:var(--muted)}
.payout b{color:var(--amber)}
.bets{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px;max-height:360px;overflow:auto}
.bets li{display:flex;gap:10px;align-items:center;padding:10px 12px;border-radius:8px;background:var(--shelf2);font-size:14px}
.bets li .t{flex:1;min-width:0}
.bets li .t small{display:block;color:var(--muted);font:500 11px var(--mono)}
.bets .st{font:600 12px var(--mono);white-space:nowrap}
.bets .won{color:var(--win)}.bets .lost{color:var(--lose)}.bets .open{color:var(--amber)}.bets .back{color:var(--muted)}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--paper);color:var(--bg);padding:11px 18px;border-radius:8px;font-weight:500;box-shadow:0 10px 30px rgba(0,0,0,.5);z-index:80;max-width:calc(100% - 32px);transition:opacity .3s}
@media (max-width:820px){.desk,.doors{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){.tc .in,.door,.box{transition:none}}
</style>
</head>
<body>
<div class="app">
  <div class="bar">
    <button class="logo" id="logo" type="button"><span data-t="logo1"></span><span data-t="logo2"></span></button>
    <button class="chip" id="lobbyChip" type="button"><i class="dot"></i><span id="lobbyChipT"></span></button>
    <div class="seg" role="group" aria-label="Language"><button type="button" id="lRu">RU</button><button type="button" id="lEn">EN</button></div>
  </div>

  <main id="vHome">
    <div class="desk">
      <section class="card" aria-label="Profile">
        <div class="who"><div class="ava" id="myAva"></div><div style="min-width:0"><h1 id="myName"></h1><p id="myStatus"></p></div></div>
        <div class="purse"><i class="coin" aria-hidden="true"></i><div><b id="myChips">0</b><br><span data-t="chips"></span></div></div>
        <div class="row">
          <button class="btn ghost sm" id="bEdit" type="button" data-t="edit"></button>
          <button class="btn ghost sm" id="bMyBets" type="button"></button>
          <button class="btn sm" id="bRefill" type="button" hidden data-t="refill"></button>
        </div>
      </section>
      <section class="card" aria-label="Lobby" id="lobbyCard">
        <div id="noLobby" class="row" style="flex-direction:column;align-items:flex-start">
          <p class="eyebrow" data-t="lobby"></p>
          <p class="muted" style="margin:0" data-t="no_lobby"></p>
          <button class="btn" id="bLobby" type="button" data-t="lobby_open"></button>
        </div>
        <div id="inLobby" hidden style="display:flex;flex-direction:column;gap:14px">
          <div class="row" style="justify-content:space-between"><div><p class="eyebrow" data-t="lobby_code"></p><div class="code" id="lobCode"></div></div>
            <div class="row"><button class="btn ghost sm" id="bCopy" type="button" data-t="copy"></button><button class="btn ghost sm" id="bLeaveLobby" type="button" data-t="leave"></button></div></div>
          <p class="note" id="lobState"></p>
          <ul class="members" id="members"></ul>
          <button class="btn ghost sm" id="bBetAny" type="button" data-t="bet_event"></button>
        </div>
      </section>
    </div>
    <div class="doors" style="margin-top:20px">
      <button class="door shelfd" id="bShelf" type="button"><b data-t="shelf"></b><span data-t="shelf_d"></span></button>
      <button class="door tam" id="bTamada" type="button"><b data-t="tamada"></b><span data-t="tamada_d"></span></button>
    </div>
  </main>

  <main id="vShelf" hidden>
    <div class="row" style="justify-content:space-between;margin-bottom:20px"><h2 style="margin:0;font:800 34px var(--display)" data-t="shelf"></h2><button class="btn ghost sm" type="button" data-back data-t="back"></button></div>
    <div class="grid" id="shelfGrid"></div>
  </main>

  <main id="vTamada" hidden>
    <div class="tamhead" style="margin-bottom:20px">
      <div><p class="eyebrow" data-t="tamada"></p><h2 id="tamTitle"></h2><p class="muted" id="tamNote" style="margin:8px 0 0"></p></div>
      <div class="row"><button class="btn" id="bTamEnd" type="button" data-t="tam_end"></button><button class="btn ghost sm" type="button" data-back data-t="back"></button></div>
    </div>
    <div class="tcards" id="tcards"></div>
  </main>
</div>

<div id="frameWrap" hidden><iframe id="frame" title="Game"></iframe></div>

<div class="modal" id="mProfile" hidden><div class="mbox">
  <h2 id="mProfileT"></h2>
  <p class="muted" id="mProfileD"></p>
  <label for="pName"><span data-t="name"></span><input type="text" id="pName" maxlength="20" autocomplete="off"></label>
  <label for="pStatus"><span data-t="status"></span><input type="text" id="pStatus" maxlength="60" autocomplete="off"></label>
  <p class="note err" id="pErr" hidden data-t="need_name"></p>
  <div class="row"><button class="btn" id="pSave" type="button" data-t="save"></button><button class="btn ghost" id="pCancel" type="button" data-t="cancel"></button></div>
</div></div>

<div class="modal" id="mLobby" hidden><div class="mbox">
  <h2 data-t="lobby"></h2>
  <p class="muted" data-t="lobby_d"></p>
  <button class="btn" id="lCreate" type="button" data-t="create"></button>
  <div class="stake"><label for="lCode"><span data-t="code"></span><input type="text" id="lCode" maxlength="8" autocomplete="off" placeholder="a7k2"></label><button class="btn ghost" id="lJoin" type="button" data-t="join"></button></div>
  <p class="note" id="lNote"></p>
  <div class="row"><button class="btn ghost" id="lClose" type="button" data-t="close"></button></div>
</div></div>

<div class="modal" id="mBet" hidden><div class="mbox">
  <div class="row" style="justify-content:space-between"><h2 data-t="bet_title"></h2><span class="payout" id="betBal"></span></div>
  <div class="tabs" id="betGames"></div>
  <label for="betWho"><span data-t="bet_on"></span><select id="betWho"></select></label>
  <div class="evs" id="betEvs"></div>
  <div class="stake"><label for="betAmt"><span data-t="stake"></span><input type="number" id="betAmt" min="10" step="10" value="100"></label>
    <div class="row"><button class="btn ghost sm" type="button" data-amt="50">50</button><button class="btn ghost sm" type="button" data-amt="100">100</button><button class="btn ghost sm" type="button" data-amt="250">250</button><button class="btn ghost sm" type="button" data-amt="all" data-t="all_in"></button></div></div>
  <p class="payout" id="betPay"></p>
  <p class="note" id="betNote"></p>
  <div class="row"><button class="btn" id="betGo" type="button" data-t="place"></button><button class="btn ghost" id="betClose" type="button" data-t="close"></button></div>
</div></div>

<div class="modal" id="mView" hidden><div class="mbox">
  <div class="who"><div class="ava" id="vAva"></div><div style="min-width:0"><h2 id="vName"></h2><p class="muted" id="vStatus" style="font-style:italic"></p></div></div>
  <div class="purse"><i class="coin" aria-hidden="true"></i><div><b id="vChips">0</b><br><span data-t="chips"></span></div></div>
  <p class="note" id="vWhere"></p>
  <div class="row"><button class="btn bet" id="vBet" type="button">BET</button><button class="btn ghost" id="vClose" type="button" data-t="close"></button></div>
</div></div>

<div class="modal" id="mBets" hidden><div class="mbox">
  <h2 data-t="my_bets"></h2>
  <ul class="bets" id="betList"></ul>
  <div class="row"><button class="btn ghost" id="mBetsClose" type="button" data-t="close"></button></div>
</div></div>

<div class="toast" id="toast" hidden></div>

<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script>
(()=>{
'use strict';
window.__gameShell=true;
const $=s=>document.querySelector(s);
const rnd=()=>Math.random().toString(36).slice(2,8);
const clean=(s,n=20)=>String(s||'').replace(/[\u0000-\u001f\u007f-\u009f\u200b-\u200f\u2028-\u202e\u2060-\u206f]/g,'').trim().slice(0,n);
const num=(v,d=0)=>typeof v==='number'&&Number.isFinite(v)?v:d;
const str=(v,n=40)=>typeof v==='string'?v.slice(0,n):'';
const obj=v=>v&&typeof v==='object'&&!Array.isArray(v)?v:null;

/* ================= i18n ================= */
const D={

function hash(s){let h=2166136261;for(const ch of String(s)){h^=ch.codePointAt(0);h=Math.imul(h,16777619);}return h>>>0;}
function ava(name){const h=hash(name),hue=h%360,h2=(hue+140)%360,sides=3+(h>>>9)%5,rot=(h>>>4)%360;

function members(){const out=[{label:LB.label,me:true,p:myPres()}];for(const [k,v] of LB.others)out.push({label:k,me:false,p:v.pres});return out;}
function inLobby(){return !!LB.code;}
function deliver(m){try{onEvent(m);}catch(e){console.warn(e);}}
function route(m){const msg={t:'e',l:m.l,to:m.to||null,k:String(m.k||''),d:m.d};if(!msg.to||msg.to===LB.label)deliver(msg);
  for(const c of LB.hubConns){if(!c.open)continue;if(!msg.to||c.label===msg.to){try{c.send(msg);}catch(_){}}}}
function emit(k,d,to){const m={t:'e',l:LB.label,to:to||null,k,d};
  if(!inLobby()){if(!to||to===LB.label)deliver(m);return;}
  if(LB.hub)route(m);else if(LB.conn&&LB.conn.open){try{LB.conn.send(m);}catch(_){}}}
function startHub(cb){
  let ok=false;const hp=new Peer(PFX+LB.code,popts());
  hp.on('open',()=>{ok=true;LB.hub=hp;LB.hubLabel=LB.label;LB.connected=true;cb(true);});
  hp.on('error',e=>{if(!ok){try{hp.destroy();}catch(_){}cb(false,e&&e.type==='unavailable-id'?'taken':'net');}});
  hp.on('connection',c=>{LB.hubConns.add(c);
    c.on('data',m=>{if(!m||typeof m!=='object')return;
      if(m.t==='p'&&typeof m.l==='string'&&m.l.length<40){c.label=m.l;LB.others.set(m.l,{pres:obj(m.d)||{},t:performance.now()});}
      else if(m.t==='e'&&typeof m.l==='string'&&m.l===c.label)route(m);});
    const drop=()=>{LB.hubConns.delete(c);if(c.label)LB.others.delete(c.label);};c.on('close',drop);c.on('error',drop);});

}
function ensureClient(cb){
  if(LB.client&&LB.client.open&&!LB.client.destroyed){cb(true);return;}
  if(LB.client){try{LB.client.destroy();}catch(_){}}
  const cp=new Peer(popts());LB.client=cp;let opened=false;
  cp.on('open',()=>{opened=true;cb(true);});
  cp.on('error',e=>{if(!opened){cb(false,'net');return;}if(e&&e.type==='peer-unavailable'&&LB.pend)LB.pend(false,'nf');});
  cp.on('disconnected',()=>{if(!LB.closed&&LB.client===cp)setTimeout(()=>{try{cp.reconnect();}catch(_){}},1000);});
}
function connectClient(cb){
  ensureClient((ok,err)=>{
    if(!ok){cb(false,err);return;}
    const c=LB.client.connect(PFX+LB.code,{reliable:true,serialization:'json'});let called=false,to=0;
    const fin=(a,b)=>{if(called)return;called=true;clearTimeout(to);if(LB.pend===fin)LB.pend=null;if(!a){try{c.close();}catch(_){}}cb(a,b);};
    LB.pend=fin;to=setTimeout(()=>fin(false,'timeout'),9000);

      if(m.t==='all'&&obj(m.ps)){LB.lastAll=performance.now();LB.hubLabel=str(m.h);const seen=new Set();

function migrate(){
  if(LB.migrating||LB.closed)return;LB.migrating=true;
  if(LB.hubLabel)LB.others.delete(LB.hubLabel);
  const first=[LB.label,...LB.others.keys()].sort()[0];let tries=0;
  const again=()=>{if(!LB.closed&&tries<40)setTimeout(attempt,1500);};
  const attempt=()=>{if(LB.closed)return;tries++;
    if(first===LB.label||tries>5)startHub(ok=>{if(ok){LB.migrating=false;LB.conn=null;try{LB.client&&LB.client.destroy();}catch(_){}LB.client=null;}else connectClient(ok2=>{if(ok2)LB.migrating=false;else again();});});
    else connectClient(ok=>{if(ok)LB.migrating=false;else again();});};

function onEvent(m){

}

const pools={};const sessions={};
function pool(g){return pools[g]||(pools[g]={total:0,by:{}});}
function odds(evId,sub){const e=EV[evId];const p=pool(e.g);const key=evId+'|'+(sub||'');const pe=p.by[key]||0;return Math.max(1.1,Math.round(e.base*(500+p.total-pe)/(500+pe)*100)/100);}
function onBetBroadcast(d){const e=EV[str(d.ev)];if(!e)return;const amt=Math.max(0,Math.min(1e7,Math.floor(num(d.amt))));const p=pool(e.g);p.total+=amt;const key=e.id+'|'+str(d.sub);p.by[key]=(p.by[key]||0)+amt;}
function runningGid(g){for(const id in sessions){const s=sessions[id];if(s.game===g&&!s.ended)return id;}return null;}
function evText(b){const e=EV[b.ev];return e?e.t[L()].replace('{n}',b.subName||''):b.ev;}
function payWin(b){b.st='won';b.won=Math.round(b.stake*b.k);prof.chips+=b.won;toast(T('won',{p:b.won,e:evText(b)}));}
function payLose(b){b.st='lost';toast(T('lost',{e:evText(b)}));}
function onGStart(d){const gid=str(d.gid),game=str(d.game);if(!gid||!GM[game])return;
  if(!sessions[gid])sessions[gid]={game,players:Array.isArray(d.players)?d.players.map(x=>str(x)).slice(0,8):[],first:{},ended:false,seen:performance.now()};
  for(const b of prof.bets)if(b.st==='open'&&b.game===game&&!b.gid)b.gid=gid;saveProf();renderHome();}
function onGev(d){
  const gid=str(d.gid),game=str(d.game),ev=str(d.ev),sub=str(d.sub);if(!gid||!GM[game])return;
  const s=sessions[gid]||(sessions[gid]={game,players:[],first:{},ended:false,seen:performance.now()});if(s.ended)return;
  if(sub&&!s.players.includes(sub))s.players.push(sub);
  let firstSub=null;if(EVENTS.some(e=>e.kind==='first'&&e.on===ev)){if(s.first[ev]===undefined){s.first[ev]=sub;firstSub=sub;}}
  let ch=false;
  for(const b of prof.bets){if(b.st!=='open'||b.game!==game)continue;if(!b.gid)b.gid=gid;if(b.gid!==gid)continue;const E=EV[b.ev];if(!E)continue;
    if(E.kind==='yes'&&E.id===ev&&b.sub===sub){payWin(b);ch=true;}
    else if(E.kind==='first'&&E.on===ev&&firstSub!==null){if(b.sub===firstSub)payWin(b);else payLose(b);ch=true;}}

}
function onGEnd(d){
  const gid=str(d.gid),game=str(d.game);if(!gid||!GM[game])return;const s=sessions[gid]||(sessions[gid]={game,players:[],first:{},ended:false});if(s.ended)return;s.ended=true;
  const sum=obj(d.sum)||{};const players=Array.isArray(sum.players)?sum.players.map(x=>str(x)):s.players;const esc=Array.isArray(sum.esc)?sum.esc.map(x=>str(x)):[];const q=num(sum.q,-1);
  const groupWin={'svo.all_escape':players.length>0&&players.every(p=>esc.includes(p)),'svo.none_escape':esc.length===0,'gw.fast':q>=0&&q<8,'gw.long':q>14};
  for(const b of prof.bets){if(b.st!=='open'||b.game!==game)continue;if(!b.gid)b.gid=gid;if(b.gid!==gid)continue;const E=EV[b.ev];
    if(E&&E.kind==='group'&&groupWin[b.ev])payWin(b);else payLose(b);}
  pools[game]={total:0,by:{}};saveProf();renderHome();
}
setInterval(()=>{ // refund bets on games everyone walked away from
  const ms=members();let ch=false;
  for(const id in sessions){const s=sessions[id];if(s.ended)continue;const alive=s.players.length===0||s.players.some(p=>{const m=ms.find(x=>x.label===p);const gp=m&&obj(m.p.gp);return m&&m.p.w===s.game&&gp&&(gp.g===id||gp.gid===id);});
    if(alive){s.seen=performance.now();continue;}if(performance.now()-s.seen<15000)continue;
    s.ended=true;for(const b of prof.bets)if(b.st==='open'&&b.gid===id){b.st='back';prof.chips+=b.stake;toast(T('refund',{e:evText(b)}));ch=true;}}
  if(ch){saveProf();renderHome();}
},2000);

/* ================= tamada ================= */
let TM=null;
function startTamada(){
  const order=GAMES.map(g=>g.id);for(let i=order.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[order[i],order[j]]=[order[j],order[i]];}
  emit('tam',{a:'start',id:rnd(),order,by:LB.label});
}
function onTam(from,d){
  const a=str(d.a);
  if(a==='start'){const order=Array.isArray(d.order)?d.order.map(x=>str(x)).filter(x=>GM[x]):[];if(!order.length)return;
    TM={id:str(d.id),order,votes:{},by:str(d.by),phase:'vote',result:null};
    if(curGame){toast(T('tam_started',{n:memberName(from)}));return;}
    show('vTamada');renderTam();return;}
  if(!TM||str(d.id)!==TM.id)return;
  if(a==='vote'){if(TM.phase!=='vote')return;const g=str(d.g);if(!GM[g])return;TM.votes[from]=g;renderTam();maybeFinish();}
  else if(a==='result'){const g=str(d.g);if(!GM[g]||TM.phase!=='vote')return;TM.phase='spin';TM.result=g;spin(Array.isArray(d.tied)?d.tied.map(x=>str(x)).filter(x=>GM[x]):[g],g);}
}
function voters(){return members().filter(m=>m.p.w==='tamada').map(m=>m.label);}
function maybeFinish(){if(!TM||TM.phase!=='vote'||TM.by!==LB.label)return;const vs=voters();if(vs.length&&vs.every(v=>TM.votes[v]))finishTam();}
function finishTam(){
  if(!TM||TM.phase!=='vote')return;const tally={};for(const g of TM.order)tally[g]=0;for(const v in TM.votes)if(tally[TM.votes[v]]!==undefined)tally[TM.votes[v]]++;
  const max=Math.max(...Object.values(tally));let tied=TM.order.filter(g=>tally[g]===max);const g=tied[Math.floor(Math.random()*tied.length)];
  emit('tam',{a:'result',id:TM.id,g,tied});
}
function renderTam(){
  if(!TM)return;const box=$('#tcards');box.innerHTML='';const mine=TM.votes[LB.label];
  TM.order.forEach((g,i)=>{const b=document.createElement('button');b.type='button';b.className='tc'+(mine===g?' mine':'')+(TM.phase==='done'?' open':'')+(TM.phase==='done'&&TM.result===g?' win':'');b.dataset.g=g;
    b.innerHTML=`<div class="in"><div class="bk"></div><div class="fr"><div class="cover ${GM[g].cover}">${coverHTML(g)}</div><h3></h3></div></div>`;b.querySelector('h3').textContent=gname(g);
    if(TM.phase==='done'){const n=Object.values(TM.votes).filter(x=>x===g).length;b.querySelector('h3').textContent=gname(g)+' · '+T('votes_n',{n});}
    else if(mine===g){const v=document.createElement('span');v.className='vote';v.textContent=T('your_vote');b.appendChild(v);}
    b.setAttribute('aria-label',(i+1)+'');b.onclick=()=>{if(TM.phase!=='vote')return;emit('tam',{a:'vote',id:TM.id,g});};box.appendChild(b);});
  const vs=voters();const voted=vs.filter(v=>TM.votes[v]).length;
  $('#tamTitle').textContent=TM.phase==='vote'?T('tam_vote'):TM.phase==='spin'?T('tam_spin'):T('tam_won',{g:gname(TM.result)});
  $('#tamNote').textContent=TM.phase==='vote'?T('tam_note',{v:voted,n:Math.max(vs.length,1)}):TM.tie?T('tam_tie'):'';
  $('#bTamEnd').hidden=!(TM.phase==='vote'&&TM.by===LB.label);
}
function spin(tied,g){
  TM.tie=tied.length>1;renderTam();const cards=[...document.querySelectorAll('#tcards .tc')];const pool=cards.filter(c=>tied.includes(c.dataset.g));
  const target=pool.findIndex(c=>c.dataset.g===g);const steps=pool.length>1?pool.length*4+target:3;let i=0,delay=90;
  const tick=()=>{cards.forEach(c=>c.classList.remove('lit'));const c=pool[i%pool.length];c.classList.add('lit');i++;
    if(i<=steps){delay*=1.09;setTimeout(tick,delay);}else{setTimeout(()=>{TM.phase='done';renderTam();setTimeout(()=>{if(TM&&TM.result===g&&!curGame)openGame(g);},2200);},500);}};
  tick();
}
$('#bTamEnd').onclick=finishTam;

const frame=$('#frame');const frameWin=()=>frame.contentWindow;
function openGame(id){if(!GM[id])return;curGame=id;GP=null;where=id;$('#frameWrap').hidden=false;frame.src=GM[id].file;document.body.style.overflow='hidden';setTimeout(()=>{try{frame.focus();}catch(e){}},300);}
function closeGame(){curGame=null;GP=null;frame.src='about:blank';$('#frameWrap').hidden=true;document.body.style.overflow='';show('vHome');}
function peersForGame(){return members().map(m=>({label:m.label,name:clean(m.p.n),chips:num(m.p.c),w:str(m.p.w),gp:m.me?null:(m.p.gk===str(m.p.w)?obj(m.p.gp):null)}));}
function hello(){const w=frameWin();if(!w)return;w.postMessage({svo:1,type:'hello',me:LB.label,name:prof.name,lang:cfg.lang,inLobby:inLobby()&&LB.connected,hub:LB.hubLabel,peers:peersForGame()},'*');}
setInterval(()=>{if(!curGame)return;const w=frameWin();if(!w)return;w.postMessage({svo:1,type:'peers',me:LB.label,inLobby:inLobby()&&LB.connected,hub:LB.hubLabel,peers:peersForGame()},'*');},100);
addEventListener('message',e=>{
  if(!curGame||e.source!==frameWin())return;const m=e.data;if(!m||m.svo!==1)return;
  switch(m.type){
    case 'ready':hello();break;
    case 'gp':GP=obj(m.d);break;
    case 'emit':emit('g',{game:curGame,m:m.d},m.to?str(m.to):null);break;
    case 'event':emit('gev',{game:curGame,gid:str(m.gid),ev:str(m.ev),sub:str(m.sub)||LB.label});break;
    case 'start':emit('gstart',{game:curGame,gid:str(m.gid),players:Array.isArray(m.players)?m.players.map(x=>str(x)).slice(0,8):[]});break;
    case 'abort':emit('gabort',{gid:str(m.gid)});break;
    case 'end':emit('gend',{game:curGame,gid:str(m.gid),sum:obj(m.sum)||{}});break;
    case 'bet':openBet(curGame,str(m.target)||null);break;
    case 'lobby':openLobbyModal();break;
    case 'exit':closeGame();break;
    case 'lang':if(m.lang==='ru'||m.lang==='en'){cfg.lang=m.lang;applyLang();}break;
  }
});
