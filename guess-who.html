<head>

<style data-orion-critical>
html.orion-pending body{visibility:hidden!important}
html.orion-pending:not(.orion-mounted)::before{content:"";position:fixed;inset:0;background:#101012;z-index:2147482998}
html.orion-pending:not(.orion-mounted)::after{content:"";position:fixed;left:50%;top:50%;width:12px;height:12px;margin:-6px;background:#e9c16f;box-shadow:-20px 0 #e9c16f,20px 0 #e9c16f,0 -20px #e9c16f,0 20px #e9c16f;z-index:2147482999;animation:orion-boot .8s steps(4,end) infinite}
@keyframes orion-boot{to{transform:rotate(360deg)}}
@media(prefers-reduced-motion:reduce){html.orion-pending::after{animation:none!important}}


/* Illustrated secret-identity tabletop, scoped to the welcome screen. */
.wrap:has(#sMenu:not([hidden])){height:100dvh;max-width:1440px;padding-block:24px 32px}
.guessMenu{display:grid;grid-template-columns:minmax(0,.85fr) minmax(0,1.15fr);gap:clamp(24px,4vw,60px);align-items:center;flex:1;min-height:0}
.guessMenuCopy{display:flex;flex-direction:column;align-items:flex-start;gap:26px;padding:12px 0 12px 20px}
.guessMenuCopy h1{font-size:clamp(52px,6.7vw,92px);max-width:8ch}.guessMenuCopy .lede{max-width:37ch;font-size:19px}
.guessMenuCopy .row{gap:12px;margin-top:4px}.guessMenuCopy .btn{padding:14px 21px}
.guessClue{display:flex;gap:15px;align-items:center;width:190px;color:var(--acc);opacity:.65;margin-top:14px;font-size:13px}
.guessClue span{height:1px;flex:1;background:linear-gradient(90deg,transparent,var(--acc))}.guessClue span:last-child{transform:rotate(180deg)}
.guessMenuArt{position:relative;isolation:isolate;width:100%;height:min(100%,660px);min-height:0;border:1px solid #c8a24a55;padding:10px;background:#201914;box-shadow:0 20px 60px #0005;transform:rotate(1deg);border-radius:4px}
.guessMenuArt img{width:100%;height:100%;object-fit:cover;border-radius:2px;display:block;pointer-events:none}
.guessMenuArt::after{content:'';position:absolute;inset:10px;box-shadow:inset 0 0 45px #15110e55;pointer-events:none}
.guessArtCorners{position:absolute;inset:0;pointer-events:none;background:linear-gradient(var(--acc),var(--acc)) left top/24px 2px no-repeat,linear-gradient(var(--acc),var(--acc)) left top/2px 24px no-repeat,linear-gradient(var(--acc),var(--acc)) right bottom/24px 2px no-repeat,linear-gradient(var(--acc),var(--acc)) right bottom/2px 24px no-repeat}
@media(max-height:700px){.guessMenuCopy{gap:20px}.guessMenuCopy h1{font-size:64px}.guessMenuCopy .lede{font-size:17px}.guessClue{margin-top:0}.guessMenuCopy .btn{padding:12px 17px}.guessMenuArt{height:100%}}
@media(max-width:1050px){.guessMenu{gap:28px;grid-template-columns:.95fr 1.05fr}.guessMenuCopy{padding-left:0;gap:20px}.guessMenuCopy h1{font-size:62px}.guessMenuCopy .lede{font-size:17px}.guessMenuCopy .row{gap:10px}.guessMenuCopy .btn{padding:12px 15px;font-size:13px}}
</style>

document.documentElement.classList.add('orion-pending');
setTimeout(function(){if(!window.OrionLoader)document.documentElement.classList.remove('orion-pending');},12000);

<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Угадай героя</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alegreya+SC:wght@500;700&family=Alegreya+Sans:wght@400;500;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: a walnut tabletop; the board of flip-cards dominates, a narrow ledger column on the right holds turn, questions and log. */
:root{
  --wood:#15110e;
  --wood2:#201914;
  --wood3:#2b221b;
  --paper:#efe7d6;
  --ink:#1c1814;
  --muted:#a89a86;
  --line:rgba(239,231,214,.14);
  --yes:#7fb36a;
  --no:#c8564a;
  --acc:#c8a24a;
  --acc2:#5a8fd6;
  --display:"Alegreya SC", Georgia, serif;
  --body:"Alegreya Sans", "Segoe UI", system-ui, sans-serif;
  --mono:"IBM Plex Mono", ui-monospace, Menlo, monospace;
  color-scheme:dark;
}
[hidden]{display:none!important}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--wood);color:var(--paper)}
body{font:400 16px/1.45 var(--body);background:radial-gradient(ellipse at 50% -10%,var(--wood3),var(--wood) 70%);min-height:100vh;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
a{color:inherit}
button{font:inherit;color:inherit}
.btn{font:700 14px var(--body);letter-spacing:.06em;text-transform:uppercase;padding:12px 20px;border:0;border-radius:3px;background:var(--paper);color:var(--ink);cursor:pointer;transition:transform .1s,background .15s}
.btn:hover{background:var(--acc);color:var(--ink)}
.btn:active{transform:translateY(1px)}
.btn.ghost{background:transparent;color:var(--paper);box-shadow:inset 0 0 0 1px var(--line)}
.btn.ghost:hover{box-shadow:inset 0 0 0 1px var(--acc);color:var(--acc)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn:focus-visible,.tile:focus-visible,.card:focus-visible,.q:focus-visible,input:focus-visible{outline:2px solid var(--acc);outline-offset:3px}
.wrap{max-width:1180px;margin:0 auto;padding-block:28px 40px;display:flex;flex-direction:column;gap:24px}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.back{font:500 14px var(--body);color:var(--muted);text-decoration:none}
.back:hover{color:var(--acc)}
.seg{display:flex;border:1px solid var(--line);border-radius:3px;overflow:hidden}
.seg button{background:transparent;border:0;padding:6px 12px;font:600 12px var(--mono);letter-spacing:.08em;cursor:pointer;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--paper);color:var(--ink)}
h1{margin:0;font:700 clamp(44px,8vw,88px)/.95 var(--display);letter-spacing:.01em;text-wrap:balance}
h1 em{font-style:normal;color:var(--acc)}
h2{margin:0;font:700 28px/1.1 var(--display);text-wrap:balance}
.lede{margin:0;max-width:56ch;color:var(--muted);font-size:18px}
.eyebrow{margin:0;font:600 11px var(--mono);letter-spacing:.18em;text-transform:uppercase;color:var(--muted)}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.panel{background:var(--wood2);border:1px solid var(--line);border-radius:6px;padding:20px;display:flex;flex-direction:column;gap:14px}
label{display:flex;flex-direction:column;gap:6px;font:600 11px var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
input[type=text]{font:500 17px var(--body);color:var(--paper);background:var(--wood);border:1px solid var(--line);border-radius:3px;padding:10px 12px;width:100%}
.note{margin:0;color:var(--muted);font-size:15px}
.note.err{color:var(--no)}
.code{font:700 64px/1 var(--display);color:var(--acc);letter-spacing:.06em}

/* theme tiles */
.themes{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px}
.tile{position:relative;text-align:left;border:1px solid var(--line);border-radius:6px;background:var(--wood2);padding:16px;cursor:pointer;display:flex;flex-direction:column;gap:8px;min-height:120px;overflow:hidden}
.tile b{font:700 22px/1.1 var(--display)}
.tile span{font-size:14px;color:var(--muted)}
.tile::after{content:"";position:absolute;right:-30px;bottom:-30px;width:110px;height:110px;border-radius:50%;background:radial-gradient(circle,var(--tc) 0,transparent 70%);opacity:.5}
.tile[aria-pressed="true"]{border-color:var(--tc);box-shadow:inset 0 0 0 1px var(--tc)}
.sizes .seg button{padding:10px 16px;font-size:13px}

/* board */
.game{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:20px;align-items:start}
.board{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;perspective:1200px}
.card{position:relative;aspect-ratio:3/4;border:0;padding:0;background:none;cursor:pointer;min-width:0}
.card .in{position:absolute;inset:0;transition:transform .45s cubic-bezier(.3,.7,.3,1);transform-style:preserve-3d}
.card.down .in{transform:rotateX(180deg)}
.face,.backf{position:absolute;inset:0;border-radius:6px;backface-visibility:hidden;-webkit-backface-visibility:hidden;overflow:hidden}
.face{background:var(--paper);color:var(--ink);display:flex;flex-direction:column;align-items:center;padding:10px 8px 8px;gap:6px;box-shadow:0 2px 0 rgba(0,0,0,.4),0 10px 20px rgba(0,0,0,.25)}
.face svg{width:62%;aspect-ratio:1;flex:none}
.face b{font:700 16px/1.1 var(--display);text-align:center;text-wrap:balance;min-height:2.2em;display:flex;align-items:center}
.chips{display:flex;flex-wrap:wrap;gap:3px;justify-content:center}
.chips i{font:600 9.5px/1 var(--mono);letter-spacing:.02em;font-style:normal;padding:3px 5px;border-radius:2px;background:rgba(28,24,20,.08);color:#4a4036;white-space:nowrap}
.backf{transform:rotateX(180deg);background:repeating-linear-gradient(45deg,var(--wood3) 0 8px,var(--wood2) 8px 16px);border:1px solid var(--line);display:grid;place-items:center}
.backf::after{content:"?";font:700 44px var(--display);color:var(--acc);opacity:.5}
.card.cand .face{box-shadow:0 0 0 3px var(--acc),0 10px 20px rgba(0,0,0,.25)}
.board.guessing .card:not(.down) .face{box-shadow:0 0 0 2px var(--no),0 10px 20px rgba(0,0,0,.25)}
.board.guessing .card:not(.down):hover .face{box-shadow:0 0 0 4px var(--no)}
.side{display:flex;flex-direction:column;gap:14px;position:sticky;top:16px}
.turn{font:700 22px/1.15 var(--display);padding:14px 16px;border-radius:6px;background:var(--wood2);border-left:4px solid var(--muted)}
.turn.me{border-left-color:var(--acc)}
.turn small{display:block;font:500 14px var(--body);color:var(--muted);margin-top:4px}
.mine{display:flex;gap:12px;align-items:center;padding:12px;border-radius:6px;background:var(--wood2);border:1px solid var(--line)}
.mine svg{width:54px;height:54px;flex:none;background:var(--paper);border-radius:4px;padding:4px}
.mine div{min-width:0}
.mine b{display:block;font:700 18px/1.1 var(--display)}
.mine span{font-size:13px;color:var(--muted)}
.qs{display:flex;flex-wrap:wrap;gap:6px;max-height:260px;overflow:auto;padding-right:4px}
.q{border:1px solid var(--line);background:transparent;border-radius:999px;padding:6px 11px;font-size:14px;cursor:pointer;text-align:left}
.q:hover:not(:disabled){border-color:var(--acc);color:var(--acc)}
.q:disabled{opacity:.4;cursor:default}
.q.used{text-decoration:line-through;opacity:.3}
.ask{display:flex;gap:6px}
.ask input{font-size:15px;padding:8px 10px}
.ask .btn{padding:8px 12px}
.log{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;max-height:220px;overflow:auto;font-size:14px}
.log li{display:flex;gap:8px;align-items:baseline;border-bottom:1px dashed var(--line);padding-bottom:5px}
.log .who{font:600 10px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);flex:none;width:58px}
.log .a{margin-left:auto;font:600 12px var(--mono);flex:none}
.log .y{color:var(--yes)}.log .n{color:var(--no)}
.count{font:600 12px var(--mono);letter-spacing:.06em;color:var(--muted)}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--paper);color:var(--ink);padding:10px 16px;border-radius:4px;font-weight:500;box-shadow:0 10px 30px rgba(0,0,0,.4);z-index:30;transition:opacity .3s;max-width:calc(100% - 32px)}
.modal{position:fixed;inset:0;background:rgba(10,8,6,.7);display:grid;place-items:center;z-index:20;padding-block:24px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.modal .panel{width:min(460px,100%)}
.ib{width:36px;height:36px;border-radius:6px;border:1px solid var(--line);background:transparent;color:var(--muted);cursor:pointer;display:grid;place-items:center;font-size:15px}
.ib:hover{color:var(--acc);border-color:var(--acc)}
.modal .panel.info{width:min(640px,100%);max-height:calc(100vh - 48px);overflow:auto}
.info h3{margin:6px 0 0;font:700 19px var(--display);color:var(--acc)}
.info p,.info li{margin:0;color:var(--muted)}
.info ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:4px}
.modal .qtext{font:700 24px/1.2 var(--display)}
.result{display:flex;flex-direction:column;gap:18px;align-items:flex-start}
.result .big{font:700 clamp(40px,7vw,72px)/1 var(--display)}
.result .win{color:var(--acc)}.result .lose{color:var(--no)}
.reveal{display:flex;gap:16px;flex-wrap:wrap}
.reveal .card{width:150px;cursor:default}
.reveal p{margin:6px 0 0;font:600 11px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.plist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.plist li{display:flex;align-items:center;gap:10px;padding:10px 12px;background:var(--wood2);border:1px solid var(--line);border-radius:4px;flex-wrap:wrap}
.plist li .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.plist li small{display:block;color:var(--muted);font:500 11px var(--mono);letter-spacing:.06em}
.plist li.inv{border-color:var(--acc)}
.btn.sm{padding:7px 12px;font-size:12px}
.btn.bet{background:var(--acc);color:var(--ink);font:600 11px var(--mono);letter-spacing:.1em;padding:7px 10px}
.btn.bet:hover{background:var(--paper)}
@media (max-width:860px){.game{grid-template-columns:1fr}.side{position:static}.board{grid-template-columns:repeat(auto-fill,minmax(118px,1fr))}.face b{font-size:14px}}
@media (prefers-reduced-motion:reduce){.card .in{transition:none}}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <a class="back" id="hubLink" href="index.html" hidden data-t="all_games"></a>
    <span style="flex:1"></span>
    <button class="ib" id="bInfo" type="button" aria-label="Info"><i class="fa-solid fa-circle-info"></i></button>
    <div class="seg" role="group" aria-label="Language"><button type="button" id="lRu">RU</button><button type="button" id="lEn">EN</button></div>
  </div>

  <!-- MENU -->
  <section id="sMenu" class="guessMenu">
    <div class="guessMenuCopy">
      <p class="eyebrow" data-t="eyebrow"></p>
      <h1 id="title"></h1>
      <p class="lede" data-t="lede"></p>
      <div class="row">
        <button class="btn" id="bBot" type="button" data-t="vs_bot"></button>
        <button class="btn ghost" id="bNet" type="button" data-t="vs_friend"></button>
      </div>
      <div class="guessClue" aria-hidden="true"><span></span><i class="fa-solid fa-magnifying-glass"></i><span></span></div>
    </div>
    <div class="guessMenuArt"><img src="assets/guess-hero-menu.png" alt="" decoding="async" fetchpriority="high" draggable="false"><div class="guessArtCorners" aria-hidden="true"></div></div>
  </section>

  <!-- ONLINE: players come from the site lobby -->
  <section id="sNet" hidden>
    <div class="panel" style="max-width:560px">
      <h2 data-t="vs_friend"></h2>
      <label for="nick"><span data-t="alias"></span><input type="text" id="nick" maxlength="16" autocomplete="off"></label>
      <div id="netNeed" style="display:flex;flex-direction:column;gap:12px"><p class="note" id="netNote"></p><div class="row"><button class="btn" id="bNeed" type="button"></button></div></div>
      <div id="netList" hidden style="display:flex;flex-direction:column;gap:10px"><p class="eyebrow" data-t="lobby_players"></p><ul class="plist" id="plist"></ul><p class="note" id="invNote"></p></div>
      <div class="row"><button class="btn ghost" id="bNetBack" type="button" data-t="back"></button></div>
    </div>
  </section>

  <!-- WAITING ROOM -->
  <section id="sWait" hidden>
    <div class="panel" style="max-width:520px">
      <p class="eyebrow" data-t="opponent"></p>
      <div class="code" id="roomCode">—</div>
      <p class="note" id="waitNote"></p>
      <div class="row"><button class="btn ghost" id="bLeave" type="button" data-t="leave"></button></div>
    </div>
  </section>

  <!-- SETUP -->
  <section id="sSetup" hidden>
    <div style="display:flex;flex-direction:column;gap:18px">
      <h2 data-t="pick_theme"></h2>
      <div class="themes" id="themes"></div>
      <div class="row sizes"><span class="eyebrow" data-t="board_size"></span><div class="seg" id="sizes"></div></div>
      <div class="row"><button class="btn" id="bSetupGo" type="button" data-t="next"></button><button class="btn ghost" id="bSetupBack" type="button" data-t="back"></button></div>
    </div>
  </section>

  <!-- PICK SECRET -->
  <section id="sPick" hidden>
    <div style="display:flex;flex-direction:column;gap:16px">
      <div class="row" style="justify-content:space-between"><div><h2 data-t="pick_secret"></h2><p class="note" data-t="pick_secret_n"></p></div>
        <div class="row"><button class="btn" id="bPickOk" type="button" disabled data-t="this_one"></button><button class="btn ghost" id="bPickRand" type="button" data-t="random"></button></div></div>
      <p class="note" id="pickNote"></p>
      <div class="board" id="pickBoard"></div>
    </div>
  </section>

  <!-- PLAY -->
  <section id="sPlay" hidden>
    <div class="game">
      <div class="board" id="board"></div>
      <aside class="side">
        <div class="turn" id="turn"></div>
        <div class="mine" id="mine"></div>
        <div class="row" style="justify-content:space-between"><span class="count" id="myLeft"></span><span class="count" id="oppLeft"></span></div>
        <div class="panel" style="padding:14px;gap:10px">
          <span class="eyebrow" data-t="questions"></span>
          <div class="qs" id="qs"></div>
          <form class="ask" id="askForm" hidden><input type="text" id="askText" maxlength="120" autocomplete="off"><button class="btn" type="submit" data-t="ask"></button></form>
          <div class="row"><button class="btn ghost" id="bGuess" type="button" data-t="guess"></button></div>
        </div>
        <div class="panel" style="padding:14px;gap:8px"><span class="eyebrow" data-t="log"></span><ul class="log" id="log"></ul></div>
        <button class="btn ghost" id="bQuit" type="button" data-t="quit"></button>
      </aside>
    </div>
  </section>

  <!-- RESULT -->
  <section id="sResult" class="result" hidden>
    <div class="big" id="resBig"></div>
    <p class="lede" id="resText"></p>
    <div class="reveal" id="reveal"></div>
    <div class="row"><button class="btn" id="bAgain" type="button" data-t="again"></button><button class="btn ghost" id="bMenu" type="button" data-t="menu"></button></div>
    <p class="note" id="resNote"></p>
  </section>
</div>

<div class="modal" id="infoModal" hidden><div class="panel info" style="display:flex;flex-direction:column;gap:10px">
  <div style="display:flex;justify-content:space-between;align-items:center"><h2 style="margin:0" data-t="i_title"></h2><button class="ib" id="infoX" type="button" aria-label="Close"><i class="fa-solid fa-xmark"></i></button></div>
  <p data-t="i_lede"></p><h3 data-t="i_h1"></h3><ul><li data-t="i_1"></li><li data-t="i_2"></li><li data-t="i_3"></li><li data-t="i_4"></li></ul>
  <h3 data-t="i_h2"></h3><ul><li data-t="i_5"></li><li data-t="i_6"></li><li data-t="i_7"></li></ul></div></div>
<div class="modal" id="ansModal" hidden>
  <div class="panel">
    <span class="eyebrow" data-t="opp_asks"></span>
    <div class="qtext" id="ansQ"></div>
    <div class="row"><button class="btn" id="aYes" type="button" data-t="yes"></button><button class="btn" id="aNo" type="button" data-t="no"></button><button class="btn ghost" id="aUnk" type="button" data-t="unknown"></button></div>
  </div>
</div>
<div class="toast" id="toast" hidden></div>

<script>
(()=>{
'use strict';
const $=s=>document.querySelector(s);
/* ---------- themes: [id, question RU, question EN, chip RU, chip EN] and heroes [RU, EN, features] ---------- */
const THEMES=[
{id:'witcher',name:['Ведьмак','The Witcher'],sub:['Континент, ведьмаки и чародейки','The Continent, witchers and sorceresses'],acc:'#b3262a',acc2:'#b8b2a3',
 q:[['woman','Это женщина?','Is it a woman?','женщина','woman'],['witcher','Это ведьмак?','Is it a witcher?','ведьмак','witcher'],['wolf','Из Школы Волка?','From the School of the Wolf?','Школа Волка','Wolf School'],

/* ---------- emblems (abstract seals, not portraits) ---------- */
function hash(s){let h=2166136261;for(const ch of s){h^=ch.codePointAt(0);h=Math.imul(h,16777619);}return h>>>0;}
function sigil(id){
  const h=hash(G.theme.id+hero(id)[1]),acc=G.theme.acc,acc2=G.theme.acc2;
  const sides=3+(h%6),rot=(h>>3)%360,rings=1+((h>>7)%3),dots=(h>>9)%5,inner=4+((h>>12)%5),flip=(h>>15)&1;
  const pts=(n,r,a)=>Array.from({length:n},(_,i)=>{const t=(i/n)*Math.PI*2+a*Math.PI/180;return (50+Math.cos(t)*r).toFixed(1)+','+(50+Math.sin(t)*r).toFixed(1);}).join(' ');
  let s=`<svg viewBox="0 0 100 100" aria-hidden="true"><circle cx="50" cy="50" r="47" fill="${flip?acc:'#1c1814'}" opacity=".95"/>`;
  for(let i=0;i<rings;i++)s+=`<circle cx="50" cy="50" r="${42-i*5}" fill="none" stroke="${flip?'#1c1814':acc}" stroke-width="1.2" opacity="${.8-i*.2}"/>`;
  s+=`<polygon points="${pts(sides,30,rot)}" fill="none" stroke="${acc2}" stroke-width="3"/>`;
  s+=`<polygon points="${pts(inner,15,rot+30)}" fill="${flip?'#1c1814':acc}"/>`;
  for(let i=0;i<dots;i++){const t=(i/dots)*Math.PI*2+rot;s+=`<circle cx="${(50+Math.cos(t)*36).toFixed(1)}" cy="${(50+Math.sin(t)*36).toFixed(1)}" r="2.6" fill="${acc2}"/>`;}
  const ini=hero(id)[L()].replace(/[^\p{L}\p{N}]/gu,'').slice(0,1).toUpperCase();
  s+=`<circle cx="50" cy="50" r="12.5" fill="#1c1814"/><text x="50" y="57" text-anchor="middle" font-family="Alegreya SC, Georgia, serif" font-weight="700" font-size="19" fill="#efe7d6">${ini}</text></svg>`;
  return s;
}
function cardEl(id,opts={}){
  const b=document.createElement('button');b.type='button';b.className='card';b.dataset.id=id;
  const chips=G.theme.q.filter(q=>has(id,q[0])).map(q=>`<i>${q[3+L()]}</i>`).join('');
  b.innerHTML=`<div class="in"><div class="face">${sigil(id)}<b></b><div class="chips">${chips}</div></div><div class="backf"></div></div>`;
  b.querySelector('b').textContent=hname(id);
  b.setAttribute('aria-label',hname(id));
  if(opts.down)b.classList.add('down');
  return b;
}

  $('#lRu').setAttribute('aria-pressed',cfg.lang==='ru');$('#lEn').setAttribute('aria-pressed',cfg.lang==='en');
  updateNetNote();renderThemes();
  if(!$('#sPlay').hidden)renderPlay();if(!$('#sPick').hidden)renderPick();
}
$('#bInfo').onclick=()=>{$('#infoModal').hidden=false;};$('#infoX').onclick=()=>{$('#infoModal').hidden=true;};$('#infoModal').onclick=e=>{if(e.target.id==='infoModal')$('#infoModal').hidden=true;};
$('#lRu').onclick=()=>{cfg.lang='ru';saveCfg();applyLang();shellPost('lang',{lang:'ru'});};$('#lEn').onclick=()=>{cfg.lang='en';saveCfg();applyLang();shellPost('lang',{lang:'en'});};

/* ---------- setup ---------- */
function renderThemes(){
  const box=$('#themes');box.innerHTML='';
  for(const th of THEMES){const b=document.createElement('button');b.type='button';b.className='tile';b.style.setProperty('--tc',th.acc);b.setAttribute('aria-pressed',th===G.theme);
    const n=document.createElement('b');n.textContent=th.name[L()];const s=document.createElement('span');s.textContent=th.sub[L()];b.append(n,s);
    b.onclick=()=>{G.theme=th;setAcc();renderThemes();};box.appendChild(b);}
  const sz=$('#sizes');sz.innerHTML='';
  for(const n of [12,16,20]){const b=document.createElement('button');b.type='button';b.textContent=n;b.setAttribute('aria-pressed',G.size===n);b.onclick=()=>{G.size=n;renderThemes();};sz.appendChild(b);}
}
function setAcc(){document.documentElement.style.setProperty('--acc',G.theme.acc);document.documentElement.style.setProperty('--acc2',G.theme.acc2);}
function randomIds(){const all=G.theme.c.map((_,i)=>i);for(let i=all.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[all[i],all[j]]=[all[j],all[i]];}return all.slice(0,G.size).sort((a,b)=>a-b);}
function resetRound(){Object.assign(G,{secret:-1,oppSecret:-1,turn:'me',guessing:false,busy:false,meReady:false,oppReady:false,over:false,pickSel:-1,oppLeft:G.ids.length});G.down=new Set();G.asked=new Set();G.botAsked=new Set();G.log=[];G.botCand=G.ids.slice();}

/* ---------- pick secret ---------- */
function goPick(){resetRound();setAcc();show('sPick');renderPick();}
function renderPick(){
  const bd=$('#pickBoard');bd.innerHTML='';
  for(const id of G.ids){const c=cardEl(id);if(id===G.pickSel)c.classList.add('cand');c.onclick=()=>{if(G.meReady)return;G.pickSel=id;renderPick();};bd.appendChild(c);}
  $('#bPickOk').disabled=G.pickSel<0||G.meReady;$('#bPickRand').disabled=G.meReady;
  $('#pickNote').textContent=G.meReady&&G.mode==='net'&&!G.oppReady?T('opp_picking'):'';
}
$('#bPickRand').onclick=()=>{G.pickSel=G.ids[Math.floor(Math.random()*G.ids.length)];renderPick();};
$('#bPickOk').onclick=()=>{
  if(G.pickSel<0)return;G.secret=G.pickSel;G.meReady=true;
  if(G.mode==='bot'){G.oppSecret=G.ids[Math.floor(Math.random()*G.ids.length)];G.turn=Math.random()<.5?'me':'opp';if(G.gid)shellPost('start',{gid:G.gid,players:[Shell.me]});startPlay();}
  else{send({t:'ready'});renderPick();maybeStartNet();}
};

/* ---------- play ---------- */
function startPlay(){show('sPlay');renderPlay();if(G.turn==='opp'&&G.mode==='bot')setTimeout(botTurn,1200);}
function myLeft(){return G.ids.filter(id=>!G.down.has(id)).length;}
function renderPlay(){
  const bd=$('#board');bd.innerHTML='';bd.classList.toggle('guessing',G.guessing);
  for(const id of G.ids){const c=cardEl(id,{down:G.down.has(id)});c.onclick=()=>onCard(id);bd.appendChild(c);}
  renderSide();
}
function renderSide(){
  const me=G.turn==='me';const t=$('#turn');t.className='turn'+(me?' me':'');
  t.textContent=me?T('your_turn'):T('opp_turn');const sm=document.createElement('small');
  sm.textContent=G.busy?T('wait_ans'):me?T('your_turn_n'):(G.mode==='bot'?T('bot_turn_n'):T('opp_turn_n'));t.appendChild(sm);
  const mine=$('#mine');mine.innerHTML=sigil(G.secret)+'<div><span></span><b></b></div>';mine.querySelector('span').textContent=T('my_secret');mine.querySelector('b').textContent=hname(G.secret);
  $('#myLeft').textContent=T('left_me',{n:myLeft()});
  $('#oppLeft').textContent=T('left_opp',{n:G.mode==='bot'?G.botCand.length:G.oppLeft});
  const qs=$('#qs');qs.innerHTML='';const can=me&&!G.busy&&!G.over;
  for(const q of G.theme.q){const b=document.createElement('button');b.type='button';b.className='q'+(G.asked.has(q[0])?' used':'');b.textContent=q[1+L()];b.disabled=!can||G.asked.has(q[0]);b.onclick=()=>askQ(q[0]);qs.appendChild(b);}
  $('#askForm').hidden=G.mode!=='net';$('#askForm').querySelector('button').disabled=!can;$('#askText').disabled=!can;
  $('#bGuess').disabled=!can;$('#bGuess').textContent=G.guessing?T('guess_on'):T('guess');
  const log=$('#log');log.innerHTML='';
  for(const e of G.log.slice().reverse()){const li=document.createElement('li');const w=document.createElement('span');w.className='who';w.textContent=e.who;const q=document.createElement('span');q.textContent=e.q;li.append(w,q);
    if(e.a!=null){const a=document.createElement('span');a.className='a '+(e.a===true?'y':e.a===false?'n':'');a.textContent=e.a===true?T('yes'):e.a===false?T('no'):T('unknown');li.appendChild(a);}log.appendChild(li);}
}
function onCard(id){
  if(G.over)return;
  if(G.guessing){if(G.down.has(id))return;G.guessing=false;makeGuess(id);return;}
  if(G.down.has(id))G.down.delete(id);else G.down.add(id);
  const el=$(`#board .card[data-id="${id}"]`);if(el)el.classList.toggle('down',G.down.has(id));
  renderSide();if(G.mode==='net')send({t:'left',n:myLeft()});
}
$('#bGuess').onclick=()=>{G.guessing=!G.guessing;$('#board').classList.toggle('guessing',G.guessing);renderSide();};
function addLog(who,q,a,g){G.log.push({who,q,a,g:!!g});}
function autoFlip(qid,ans){let n=0;for(const id of G.ids){if(G.down.has(id))continue;if(has(id,qid)!==ans){G.down.add(id);n++;}}if(n)toast(T('flipped',{n}));if(G.mode==='net')send({t:'left',n:myLeft()});}
function askQ(qid){
  if(G.turn!=='me'||G.busy||G.over)return;G.asked.add(qid);
  if(G.mode==='bot'){const ans=has(G.oppSecret,qid);addLog(T('you'),qText(qid),ans);autoFlip(qid,ans);G.turn='opp';renderPlay();setTimeout(botTurn,1300);}
  else{G.busy=true;G.pendingQ=qid;send({t:'ask',q:qid});renderSide();}
}
$('#askForm').onsubmit=e=>{e.preventDefault();const txt=$('#askText').value.trim().slice(0,120);if(!txt||G.turn!=='me'||G.busy)return;G.busy=true;G.pendingText=txt;$('#askText').value='';send({t:'askt',text:txt});renderSide();};
function makeGuess(id){
  if(G.mode==='bot'){const ok=id===G.oppSecret;addLog(T('you'),T('guess_q',{n:hname(id)}),ok,1);finish(ok?'win':'lose_wrong',id);}
  else{G.busy=true;G.pendingGuess=id;send({t:'guess',id});renderPlay();}
}

/* ---------- computer ---------- */
function botTurn(){
  if(G.over||G.mode!=='bot')return;
  if(G.botCand.length===1){const g=G.botCand[0];addLog(T('bot'),T('guess_q',{n:hname(g)}),g===G.secret,1);finish(g===G.secret?'lose':'win_wrong',g);return;}
  let best=null,bestScore=1e9;
  for(const q of G.theme.q){if(G.botAsked.has(q[0]))continue;const y=G.botCand.filter(id=>has(id,q[0])).length,n=G.botCand.length-y;if(!y||!n)continue;const sc=Math.abs(y-n)+Math.random()*.9;if(sc<bestScore){bestScore=sc;best=q[0];}}
  if(!best){const g=G.botCand[Math.floor(Math.random()*G.botCand.length)];addLog(T('bot'),T('guess_q',{n:hname(g)}),g===G.secret,1);finish(g===G.secret?'lose':'win_wrong',g);return;}
  G.botAsked.add(best);const ans=has(G.secret,best);G.botCand=G.botCand.filter(id=>has(id,best)===ans);
  addLog(T('bot'),qText(best),ans);G.turn='me';renderPlay();
}

/* ---------- finish ---------- */
function finish(kind,guessId){
  const wasOver=G.over;G.over=true;G.busy=false;G.guessing=false;
  const win=kind==='win'||kind==='win_wrong'||kind==='opp_resigned';
  if(SHELL&&G.gid&&!wasOver){const gid=G.gid;G.gid=null;
    if(kind==='opp_left')shellPost('abort',{gid});
    else{shellPost('event',{gid,ev:'gw.fin',x:{win,theme:G.theme.id,bot:G.mode==='bot',myQ:G.log.filter(e=>!e.g&&e.who===T('you')).length}});if(win)shellPost('event',{gid,ev:'gw.win'});if(kind==='lose_wrong')shellPost('event',{gid,ev:'gw.wrongguess'});
      if(G.mode==='bot'||N.role==='host'){const q=G.log.filter(e=>!e.g).length;setTimeout(()=>shellPost('end',{gid,sum:{players:G.mode==='bot'?[Shell.me]:[Shell.me,N.opp],q}}),1500);}}}
  $('#resBig').textContent=win?T('win'):T('lose');$('#resBig').className='big '+(win?'win':'lose');
  const oppName=hname(G.oppSecret);
  $('#resText').textContent=kind==='win'?T('win_t',{n:oppName}):kind==='lose_wrong'?T('lose_wrong',{g:hname(guessId),n:oppName}):kind==='lose'?T('lose_t',{n:hname(G.secret)}):
    kind==='win_wrong'?T('win_wrong',{g:hname(guessId)}):kind==='opp_resigned'?T('resigned'):kind==='resigned'?T('you_resigned'):T('opp_left');
  const rv=$('#reveal');rv.innerHTML='';
  for(const [id,lab] of [[G.secret,'reveal_mine'],[G.oppSecret,'reveal_opp']]){if(id<0)continue;const w=document.createElement('div');w.appendChild(cardEl(id));const p=document.createElement('p');p.textContent=T(lab);w.appendChild(p);rv.appendChild(w);}
  $('#resNote').textContent='';$('#bAgain').disabled=G.mode==='net'&&(N.role!=='host'||!N.opp);
  if(G.mode==='net'&&N.role!=='host'&&N.opp)$('#resNote').textContent=T('again_wait');
  show('sResult');
}
$('#bQuit').onclick=()=>{if(G.over)return;if(G.mode==='net')send({t:'resign',secret:G.secret});finish('resigned');};
$('#bAgain').onclick=()=>{if(G.mode==='bot'){show('sSetup');renderThemes();}else if(N.role==='host'){show('sSetup');renderThemes();}};
$('#bMenu').onclick=()=>{leaveNet();show('sMenu');};

/* ---------- menu wiring ---------- */
$('#bBot').onclick=()=>{G.mode='bot';show('sSetup');renderThemes();};
$('#bNet').onclick=()=>{show('sNet');netSig='';renderNet();};
$('#bNetBack').onclick=()=>show('sMenu');
$('#bSetupBack').onclick=()=>{if(G.mode==='net'){leaveNet();}show('sMenu');};
$('#bSetupGo').onclick=()=>{G.ids=randomIds();G.gid=SHELL?rid():null;if(G.mode==='net'){send({t:'setup',theme:G.theme.id,ids:G.ids,gid:G.gid});}goPick();pushGp();};
$('#bLeave').onclick=()=>{leaveNet();show('sMenu');};

/* ---------- online: through the site lobby ---------- */
const inClaude=!!window.claude;
const SHELL=(()=>{try{return window.parent!==window&&!!window.parent.__gameShell;}catch(e){return false;}})();
const Shell={me:null,name:'',inLobby:false,peers:[]};
function shellPost(type,o){if(SHELL){try{parent.postMessage(Object.assign({svo:1,type},o||{}),'*');}catch(e){}}}
const rid=()=>Math.random().toString(36).slice(2,10);
N.opp=null;N.inv=null;N.invFrom=new Map();N.goneT=0;
function send(m){if(N.opp)shellPost('emit',{to:N.opp,d:m});}
function sendTo(l,m){shellPost('emit',{to:l,d:m});}
function leaveNet(){if(N.opp)send({t:'bye'});N.opp=null;N.role=null;N.inv=null;G.gid=null;pushGp();}
function myName(){return clean($('#nick').value)||Shell.name||T('player');}
function pushGp(){shellPost('gp',{d:{n:myName(),busy:N.opp?1:0,gid:G.gid||null}});}
function peerName(q){return clean(q.gp&&q.gp.n)||clean(q.name)||T('player');}
function oppGone(){
  if(!N.opp)return;N.opp=null;
  if(!G.over&&!$('#sPlay').hidden)finish('opp_left');
  else{toast(T('opp_left'));N.role=null;show('sNet');renderNet();}
  pushGp();
}
function updateNetNote(){
  $('#netNeed').hidden=SHELL&&Shell.inLobby;$('#netList').hidden=!(SHELL&&Shell.inLobby);
  $('#netNote').textContent=SHELL?T('need_lobby'):inClaude?T('net_off'):T('direct');
  $('#bNeed').textContent=SHELL?T('lobby_btn'):T('to_site');$('#bNeed').hidden=inClaude&&!SHELL;
}
let netSig='';
function renderNet(){
  updateNetNote();if(!(SHELL&&Shell.inLobby))return;
  const others=Shell.peers.filter(q=>q&&q.label!==Shell.me);
  const sig=others.map(q=>q.label+peerName(q)+q.w+(q.gp&&q.gp.busy)+q.ig).join('|')+[...N.invFrom.keys()].join()+N.inv+cfg.lang;if(sig===netSig)return;netSig=sig;
  const ul=$('#plist');ul.innerHTML='';
  if(!others.length){const li=document.createElement('li');li.textContent=T('nobody');ul.appendChild(li);}
  for(const q of others){
    const li=document.createElement('li');const inv=N.invFrom.has(q.label);if(inv)li.className='inv';
    const nm=document.createElement('div');nm.className='nm';nm.textContent=peerName(q);const sm=document.createElement('small');
    const here=q.w==='gw';const busy=here&&q.gp&&q.gp.busy;sm.textContent=inv?T('inv_from',{n:peerName(q)}):(busy||q.ig)?T('busy'):here?T('here'):T('elsewhere');nm.appendChild(sm);li.appendChild(nm);
    const bet=document.createElement('button');bet.type='button';bet.className='btn bet';bet.textContent='BET';bet.disabled=!!q.ig;bet.onclick=()=>shellPost('bet',{target:q.label});li.appendChild(bet);
    if(inv){const a=document.createElement('button');a.type='button';a.className='btn sm';a.textContent=T('accept');a.onclick=()=>acceptInv(q.label);
      const d=document.createElement('button');d.type='button';d.className='btn ghost sm';d.textContent=T('decline');d.onclick=()=>{N.invFrom.delete(q.label);sendTo(q.label,{t:'dec'});netSig='';renderNet();};li.append(a,d);}
    else if(!busy&&!q.ig){const b=document.createElement('button');b.type='button';b.className='btn sm';b.textContent=T('invite');b.disabled=N.inv===q.label;
      b.onclick=()=>{N.inv=q.label;shellPost('invite',{to:q.label});$('#invNote').textContent=T('inv_sent',{n:peerName(q)});netSig='';renderNet();};li.appendChild(b);}
    ul.appendChild(li);}
}
function acceptInv(from){
  if(N.opp)return;const pq=Shell.peers.find(x=>x&&x.label===from);const name=N.invFrom.get(from)||(pq?peerName(pq):'');N.invFrom.clear();N.inv=null;N.opp=from;N.role='guest';G.mode='net';G.oppName=name||T('player');
  send({t:'acc',name:myName()});$('#roomCode').textContent=G.oppName;$('#waitNote').textContent=T('host_setup',{n:G.oppName});show('sWait');pushGp();
}
function onShellG(from,m){
  if(!m||typeof m!=='object')return;
  if(m.t==='inv'){if(N.opp)return sendTo(from,{t:'dec'});N.invFrom.set(from,clean(m.name)||T('player'));netSig='';if(!$('#sNet').hidden)renderNet();else toast(T('inv_from',{n:clean(m.name)||T('player')}));return;}
  if(m.t==='acc'){if(N.inv!==from||N.opp)return;N.inv=null;N.opp=from;N.role='host';G.mode='net';G.oppName=clean(m.name)||T('player');$('#invNote').textContent='';pushGp();show('sSetup');renderThemes();return;}
  if(m.t==='dec'){if(N.inv===from){N.inv=null;const q=Shell.peers.find(x=>x.label===from);$('#invNote').textContent=T('inv_dec',{n:q?peerName(q):T('player')});netSig='';renderNet();}return;}
  if(from!==N.opp)return;
  if(m.t==='bye'){oppGone();return;}
  onMsg(m);
}
addEventListener('message',e=>{if(!SHELL||e.source!==parent)return;const m=e.data;if(!m||m.svo!==1)return;
  if(m.type==='hello'||m.type==='peers'){if(typeof m.me==='string')Shell.me=m.me;Shell.inLobby=!!m.inLobby;Shell.peers=Array.isArray(m.peers)?m.peers.slice(0,16):[];
    if(m.type==='hello'){Shell.name=clean(m.name);if(!$('#nick').value)$('#nick').value=Shell.name;pushGp();}
    if(!$('#sNet').hidden)renderNet();}
  else if(m.type==='ev'&&m.k==='g'&&m.d&&m.d.game==='gw')onShellG(String(m.from||''),m.d.m);
  else if(m.type==='accept'&&typeof m.from==='string')acceptInv(m.from);});
setInterval(()=>{if(!SHELL)return;
  for(const k of [...N.invFrom.keys()]){const q=Shell.peers.find(x=>x.label===k);if(!q||q.w!=='gw'){N.invFrom.delete(k);netSig='';}}
  if(N.opp){const q=Shell.peers.find(x=>x.label===N.opp);if(Shell.inLobby&&q&&q.w==='gw'){N.goneT=0;}else if(!N.goneT)N.goneT=performance.now();else if(performance.now()-N.goneT>3000){N.goneT=0;oppGone();}}
  pushGp();},1000);
$('#bNeed').onclick=()=>{if(SHELL)shellPost('lobby');else location.href='index.html';};
function maybeStartNet(){if(N.role==='host'&&G.meReady&&G.oppReady){const first=Math.random()<.5?'host':'guest';G.turn=first==='host'?'me':'opp';send({t:'start',first});shellPost('start',{gid:G.gid,players:[Shell.me,N.opp]});startPlay();}}
function onMsg(m){
  if(!m||typeof m!=='object')return;
  switch(m.t){
    case 'hi':G.oppName=clean(m.name)||T('player');if(!N.hiBack){N.hiBack=true;send({t:'hi',name:myName()});}if(N.role==='host'){show('sSetup');renderThemes();}else{$('#waitNote').textContent=T('host_setup',{n:G.oppName});}break;
    case 'setup':{if(N.role!=='guest')return;const th=THEMES.find(t=>t.id===m.theme);if(!th||!Array.isArray(m.ids))return;G.theme=th;G.ids=m.ids.filter(i=>Number.isInteger(i)&&i>=0&&i<th.c.length).slice(0,20);G.size=G.ids.length;G.gid=typeof m.gid==='string'?m.gid.slice(0,16):null;goPick();pushGp();break;}
    case 'ready':G.oppReady=true;renderPick();maybeStartNet();break;
    case 'start':if(N.role!=='guest')return;G.turn=m.first==='guest'?'me':'opp';startPlay();break;
    case 'ask':{const qid=String(m.q||'');if(!qById(qid))return;const ans=has(G.secret,qid);addLog(G.oppName,qText(qid),ans);send({t:'ans',q:qid,v:ans});G.turn='me';renderPlay();break;}
    case 'ans':{if(!G.busy)return;G.busy=false;const qid=G.pendingQ;const ans=!!m.v;addLog(T('you'),qText(qid),ans);autoFlip(qid,ans);G.turn='opp';renderPlay();break;}
    case 'askt':{const txt=String(m.text||'').slice(0,120);$('#ansQ').textContent=txt;$('#ansModal').hidden=false;G.pendingAsk=txt;break;}
    case 'anst':{if(!G.busy)return;G.busy=false;const v=m.v==='yes'?true:m.v==='no'?false:null;addLog(T('you'),G.pendingText,v);G.turn='opp';renderPlay();break;}
    case 'guess':{const id=Number(m.id);const ok=id===G.secret;send({t:'gres',ok,id,secret:G.secret});addLog(G.oppName,T('guess_q',{n:hname(id)}),ok,1);finish(ok?'lose':'win_wrong',id);break;}
    case 'gres':{G.oppSecret=Number(m.secret);const ok=!!m.ok;addLog(T('you'),T('guess_q',{n:hname(G.pendingGuess)}),ok,1);finish(ok?'win':'lose_wrong',G.pendingGuess);break;}
    case 'resign':G.oppSecret=Number(m.secret);if(!G.over)finish('opp_resigned');break;
    case 'left':G.oppLeft=Math.max(0,Math.min(20,Number(m.n)||0));if(!$('#sPlay').hidden)renderSide();break;
  }
}
const answer=v=>{$('#ansModal').hidden=true;const vv=v===true?true:v===false?false:null;addLog(G.oppName,G.pendingAsk,vv);send({t:'anst',v:v===true?'yes':v===false?'no':'unk'});G.turn='me';renderPlay();};
$('#aYes').onclick=()=>answer(true);$('#aNo').onclick=()=>answer(false);$('#aUnk').onclick=()=>answer(null);

/* ---------- boot ---------- */
if(!inClaude)$('#hubLink').hidden=false;
if(SHELL)$('#hubLink').addEventListener('click',e=>{e.preventDefault();if(N.opp)send({t:'bye'});shellPost('exit');});
try{$('#nick').value=clean(localStorage.getItem('gs-alias-gw')||'');}catch(e){}
$('#nick').addEventListener('input',()=>{try{localStorage.setItem('gs-alias-gw',clean($('#nick').value));}catch(e){}pushGp();});
shellPost('ready');
setAcc();applyLang();show('sMenu');
})();
</script>
