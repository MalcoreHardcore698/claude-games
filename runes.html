<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Руны удачи</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+SC:wght@600;700&family=Fira+Sans+Condensed:wght@400;500;700&family=Fira+Mono:wght@500;700&family=Noto+Sans+Runic&family=Rubik+Mono+One&display=swap">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
<style>
/* Layout: an arcane slot cabinet. Battlefield window with the foe's own panel and reel on the right;
   the brass deck below: hero card + rune bag (left), socket ring with synergy lines (middle), the hero's reels (right). */
:root{
  --bg:#110f16;--deck:#1b1822;--deck2:#241f2d;--slot:#0d0b12;
  --line:rgba(217,164,65,.22);--line2:rgba(255,255,255,.08);
  --brass:#d9a441;--brass2:#f3cf7a;--ink:#efe6d2;--muted:#9a90a6;--arc:#5ee6c8;
  --buff:#57d38c;--debuff:#ff6a5c;--hp:#e5484d;--chips:#3d8bff;--mult:#ff4d4d;
  --display:"Cormorant SC",Georgia,serif;--body:"Fira Sans Condensed",system-ui,sans-serif;--mono:"Fira Mono",ui-monospace,monospace;
  --num:"Rubik Mono One","Fira Mono",monospace;--rune:"Noto Sans Runic","Segoe UI Historic","Segoe UI Symbol",serif;
  color-scheme:dark;
}
[hidden]{display:none!important}
*{box-sizing:border-box}
::-webkit-scrollbar{width:8px;height:8px}::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:rgba(217,164,65,.25);border-radius:8px;border:2px solid transparent;background-clip:padding-box}
@supports not selector(::-webkit-scrollbar){*{scrollbar-width:thin;scrollbar-color:rgba(217,164,65,.3) transparent}}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font:400 15px/1.4 var(--body);min-height:100vh;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  background:radial-gradient(ellipse 70% 40% at 50% 0%,rgba(217,164,65,.09),transparent 70%),var(--bg)}
button{font:inherit;color:inherit}
a{color:inherit}
.wrap{max-width:1240px;margin:0 auto;padding-block:12px 28px;display:flex;flex-direction:column;gap:12px}
.top{display:flex;align-items:center;gap:12px}
.back{display:inline-flex;align-items:center;gap:8px;text-decoration:none;color:var(--muted);background:none;border:0;cursor:pointer;padding:0}
.back:hover{color:var(--brass2)}
.top .sp{flex:1}
.top .ttl{font:700 22px var(--display);color:var(--brass2);letter-spacing:.04em}
.ib{width:36px;height:36px;border-radius:10px;border:1px solid var(--line);background:transparent;color:var(--muted);cursor:pointer;display:grid;place-items:center;font-size:15px}
.ib:hover{color:var(--brass2);border-color:var(--brass)}
.seg{position:relative;display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden}
.seg button{position:relative;z-index:1;background:transparent;border:0;padding:7px 14px;font:700 12px var(--mono);cursor:pointer;color:var(--muted);transition:color .2s;display:inline-flex;gap:7px;align-items:center}
.seg button[aria-pressed="true"]{color:#1a1205}
.seg .thumb{position:absolute;top:0;bottom:0;background:var(--brass);border-radius:999px;transition:left .28s cubic-bezier(.3,1.3,.5,1),width .28s cubic-bezier(.3,1.3,.5,1)}
.btn{font:700 15px var(--body);letter-spacing:.06em;text-transform:uppercase;padding:11px 18px;border:0;border-radius:10px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:9px;
  background:linear-gradient(180deg,var(--brass2),var(--brass));color:#24160a;box-shadow:0 4px 0 #8a6220,inset 0 1px 0 rgba(255,255,255,.4);transition:transform .08s,box-shadow .08s,filter .15s}
.btn:hover{filter:brightness(1.08)}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #8a6220}
.btn.ghost{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 1px var(--line)}
.btn.sm{padding:8px 12px;font-size:13px}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none;filter:none}
:focus-visible{outline:2px solid var(--arc);outline-offset:3px}
.eyebrow{margin:0;font:700 11px var(--mono);letter-spacing:.18em;text-transform:uppercase;color:var(--muted);display:flex;gap:8px;align-items:center}
.note{margin:0;color:var(--muted);font-size:14px}
/* ---------- menu ---------- */
.menuHead{text-align:center;padding:16px 0 4px}
.menuHead h1{margin:0;font:700 clamp(42px,6.4vw,76px)/1 var(--display);color:var(--brass2);text-shadow:0 4px 0 #3d2a0c,0 0 40px rgba(217,164,65,.3)}
.menuHead h1 .r{font-family:var(--rune);color:var(--arc);font-size:.7em;margin:0 .2em;text-shadow:0 0 20px var(--arc)}
.menuHead p{color:var(--muted);font-size:16px;max-width:64ch;margin:10px auto 0}
.msec{display:flex;flex-direction:column;gap:12px;margin-top:14px}
.msec .hd{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.msec h3{margin:0;font:700 28px var(--display);color:var(--brass2);display:flex;gap:10px;align-items:center}
.msec .hd .sp{flex:1}
.cards3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.mcard{position:relative;border-radius:16px;overflow:hidden;border:1px solid var(--line);background:var(--deck);display:flex;flex-direction:column}
.mcard .pic{height:120px;position:relative;display:grid;place-items:center;overflow:hidden}
.mcard .pic i.h{font-size:56px;color:#fff;filter:drop-shadow(0 6px 0 rgba(0,0,0,.35));position:relative;z-index:1}
.mcard .pic i.c{position:absolute;right:18px;bottom:12px;font-size:46px;color:rgba(0,0,0,.45);z-index:1}
.mcard .body{padding:12px 14px 14px;display:flex;flex-direction:column;gap:6px;flex:1}
.mcard h2{margin:0;font:700 23px/1.05 var(--display);color:var(--brass2)}
.mcard p{margin:0;color:var(--muted);font-size:14px}
.mcard .meta{display:flex;gap:10px;flex-wrap:wrap;font:500 12px var(--mono);color:var(--ink)}
.mcard .meta span{display:inline-flex;gap:5px;align-items:center}
.mcard .go{margin-top:auto;align-self:flex-start}
.stars i{color:var(--brass)}.stars i.o{color:rgba(255,255,255,.15)}
.modepic{background:radial-gradient(circle at 50% 120%,rgba(94,230,200,.35),transparent 60%),linear-gradient(160deg,#2a2236,#141019)}
.modepic.w{background:radial-gradient(circle at 50% 120%,rgba(243,207,122,.45),transparent 60%),linear-gradient(160deg,#36290f,#141019)}
.modepic.e{background:radial-gradient(circle at 50% 120%,rgba(255,77,77,.35),transparent 60%),linear-gradient(160deg,#311a1f,#141019)}
.mods{display:flex;flex-wrap:wrap;gap:6px}
.mods span{font:500 12px var(--body);padding:3px 8px;border-radius:999px;border:1px solid var(--line);color:var(--brass2)}
.th-forest{--sky1:#284d47;--sky2:#0f1d1f;--gr:#2b3a1f;--gr2:#1d2914;--deco:#1b3424;--fog:rgba(170,230,200,.08)}
.th-ice{--sky1:#9fc6e2;--sky2:#43678f;--gr:#e7f0f7;--gr2:#b9cfe0;--deco:#6f93b6;--fog:rgba(255,255,255,.18)}
.th-desert{--sky1:#f6b56b;--sky2:#9b4430;--gr:#d99b57;--gr2:#b6763a;--deco:#8a4f2b;--fog:rgba(255,220,170,.12)}
.pic.th{background:linear-gradient(180deg,var(--sky1),var(--sky2))}
.pic.th::after{content:"";position:absolute;left:0;right:0;bottom:0;height:34%;background:linear-gradient(180deg,var(--gr),var(--gr2))}
/* ---------- play: battlefield ---------- */
.field{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:12px}
.scene{position:relative;height:clamp(236px,34vh,300px);border-radius:18px;overflow:hidden;border:1px solid var(--line);background:linear-gradient(180deg,var(--sky1),var(--sky2));box-shadow:inset 0 0 60px rgba(0,0,0,.5)}
.scene.shake{animation:shk .35s}
.scene.shake2{animation:shk2 .5s}
@keyframes shk{20%{translate:-6px 3px}40%{translate:5px -3px}60%{translate:-4px 2px}80%{translate:3px -1px}}
@keyframes shk2{10%{translate:-12px 6px}25%{translate:11px -6px}40%{translate:-9px 4px}55%{translate:7px -4px}70%{translate:-4px 2px}85%{translate:2px -1px}}
.scene .far,.scene .mid{position:absolute;left:0;bottom:24%;width:400%;height:60%;transition:transform 1.4s cubic-bezier(.45,.05,.4,1)}
.scene .far i,.scene .mid i{position:absolute;bottom:0;color:var(--deco)}
.scene .far{opacity:.45}
.scene .ground{position:absolute;left:0;right:0;bottom:0;height:26%;background:linear-gradient(180deg,var(--gr),var(--gr2))}
.scene .ground::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0 60px,rgba(0,0,0,.07) 60px 64px);background-position:var(--gx,0) 0;transition:background-position 1.4s cubic-bezier(.45,.05,.4,1)}
.scene .fog{position:absolute;inset:0;background:linear-gradient(180deg,transparent 40%,var(--fog));pointer-events:none}
.scene .vig{position:absolute;inset:0;pointer-events:none;box-shadow:inset 0 0 calc(40px + var(--dv,0)*30px) calc(var(--dv,0)*14px) rgba(40,0,60,.75);transition:box-shadow .6s;z-index:4}
.scene .hitflash{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at center,transparent 40%,rgba(229,72,77,.55));opacity:0;z-index:6}
.scene .hitflash.on{animation:hf .45s}
@keyframes hf{20%{opacity:1}}
.scene canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:3}
.track{position:absolute;left:14px;right:14px;top:10px;display:flex;align-items:center;z-index:5}
.track .n{flex:none;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:rgba(0,0,0,.45);border:2px solid rgba(255,255,255,.2);font:700 11px var(--mono);color:rgba(255,255,255,.6)}
.track .n.done{background:rgba(87,211,140,.3);border-color:var(--buff);color:#fff}
.track .n.cur{background:var(--brass);border-color:var(--brass2);color:#24160a;box-shadow:0 0 14px var(--brass)}
.track .n.boss{width:34px;height:34px;font-size:14px}
.track .n.castle{width:38px;height:38px;font-size:16px;background:rgba(0,0,0,.6);border-color:var(--brass)}
.track .l{flex:1;height:3px;background:rgba(255,255,255,.18)}
.track .l.done{background:var(--buff)}
.hud{position:absolute;right:14px;top:50px;z-index:5;display:flex;gap:8px}
.hud span{font:700 14px var(--mono);padding:5px 10px;border-radius:10px;background:rgba(0,0,0,.55);border:1px solid var(--line);color:var(--brass2);display:inline-flex;gap:7px;align-items:center}
.hud span.low{color:var(--debuff);border-color:var(--debuff)}
.foe{position:absolute;left:60%;bottom:21%;display:flex;flex-direction:column;align-items:center;z-index:2;transition:transform .2s,opacity .45s;translate:-50% 0}
.foe .fig{font-size:clamp(70px,9vw,104px);line-height:1;filter:drop-shadow(0 8px 0 rgba(0,0,0,.3)) drop-shadow(0 0 var(--glow,0px) var(--gc,transparent));animation:idle 2.4s ease-in-out infinite}
.foe.boss .fig{font-size:clamp(96px,12vw,138px)}
@keyframes idle{50%{translate:0 -5px}}
.foe.hurt .fig{animation:hurt .35s}
@keyframes hurt{20%{translate:-8px 0;filter:brightness(2.4) drop-shadow(0 0 12px #fff)}60%{translate:7px 0}}
.foe.atk{transform:scale(1.25) translateY(10px)}
.foe.dead{opacity:0;transform:translateY(30px) scale(.6) rotate(12deg)}
.foe.spawn{animation:spawn .6s cubic-bezier(.2,1.4,.4,1)}
@keyframes spawn{from{opacity:0;transform:scale(.4) translateY(30px)}}
.foe .blk{position:absolute;top:-8px;right:-26px;font:700 14px var(--mono);color:#cfe1ff;background:rgba(61,123,216,.55);border:1px solid #8fb4ff;border-radius:999px;padding:3px 8px}
.pop{position:absolute;pointer-events:none;z-index:8;font:400 22px var(--num);text-shadow:0 3px 0 rgba(0,0,0,.65);animation:popUp 1.05s cubic-bezier(.2,1.2,.4,1) forwards;white-space:nowrap}
@keyframes popUp{0%{transform:translateY(8px) scale(.4);opacity:0}18%{transform:translateY(-6px) scale(1.25);opacity:1}35%{transform:translateY(-12px) scale(1)}100%{transform:translateY(-58px) scale(.9);opacity:0}}
.pop.dmg{color:#fff}.pop.mag{color:var(--arc)}.pop.crit{color:var(--brass2);font-size:32px}.pop.big{font-size:40px;color:#fff}.pop.heal{color:var(--buff)}.pop.hit{color:var(--debuff)}.pop.blk{color:#9cc3ff;font-size:17px}.pop.gold{color:var(--brass2);font-size:17px}
.banner{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none;z-index:9;font:700 clamp(32px,5vw,52px) var(--display);color:var(--brass2);text-shadow:0 4px 0 rgba(0,0,0,.5);opacity:0;transition:opacity .3s,scale .3s;scale:.8}
.banner.on{opacity:1;scale:1}
.bufbar{position:absolute;left:12px;right:12px;bottom:8px;display:flex;gap:6px;flex-wrap:wrap;z-index:5}
.bf{display:inline-flex;align-items:center;gap:6px;padding:4px 9px;border-radius:999px;font:500 12px var(--body);background:rgba(0,0,0,.6);border:1px solid;backdrop-filter:blur(3px);cursor:help}
.bf.b{border-color:var(--buff);color:#bff3d4}.bf.d{border-color:var(--debuff);color:#ffd0cb}
.bf small{font:500 10px var(--mono);opacity:.8}
/* Balatro-style tally */
.tally{position:absolute;left:16px;top:52px;z-index:7;display:flex;flex-direction:column;gap:8px;opacity:0;transform:translateX(-14px);transition:opacity .25s,transform .25s;pointer-events:none}
.tally.on{opacity:1;transform:none}
.tally .eq{display:flex;align-items:center;gap:8px}
.tb{min-width:78px;padding:8px 12px;border-radius:12px;text-align:center;font:400 26px/1 var(--num);color:#fff;box-shadow:0 4px 0 rgba(0,0,0,.4),inset 0 1px 0 rgba(255,255,255,.3)}
.tb.base{background:linear-gradient(180deg,#5aa0ff,var(--chips))}
.tb.mult{background:linear-gradient(180deg,#ff7a6e,var(--mult))}
.tb small{display:block;font:700 9px var(--mono);letter-spacing:.12em;opacity:.85;margin-bottom:4px}
.tally .x{font:400 22px var(--num);color:#fff;text-shadow:0 2px 0 #000}
.tot{font:400 40px/1 var(--num);color:#fff;text-shadow:0 4px 0 rgba(0,0,0,.6),0 0 24px rgba(255,180,60,.6);padding-left:4px;display:inline-block}
.tot.fire{animation:fire .5s infinite alternate}
@keyframes fire{to{text-shadow:0 4px 0 rgba(0,0,0,.6),0 0 40px rgba(255,120,40,.95);color:#ffe3a8}}
.bump{animation:bump .28s cubic-bezier(.2,1.8,.4,1)}
@keyframes bump{40%{transform:scale(1.3) rotate(-4deg)}}
.tmods{display:flex;flex-wrap:wrap;gap:5px;max-width:330px}
.tmods span{font:700 11px var(--mono);padding:3px 8px;border-radius:999px;background:rgba(0,0,0,.65);border:1px solid rgba(255,77,77,.6);color:#ffd0cb;animation:tagIn .3s cubic-bezier(.2,1.6,.4,1)}
.tmods span.g{border-color:rgba(87,211,140,.6);color:#c8f5da}.tmods span.b{border-color:rgba(61,139,255,.6);color:#cfe1ff}
@keyframes tagIn{from{transform:scale(.4);opacity:0}}
.side{display:flex;gap:6px;flex-wrap:wrap}
.side span{font:700 13px var(--mono);padding:4px 9px;border-radius:9px;background:rgba(0,0,0,.6);display:inline-flex;gap:6px;align-items:center}
/* foe panel */
.foep{border-radius:18px;border:1px solid var(--line);background:linear-gradient(180deg,var(--deck2),var(--deck));padding:12px;display:flex;flex-direction:column;gap:9px;min-height:0}
.foep .hd{display:flex;align-items:center;gap:10px}
.foep .ic{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;font-size:22px;background:rgba(0,0,0,.35);border:1px solid var(--line2);flex:none}
.foep h3{margin:0;font:700 20px/1 var(--display);color:var(--ink)}
.foep .tag{font:700 10px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.bar{height:14px;border-radius:7px;background:rgba(0,0,0,.5);border:1px solid rgba(255,255,255,.15);overflow:hidden;position:relative}
.bar i{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(180deg,#ff7a7e,var(--hp));transition:width .4s}
.bar i.ghost{background:rgba(255,255,255,.5);transition:width .9s .25s}
.bar b{position:absolute;inset:0;display:grid;place-items:center;font:700 10px var(--mono);color:#fff;text-shadow:0 1px 0 #000;z-index:1}
.traits{display:flex;flex-wrap:wrap;gap:5px}
.traits span{font:500 12px var(--body);padding:3px 8px;border-radius:8px;background:rgba(255,106,92,.1);border:1px solid rgba(255,106,92,.35);color:#ffd0cb;display:inline-flex;gap:6px;align-items:center;cursor:help}
.traits span.n{background:rgba(255,255,255,.05);border-color:var(--line2);color:var(--ink);cursor:default}
.ereels{display:flex;gap:6px;justify-content:center;padding:8px;border-radius:12px;background:#0a0910;border:2px solid #7a2d2d;box-shadow:inset 0 4px 12px rgba(0,0,0,.8),0 0 0 3px #2a1212}
.ereels .rcol{flex:1;max-width:52px}
.elast{font:500 13px var(--mono);color:var(--muted);min-height:20px}
/* deck */
.deck{display:grid;grid-template-columns:270px 250px minmax(0,1fr);gap:14px;align-items:stretch;background:linear-gradient(180deg,var(--deck2),var(--deck));border:1px solid var(--line);border-radius:18px;padding:14px}
.pane{display:flex;flex-direction:column;gap:10px;min-width:0}
.hero{display:flex;gap:12px;align-items:center;padding:10px 12px;border-radius:14px;background:linear-gradient(135deg,rgba(217,164,65,.16),rgba(0,0,0,.25));border:1px solid var(--line)}
.hero.hurt{animation:hurt2 .4s}
@keyframes hurt2{20%{translate:-5px 0;box-shadow:0 0 0 2px var(--hp)}60%{translate:4px 0}}
.hero .ic{width:50px;height:50px;border-radius:14px;display:grid;place-items:center;font-size:26px;color:#fff;background:radial-gradient(circle at 40% 30%,var(--sky1,#3a3a4a),var(--sky2,#151520));border:1px solid rgba(255,255,255,.2);flex:none}
.hero .bd{flex:1;min-width:0;display:flex;flex-direction:column;gap:5px}
.hero .nm{font:700 18px/1 var(--display);color:var(--brass2)}
.hero .row{display:flex;gap:14px;font:700 13px var(--mono);color:var(--ink)}
.hero .row span{display:inline-flex;gap:5px;align-items:center}
.inv{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.slotc{aspect-ratio:1;border-radius:10px;background:var(--slot);border:1px dashed rgba(255,255,255,.1);display:grid;place-items:center;position:relative}
.slotc.over{border-color:var(--arc);box-shadow:0 0 0 2px var(--arc)}
.rn{width:100%;height:100%;border-radius:inherit;border:0;cursor:grab;display:grid;place-items:center;font:400 22px/1 var(--rune);color:#fff;background:radial-gradient(circle at 50% 35%,color-mix(in srgb,var(--rc) 70%,#fff 10%),color-mix(in srgb,var(--rc) 55%,#000));box-shadow:inset 0 0 0 2px color-mix(in srgb,var(--rc) 60%,#fff 20%),0 3px 0 rgba(0,0,0,.4);text-shadow:0 0 10px rgba(255,255,255,.6);position:relative;padding:0}
.rn.u::after{content:"";position:absolute;right:4px;top:4px;width:7px;height:7px;border-radius:50%;background:var(--brass2);box-shadow:0 0 6px var(--brass2)}
.ring{position:relative;width:236px;height:236px;margin:0 auto}
.ring svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.ring .chan{stroke:rgba(255,255,255,.07);stroke-width:2;fill:none}
.ring .syn{stroke-width:4;fill:none;stroke-linecap:round;stroke-linejoin:round;filter:drop-shadow(0 0 6px var(--sc));stroke-dasharray:8 6;animation:flow 1s linear infinite}
@keyframes flow{to{stroke-dashoffset:-14}}

     enemy:null,eBlock:0,eRage:0,first:true,fightHurt:0,gid:SHELL?rid():null,stake:0,events:{},path:null,timeEnd:0,wm:{},lastMult:1,lastGrid:null,logs:[],selectedRune:null,awaitingLoot:false,auto:false,pendingLoot:null};
  H.start.forEach(r=>{const i=G.sock.findIndex((x,i)=>!x&&canPlace(r,'sock',i));if(i>=0)G.sock[i]=r;else giveRune(r);});
  for(const k of ['jera','raido',...(['knight','rogue','mage'].includes(hk)?{knight:['kenaz','perthro'],rogue:['othala','dagaz'],mage:['ansuz','laguz']}[hk]:['kenaz','laguz'])])giveRune(k);

function pick(a){return a[R(a.length)];}
function campPath(th){const P=POOLS[th];const t1=P.t1.slice(),t2=P.t2.slice();const o=[];for(let i=0;i<3;i++)o.push(t1.splice(R(t1.length),1)[0]);o.push(pick(P.mini));for(let i=0;i<3;i++)o.push(t2.splice(R(t2.length),1)[0]);o.push(pick(P.boss));return o;}
function weeklyPath(){const o=[];for(let i=0;i<12;i++){const th=THEMES[Math.floor(i/4)%3];const P=POOLS[th];o.push(i===5?pick(P.mini):i===11?pick(P.boss):pick(i<4?P.t1:P.t2));}return o;}

  G.enemy={id,...E,tr:tr2,hp:Math.round(E.hp*sc),max:Math.round(E.hp*sc),atk:Math.round(E.atk*(1+(sc-1)*.6)),ar:E.ar||0,enr:0};
  G.lastEnemyGrid=null;G.eBlock=tr2.includes('wall')?10:0;G.first=true;G.fightHurt=0;G.eRage=0;G.th=themeAt(G.depth);

const has=b=>G.buffs.some(x=>x.id===b);

function counts(){const c={};G.sock.forEach((r,i)=>{if(r&&runePosition(r,i))c[r]=(c[r]||0)+1;});return c;}
function activeSyn(){const c=counts();const distinct=Object.keys(c).length;
  return SYN.filter(s=>Object.entries(s.need).every(([r,n])=>r==='_distinct'?distinct>=n:G.sock.filter((x,i)=>x===r&&runePosition(x,i)&&(!s.at||!s.at[r]||s.at[r].includes(i+1))).length>=n));}
function synSockets(s){
  if(s.need._distinct){const seen=new Set();const out=[];G.sock.forEach((r,i)=>{if(r&&!seen.has(r)){seen.add(r);out.push(i);}});return out;}
  const out=[];for(const [r,n] of Object.entries(s.need)){let k=0;G.sock.forEach((x,i)=>{if(x===r&&k<n&&runePosition(x,i)&&(!s.at||!s.at[r]||s.at[r].includes(i+1))){out.push(i);k++;}});}return out;}
function cfgNow(){
  const c=counts();const sy=new Set(activeSyn().map(x=>x.id));const p={rows:0,cols:0,sw:0,sh:0,he:0,bo:0,coinBonus:0,lineAdd:0,crit:0,freeze:0,firstMul:1,winHeal:0,oscillate:0};const recipes=[];const w={...BASEW};
  G.sock.forEach((k,i)=>{const pos=runePosition(k,i);if(!pos)return;const f=c[k]>=3?2:1;
    for(const [key,v] of Object.entries(pos.effect)){if(key==='fx'){recipes.push({...v});}
      else if(key==='weights'){for(const [sym,n] of Object.entries(v))w[sym]+=n*f;}
      else if(key==='firstMul'||key==='freeze')p[key]=Math.max(p[key],v);
      else p[key]+=v*(key==='rows'||key==='cols'?1:f);}});
  let rows=1+p.rows+(p.oscillate&&G.rolls%2===0?1:0)+(sy.has('vast')?1:0)+(has('haste')?1:0)-(has('fog')?1:0);
  let cols=3+p.cols+(p.oscillate&&G.rolls%2===1?1:0)+(has('blessing')?1:0)+(G.wm.wide?1:0)-(has('rust')?1:0)-(has('frostbite')?1:0);
  rows=clamp(rows,1,5);cols=clamp(cols,3,5);
  w.skull=Math.max(2,w.skull);
  if(has('curse'))w.skull+=12;if(has('lucky'))w.star+=4;if(has('greed'))w.coin+=8;if(sy.has('eclipse'))w.skull=0;
  for(const synergy of activeSyn())for(const f of synergy.effects||[])recipes.push(f);
  const marks=RuneFX.grid(rows,cols,recipes,G.rolls);
  const H=G.H;const hb=sy.has('harmony')?1:0;
  return {rows,cols,w,sy,c,marks,combatScale:Math.min(1,Math.sqrt(6/(rows*cols))),
    sw:H.sw+p.sw+(has('sharp')?2:0)+hb,sh:H.sh+p.sh+hb,he:H.he+p.he+hb,bo:H.bo+p.bo+hb,coin:has('greed')?0:Math.round((5+hb)*(1+p.coinBonus)*(G.wm.rich?2:1)),
    lineAdd:p.lineAdd+(has('focus')?1:0),crit:(H.crit||0)+p.crit+(sy.has('storm')?.2:0),freeze:sy.has('blizzard')?.45:p.freeze,firstMul:p.firstMul,winHeal:p.winHeal};
}
function pickSym(w,rf=rnd){let t=0;for(const k in w)t+=w[k];let r=rf()*t;for(const k in w){r-=w[k];if(r<0)return k;}return Object.keys(w)[0];}

function drawReels(box,set,grid,rows,cols,ch){
  const w=set===SYM?cfgNow().w:G.enemy.w;const edge=Math.round(ch*.65),offset=edge-ch;const h=rows*ch+(rows+1)*6+edge*2;let html='';
  const locked=()=>`<div class="rcol locked" aria-hidden="true"><div class="rwin" style="height:${h}px;--edge:${edge}px"><div class="strip" style="transform:translateY(${offset}px)">${Array.from({length:rows+2},(_,i)=>`<div class="cell ${i===0?'neighbor top':i===rows+1?'neighbor bottom':''}" style="height:${ch}px"></div>`).join('')}</div></div></div>`;

async function spinReels(box,set,w,grid,rows,cols,ch,opt={}){
  if(!(box._rows===rows&&box._cols===cols&&box._ch===ch))drawReels(box,set,null,rows,cols,ch);
  const columns=[...box.querySelectorAll('.rcol[data-c]')];const base=opt.fast?260:420,step=opt.fast?90:150,fill=opt.fast?5:9;
  await Promise.all(columns.map((col,c)=>new Promise(resolve=>{
    const strip=col.querySelector('.strip');const start=strip.children.length,n=fill+c*2;let html=strip.innerHTML;
    for(let i=0;i<n;i++)html+=cellHTML(set,pickSym(w,Math.random),ch);
    const final=finalStrip(set,grid.map(row=>row[c]),ch,w,c);html+=final;strip.innerHTML=html;strip.style.transition='none';strip.style.transform=`translateY(${box._offset}px)`;void strip.offsetHeight;
    const dist=(start+n)*(ch+6),dur=(base+c*step)*SPEED;strip.classList.add('go');strip.style.transition=`transform ${dur}ms cubic-bezier(.15,.62,.28,1.03)`;strip.style.transform=`translateY(${box._offset-dist}px)`;

function lightning(){const p=foeXY();const pts=[[p.x+(Math.random()*80-40),0]];let y=0;while(y<p.y){y+=18+Math.random()*24;pts.push([p.x+(Math.random()*50-25)*(1-y/p.y),Math.min(y,p.y)]);}FX.bolts.push({pts,l:12,m:12});const s=$('#scene');s.style.filter='brightness(1.6)';setTimeout(()=>s.style.filter='',90);}
function ambientSpawn(){if(!G||!FX.w)return;const P=power();const th=G.th;const cap=18+P*7;
  let n=0;for(const p of FX.ps)if(p.amb)n++;
  while(n<cap&&FX.ps.length<420){n++;

    else if(th==='desert')FX.ps.push({amb:1,x:-10,y:FX.h*(.3+Math.random()*.65),vx:1.5+Math.random()*2.5,vy:Math.random()*.4-.2,l:400,m:400,c:'rgba(255,220,160,.55)',s:1+Math.random()*1.5,g:0,streak:1});
    else FX.ps.push({amb:1,x:Math.random()*FX.w,y:FX.h*(.3+Math.random()*.6),vx:Math.random()*.4-.2,vy:-.1-Math.random()*.3,l:300,m:300,c:'rgba(210,255,140,.9)',s:1.5+Math.random()*1.5,g:0,glow:1,flick:Math.random()*6});}
  const syn=activeSyn();if(syn.length&&Math.random()<.05*syn.length){const s=syn[R2(syn.length)];const ids=synSockets(s);const r=RUNES[G.sock[ids[0]]];if(r){const p=foeXY();FX.ps.push({x:p.x+(Math.random()*2-1)*p.r*2,y:p.y+p.r,vx:0,vy:-.6,l:120,m:120,c:r.c,s:16,g:0,glyph:r.g});}}
  const deb=G.buffs.filter(b=>!BUFFS[b.id].b).length;if(deb&&Math.random()<.25*deb)FX.ps.push({x:Math.random()*FX.w,y:FX.h+10,vx:Math.random()*.6-.3,vy:-.6-Math.random()*.6,l:160,m:160,c:'rgba(120,40,160,.35)',s:10+Math.random()*16,g:0});
  const bf=G.buffs.filter(b=>BUFFS[b.id].b).length;if(bf&&Math.random()<.18*bf)FX.ps.push({x:Math.random()*FX.w,y:FX.h-6,vx:0,vy:-1-Math.random(),l:90,m:90,c:'rgba(243,207,122,.9)',s:1.5+Math.random()*2,g:0,glow:1});
}
function fxLoop(){
  const c=FX.cx;if(c&&!$('#sPlay').hidden){FX.t++;c.clearRect(0,0,FX.w,FX.h);ambientSpawn();
    for(let i=FX.ps.length-1;i>=0;i--){const p=FX.ps[i];p.x+=p.vx;p.y+=p.vy;p.vy+=p.g||0;p.l--;
      if(p.l<=0||p.x<-40||p.x>FX.w+40||p.y>FX.h+40||p.y<-40){FX.ps.splice(i,1);continue;}
      const a=Math.min(1,p.l/p.m*1.5);c.globalAlpha=p.flick!=null?a*(.5+.5*Math.sin(FX.t*.08+p.flick)):a;
      if(p.glyph){c.font=`${p.s}px "Noto Sans Runic","Segoe UI Historic",serif`;c.fillStyle=p.c;c.shadowColor=p.c;c.shadowBlur=12;c.fillText(p.glyph,p.x,p.y);c.shadowBlur=0;continue;}
      if(p.streak){c.strokeStyle=p.c;c.lineWidth=p.s;c.beginPath();c.moveTo(p.x,p.y);c.lineTo(p.x-p.vx*6,p.y-p.vy*6);c.stroke();continue;}
      c.fillStyle=p.c;if(p.glow){c.shadowColor=p.c;c.shadowBlur=8;}c.beginPath();c.arc(p.x,p.y,p.s,0,6.283);c.fill();c.shadowBlur=0;}
    for(let i=FX.slashes.length-1;i>=0;i--){const s=FX.slashes[i];s.l--;if(s.l<=0){FX.slashes.splice(i,1);continue;}const k=1-s.l/s.m;c.globalAlpha=s.l/s.m;c.strokeStyle='#fff';c.shadowColor='#fff';c.shadowBlur=14;c.lineWidth=s.w*(1-k*.6);c.lineCap='round';
      const dx=Math.cos(s.a)*s.len/2,dy=Math.sin(s.a)*s.len/2;c.beginPath();c.moveTo(s.x-dx,s.y-dy);c.lineTo(s.x-dx+dx*2*Math.min(1,k*3),s.y-dy+dy*2*Math.min(1,k*3));c.stroke();c.shadowBlur=0;}
    for(let i=FX.bolts.length-1;i>=0;i--){const b=FX.bolts[i];b.l--;if(b.l<=0){FX.bolts.splice(i,1);continue;}c.globalAlpha=b.l/b.m;c.strokeStyle='#bffff3';c.shadowColor='#5ee6c8';c.shadowBlur=18;c.lineWidth=3;c.beginPath();b.pts.forEach((p,j)=>j?c.lineTo(p[0],p[1]):c.moveTo(p[0],p[1]));c.stroke();c.shadowBlur=0;}
    c.globalAlpha=1;}
  requestAnimationFrame(fxLoop);
}

function bump(el){el.classList.remove('bump');void el.offsetWidth;el.classList.add('bump');}
function fmt(n){return n>=100||Number.isInteger(n)?String(Math.round(n)):(Math.round(n*10)/10).toFixed(1).replace('.',L()?'.':',');}
function setT(id,v){const el=$('#'+id);el.textContent=fmt(v);bump(el);}
function tag(text,cls){const s=document.createElement('span');s.textContent=text;if(cls)s.className=cls;$('#tMods').appendChild(s);}
function cellPop(cell,text,cls){if(!cell)return;cell.classList.remove('sc');void cell.offsetWidth;cell.classList.add('sc');const p=document.createElement('span');p.className='cpop '+(cls||'');p.textContent=text;cell.appendChild(p);setTimeout(()=>p.remove(),820);}
function popAt(x,y,text,cls){const p=document.createElement('div');p.className='pop '+cls;p.textContent=text;p.style.left=(x-20+R2(24)-12)+'px';p.style.top=(y-20)+'px';$('#scene').appendChild(p);setTimeout(()=>p.remove(),1100);}
function scoreGrid(grid,C,firstMul){
  const clumsy=has('clumsy'),LM=[0,0,0,2,3,5];
  const out={cells:[],lines:[],phys:0,mag:0,block:0,heal:0,gold:0,spins:0,skulls:0,five:false,holy:0,effects:new Set()};
  grid.forEach((row,r)=>{
    const s0=row.find(s=>s!=='star')||'sword';let len=0;for(const s of row){if(s===s0||(s==='star'&&!clumsy))len++;else break;}
    const m=len>=3?(LM[len]+C.lineAdd)*firstMul:1;if(len>=3){out.lines.push({r,len,s:s0,m});if(len===5)out.five=true;}
    row.forEach((s,c)=>{const inL=len>=3&&c<len,sym=s==='star'&&inL?s0:s,mm=inL?m:1;
      const cell={phys:0,mag:0,block:0,heal:0,gold:0,spins:0,skulls:0,holy:0};
      if(sym==='sword')cell.phys=C.sw*mm*(inL&&C.sy.has('berserk')?1.5:1);
      else if(sym==='bolt')cell.mag=C.bo*mm;
      else if(sym==='star')cell.phys=(C.sy.has('starfall')?4:1)*mm;
      else if(sym==='shield'){cell.block=C.sh*mm;if(C.sy.has('holy'))cell.holy=mm;}
      else if(sym==='heart')cell.heal=C.he*mm;
      else if(sym==='coin'){cell.gold=C.coin*mm;if(C.sy.has('midas'))cell.phys=2*mm;}
      else if(sym==='clover')cell.spins=mm;
      else if(sym==='skull')cell.skulls=mm;
      const effects=C.marks?.[r]?.[c]||[];effects.forEach(f=>out.effects.add(f.type));
      const result=RuneFX.apply(cell,sym,effects,mm,C.combatScale??1);
      for(const key of ['phys','mag','block','heal','gold','spins','skulls','holy'])out[key]+=result[key]||0;
      for(const kind of ['phys','mag'])if(result[kind]>0)out.cells.push({r,c,raw:result[kind]/mm,eff:result[kind],kind,inL});
    });
  });
  if(C.sy.has('fortune'))out.spins+=out.lines.filter(l=>l.s==='coin').length*2;
  return out;
}
async function tally(o,C){
  const box=$('#reels');$('#tMods').innerHTML='';$('#tSide').innerHTML='';
  let base=0;const cells=o.cells;$('#tally').classList.add('on');setT('tBase',0);setT('tMult',1);$('#tTot').textContent='0';$('#tTot').classList.remove('fire');
  const dl=Math.max(28,Math.min(85,700/Math.max(1,cells.length)));
  for(const c of cells){base+=c.raw;cellPop(cellAt(box,c.r,c.c),'+'+fmt(c.raw),c.kind==='mag'?'c':'');setT('tBase',base);snd(500+Math.min(base,80)*6,.03,'triangle',.05);await sleep(dl);}
  let cur=cells.reduce((t,c)=>t+(c.inL?0:c.raw),0);
  for(const ln of o.lines){cur+=cells.filter(c=>c.r===ln.r&&c.inL).reduce((t,c)=>t+c.eff,0);
    for(let c=0;c<ln.len;c++){const el=cellAt(box,ln.r,c);if(el)el.classList.add('win');}
    const lc=cellAt(box,ln.r,ln.len-1);if(lc){const x=document.createElement('span');x.className='linex';x.textContent='×'+ln.m;lc.appendChild(x);}
    if(base)setT('tMult',cur/base);snd(660+ln.len*120,.12,'triangle',.09);await sleep(260);}
  let phys=o.phys,mag=o.mag;
  const crit=(G.first&&C.sy.has('backstab'))||rnd()<C.crit;
  const steps=[];
  if(C.sy.has('chain')&&mag)steps.push([tr(SYN.find(s=>s.id==='chain').n)+' ×1,5',()=>{mag*=1.5;},'b']);
  if(G.first&&C.firstMul>1)steps.push([tr(RUNES.sowilo.n)+' ×'+fmt(C.firstMul),()=>{phys*=C.firstMul;mag*=C.firstMul;}]);
  if(crit&&phys)steps.push([(L()?'CRIT':'КРИТ')+' ×2',()=>{phys*=2;},'',true]);
  if(has('might'))steps.push([tr(BUFFS.might.n)+' +25%',()=>{phys*=1.25;mag*=1.25;},'g']);
  if(has('weak'))steps.push([tr(BUFFS.weak.n)+' −25%',()=>{phys*=.75;mag*=.75;}]);
  if(G.wm.glass)steps.push(['+30%',()=>{phys*=1.3;mag*=1.3;},'g']);
  for(const [lab,fn,cls,isCrit] of steps){if(!base)break;fn();tag(lab,cls);logEvent('player',isCrit?'log_crit':'log_mod',{name:lab,value:fmt(phys+mag)});setT('tMult',(phys+mag)/base);if(isCrit){const s=$('#scene');s.classList.remove('shake');void s.offsetWidth;s.classList.add('shake');}snd(880,.08,'square',.06);await sleep(240);}
  const total=Math.round(phys+mag);G.lastMult=base?(phys+mag)/base:1;
  const tt=$('#tTot');tt.textContent=total;bump(tt);if(G.lastMult>=3||total>=30)tt.classList.add('fire');
  const side=[];const blk=Math.round(o.block),heal=Math.round(o.heal),gold=Math.round(o.gold),spins=Math.round(o.spins),sk=Math.round(o.skulls);
  if(blk)side.push(`<span style="color:#9cc3ff"><i class="fa-solid fa-shield-halved"></i>${blk}</span>`);if(heal)side.push(`<span style="color:var(--buff)"><i class="fa-solid fa-heart"></i>${heal}</span>`);
  if(gold)side.push(`<span style="color:var(--brass2)"><i class="fa-solid fa-coins"></i>${gold}</span>`);if(spins)side.push(`<span style="color:#9be38a"><i class="fa-solid fa-clover"></i>+${spins}</span>`);if(sk)side.push(`<span style="color:#c9c0d6"><i class="fa-solid fa-skull"></i>${sk}</span>`);
  $('#tSide').innerHTML=side.join('');
  await sleep(total?380:160);
  return {phys:Math.round(phys),mag:Math.round(mag),crit};
}

async function roll(){
  if(!G||G.rolling||G.over||G.awaitingLoot||!$('#mLogs').hidden||!$('#mInfo').hidden)return;if(G.spins<=0){endRun('spins');return;}
  if(G.timeEnd&&performance.now()>G.timeEnd){endRun('time');return;}
  G.rolling=true;G.selectedRune=null;G.spins--;G.rolls++;renderDeck();hideTip();
  const C=cfgNow();
  if(C.rows===5&&C.cols===5&&!G.events.full){G.events.full=1;ev('runes.full');}
  if(C.sy.size>=3&&!G.events.combo3){G.events.combo3=1;ev('runes.combo3');}
  const grid=RuneFX.prepare(Array.from({length:C.rows},()=>Array.from({length:C.cols},()=>pickSym(C.w))),C.marks);
  const box=$('#reels');snd(200,.35,'sawtooth',.03);

  if(dealt&&G.eBlock){const b=Math.min(G.eBlock,dealt);G.eBlock-=b;dealt-=b;popAt(fp.x+40,fp.y-40,'🛡 −'+b,'blk');logEvent('enemy','log_enemy_block',{n:b});}
  if(dealt>0){const big=dealt>=Math.max(20,E.max*.3);

    burst(fp.x,fp.y,res.mag>res.phys?'#5ee6c8':'#ffe9b0',Math.min(80,12+dealt*1.5),4,40,2.5,.08);
    E.hp=Math.max(0,E.hp-dealt);hurtFoe();popAt(fp.x,fp.y-fp.r,'−'+dealt,res.crit?'crit':big?'big':'dmg');snd(140,.1,'square',.09);
    if(phys&&hasT('thorns')){G.hp-=2;popHero('−2','hit');logEvent('enemy','log_dot',{name:tr(TRAITS.thorns.n),n:2});}}
  logEvent('player','log_damage',{p:res.phys,m:res.mag,d:dealt,hp:E.hp});

  renderAll();renderDeck();
  if(G.hp<=0){G.hp=0;renderAll();endRun('fall');return;}
  if(E.hp<=0){await sleep(250);await winFight();if(!G.over){G.rolling=false;renderDeck();autoNext();}return;}

  const dot=(has('poison')?2:0)+(has('frostbite')?2:0);if(dot){G.hp-=dot;popHero('☠ −'+dot,'hit');logEvent('enemy','log_dot',{name:[has('poison')?tr(BUFFS.poison.n):'',has('frostbite')?tr(BUFFS.frostbite.n):''].filter(Boolean).join(' + '),n:dot});}

async function foeTurn(blk,C){

  const rows=clamp(E.reel[0]+(hasT('frenzy')&&E.hp<E.max/2?1:0),1,4),cols=E.reel[1];
  const eg=Array.from({length:rows},()=>Array.from({length:cols},()=>pickSym(E.w)));
  await spinReels(eb,ESYM,E.w,eg,rows,cols,reelGeom(eb,rows),{fast:true,silent:true});G.lastEnemyGrid=eg;snd(160,.06,'square',.05);logEvent('enemy','log_enemy_roll',{name:tr(E.n)},eg);
  if(frozen){$('#eLast').textContent=T('frozen',{n:tr(E.n)});logEvent('enemy','frozen',{n:tr(E.n)});popAt(fp.x,fp.y-fp.r,'❄','blk');burst(fp.x,fp.y,'#cfefff',30,3,40,2,.02);await sleep(300);enemyPassive();return;}

    row.forEach((s,c)=>{const inL=c<len&&len>=3;const cell=cellAt(eb,r,c);if(s==='fang'){fangs+=inL?m:1;if(cell)cell.classList.add(inL?'win':'sc');}else if(s==='guard')guard++;else if(s==='drop')drop++;else if(s==='crit')crit++;});});
  const atk=E.atk+E.enr+(hasT('frenzy')&&E.hp<E.max/2?2:0);

      logEvent('enemy','log_hit',{d:dmg,b:Math.min(blk,dmg),n:taken,hp:Math.max(0,G.hp)});
      if(C.sy.has('vow')&&blk>dmg){const h=Math.min(6,blk-dmg,G.max-G.hp);if(h>0){G.hp+=h;popHero('+'+h,'heal');logEvent('player','log_heal',{n:h,hp:G.hp,max:G.max});}}}

function validSwap(fa,fi,ta,ti){if(!['inv','sock'].includes(fa)||!['inv','sock'].includes(ta)||!Number.isInteger(fi)||!Number.isInteger(ti))return false;
  const A=fa==='inv'?G.inv:G.sock,B=ta==='inv'?G.inv:G.sock;if(fi<0||fi>=A.length||ti<0||ti>=B.length||!A[fi])return false;
  return canPlace(A[fi],ta,ti)&&canPlace(B[ti],fa,fi);}
function swap(fa,fi,ta,ti){if(G.rolling||G.over)return;if(fa===ta&&fi===ti){G.selectedRune=null;renderDeck();return;}if(!validSwap(fa,fi,ta,ti)){toast(T('position_invalid'));return;}
  const A=fa==='inv'?G.inv:G.sock,B=ta==='inv'?G.inv:G.sock,k=A[fi],other=B[ti];
  if(fa==='sock')logEvent('system','log_remove',{name:tr(RUNES[k].n),p:POS[fi]});if(ta==='sock'&&other)logEvent('system','log_remove',{name:tr(RUNES[other].n),p:POS[ti]});
  A[fi]=other;B[ti]=k;G.selectedRune=null;
  if(ta==='sock')logEvent('system','log_equip',{name:tr(RUNES[k].n),p:POS[ti]});if(fa==='sock'&&other)logEvent('system','log_equip',{name:tr(RUNES[other].n),p:POS[fi]});
  snd(700,.03);hideTip();renderDeck();renderFoe();}
function moveRune(a,i){if(G.rolling||G.over)return;hideTip();const selected=G.selectedRune;
  if(selected){swap(selected.a,selected.i,a,i);return;}G.selectedRune={a,i};renderDeck();document.querySelector(`[data-a="${a}"][data-i="${i}"] .rn`)?.focus();}
function tipHTML(k){const [t,id,slot]=k.split(':');
  if(t==='rune'){const R3=RUNES[id];return `<b><span style="font-family:var(--rune);color:${R3.c}">${R3.g}</span> ${esc(tr(R3.n))}</b>${positionDescription(id,+slot)}${SYN.filter(s=>s.at&&s.need[id]).map(s=>`<div style="margin-top:6px;color:var(--arc)">${esc(tr(s.n))}: ${esc(synPositionText(s))}</div>`).join('')}`;}
  if(t==='buff'){const B=BUFFS[id];return `<b style="color:${B.b?'var(--buff)':'var(--debuff)'}"><i class="fa-solid ${B.i}"></i> ${esc(tr(B.n))}</b>${esc(tr(B.d))}`;}
  if(t==='syn'){const s=SYN.find(x=>x.id===id);return `<b style="color:var(--arc)"><i class="fa-solid ${s.i}"></i> ${esc(tr(s.n))}</b>${esc(tr(s.d))}${s.at?`<div class="tipPositions">${esc(synPositionText(s))}</div>`:''}`;}
  if(t==='reso')return `<b style="color:var(--arc)">${esc(T('reso'))}</b>${esc(T('reso_d'))}`;
  if(t==='trait'){const X=TRAITS[id];const v=G&&G.enemy?G.enemy.ar:0;return `<b style="color:var(--debuff)"><i class="fa-solid ${X.i}"></i> ${esc(tr(X.n).replace('{v}',v))}</b>${esc(tr(X.d).replace('{v}',v))}`;}
  return '';}
function bindTips(root){root.querySelectorAll('[data-tip]').forEach(el=>{el.onmouseenter=el.onfocus=()=>{const t=$('#tip');t.innerHTML=tipHTML(el.dataset.tip);t.hidden=false;const r=el.getBoundingClientRect();
  const tw=t.offsetWidth,th=t.offsetHeight;let x=r.left+r.width/2-tw/2,y=r.top-th-10;if(y<8)y=r.bottom+10;x=clamp(x,8,innerWidth-tw-8);t.style.left=x+'px';t.style.top=y+'px';};el.onmouseleave=el.onblur=hideTip;});}
function hideTip(){$('#tip').hidden=true;}

/* ================= menu ================= */
function weekly(){const wk=weekNo();const seed=wk*7919;const wr=mulberry(seed);const hk=HK[Math.floor(wr()*3)];const pool=WMODS.slice();const mods=[];for(let i=0;i<2;i++)mods.push(pool.splice(Math.floor(wr()*pool.length),1)[0]);return {wk,seed,hk,mods};}
const menuCarousels={};
function refreshCarousels(){
  if(!window.OrionCarousel)return;
  for(const id of ['campCarousel','modeCarousel']){
    if(!menuCarousels[id])menuCarousels[id]=new OrionCarousel($('#'+id));
    else menuCarousels[id].refresh();
    $('#'+id).setAttribute('aria-label',T(id==='campCarousel'?'camps':'modes'));
    $('#'+id+' [data-carousel-prev]').setAttribute('aria-label',cfg.lang==='ru'?'Предыдущая карточка':'Previous card');
    $('#'+id+' [data-carousel-next]').setAttribute('aria-label',cfg.lang==='ru'?'Следующая карточка':'Next card');
  }
}
function renderMenu(){
  buildSeg($('#heroSeg'),HK.map(k=>[k,tr(HEROES[k].n),HEROES[k].i]),heroSel,v=>{heroSel=v;renderMenu();});
  const W=weekly();const claimed=store.wclaim&&store.wclaim[W.wk];
  const md=[{id:'time',cls:'',i:'fa-stopwatch',best:(store.time||{}).best,u:T('kills')},{id:'endless',cls:'e',i:'fa-infinity',best:(store.endless||{}).best,u:T('kills')},{id:'weekly',cls:'w',i:'fa-calendar-week',best:(store.weekly||{}).best,u:T('kills')}];
  $('#modes').innerHTML=md.map(m=>`<div class="mcard"><div class="pic modepic ${m.cls}"><img class="runeCardArt" src="assets/mode-${m.id}.webp" alt="" decoding="async" draggable="false"></div><div class="body"><h2>${esc(T('m_'+m.id))}</h2><p>${esc(T('m_'+m.id+'_d'))}</p>
    ${m.id==='weekly'?`<div class="meta"><span><i class="fa-solid fa-calendar"></i>${esc(T('week',{n:W.wk%100}))}</span><span><i class="fa-solid ${HEROES[W.hk].i}"></i>${esc(tr(HEROES[W.hk].n))}</span><span style="color:${claimed?'var(--muted)':'var(--brass2)'}"><i class="fa-solid fa-coins"></i>${esc(claimed?T('claimed'):T('reward',{n:540}))}</span></div><div class="mods">${W.mods.map(x=>`<span>${esc(tr(x.n))}</span>`).join('')}</div>`:''}
    <div class="meta"><span><i class="fa-solid fa-trophy" style="color:var(--brass)"></i>${esc(T('best',{b:(m.best||0)+' '+m.u}))}</span></div>
    <button class="btn sm go" type="button" data-mode="${m.id}"><i class="fa-solid fa-play"></i>${esc(T('play'))}</button></div></div>`).join('');
  $('#modes').querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>start(b.dataset.mode,b.dataset.mode==='weekly'?W.hk:heroSel,W));
  $('#advs').innerHTML=HK.map(k=>{const H=HEROES[k];const rec=store[k]||{};return `<div class="mcard"><div class="pic th th-${H.th}"><img class="runeCardArt" src="assets/campaign-${k}.webp" alt="" decoding="async" draggable="false"></div><div class="body"><h2>${esc(tr(H.camp))}</h2><p>${esc(tr(H.cd))}</p>
    <div class="meta"><span class="stars">${esc(T('diff'))} ${'<i class="fa-solid fa-star"></i>'.repeat(H.stars)}${'<i class="fa-solid fa-star o"></i>'.repeat(3-H.stars)}</span><span><i class="fa-solid fa-heart" style="color:var(--hp)"></i>${H.hp}</span><span><i class="fa-solid fa-rotate"></i>${H.spins}</span></div>
    <div class="meta"><span>${rec.cleared?`<i class="fa-solid fa-flag-checkered" style="color:var(--buff)"></i>${esc(T('cleared',{n:rec.cleared}))}`:esc(rec.best?T('best',{b:rec.best+'/8'}):T('best_none'))}</span><span style="font-family:var(--rune);color:var(--arc)">${H.start.map(r=>RUNES[r].g).join(' ')} · ${RUNES[H.uRune].g}</span></div>
    <button class="btn sm go" type="button" data-camp="${k}"><i class="fa-solid fa-play"></i>${esc(T('play'))}</button></div></div>`;}).join('');
  $('#advs').querySelectorAll('[data-camp]').forEach(b=>b.onclick=()=>start('camp',b.dataset.camp));
  $('#stakeL').hidden=!SHELL;$('#stakeSeg').hidden=!SHELL;
  buildSeg($('#stakeSeg'),[[0,T('free')],[50,'50'],[100,'100'],[250,'250'],[500,'500']],stake,v=>{stake=+v;renderMenu();});
  renderStakeNote();refreshCarousels();
}
function renderStakeNote(){const n=$('#stakeNote');if(!SHELL){n.textContent='';return;}const low=stake>0&&Shell.chips!=null&&Shell.chips<stake;n.textContent=low?T('stake_low'):T('stake_note');n.style.color=low?'var(--debuff)':'';
  document.querySelectorAll('#advs [data-camp]').forEach(b=>b.disabled=low);}
async function start(mode,hk,W){
  clearTimeout(autoTimer);if(G)G.auto=false;renderAuto();$('#mLogs').hidden=true;$('#mLoot').hidden=true;
  if(mode==='camp'&&SHELL&&stake>0){const ok=await askStake(stake);if(!ok){toast(T('stake_low'));return;}}
  rnd=mode==='weekly'?mulberry(W.seed):Math.random;
  newRun(mode,hk);if(mode==='camp')G.stake=SHELL?stake:0;
  if(mode==='weekly')for(const m of W.mods)m.ap(G);
  spawn();
  if(SHELL)shellPost('start',{gid:G.gid,players:[Shell.me]});
  show('sPlay');buildScene();$('#reels')._ch=0;renderDeck();renderAll();drawEReels();$('#topTitle').textContent=mode==='camp'?tr(G.H.camp):T('m_'+mode);
  const f=$('#foe');f.classList.remove('dead','spawn');void f.offsetWidth;f.classList.add('spawn');
  if(!FX.cv)fxInit();
}
$('#bCampaigns').onclick=()=>{show('sCampaigns');renderStakeNote();};
$('#bModes').onclick=()=>show('sModes');
document.querySelectorAll('[data-menu-back]').forEach(b=>b.onclick=()=>show('sMenu'));
$('#bRoll').onclick=()=>roll();
$('#auto').onclick=()=>{if(G&&!G.over)setAuto(!G.auto);};
addEventListener('keydown',e=>{const modal=!$('#mLogs').hidden?$('#mLogs'):!$('#mInfo').hidden?$('#mInfo'):null;
  if(modal){if(e.key==='Escape'){e.preventDefault();if(modal.id==='mLogs')closeLogs();else if(modal.id==='mInfo')closeInfo();return;}
    if(e.key==='Tab'){const focus=[...modal.querySelectorAll('button:not(:disabled),input,[tabindex="0"]')];if(focus.length){const first=focus[0],last=focus[focus.length-1];if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus();}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus();}}}return;}
  if(e.key==='Escape'&&(!$('#sCampaigns').hidden||!$('#sModes').hidden)){show('sMenu');return;}
  if(e.key==='Escape'&&G&&G.selectedRune){G.selectedRune=null;renderDeck();return;}
  if(e.code==='Space'&&!$('#sPlay').hidden&&!e.repeat&&!['INPUT','BUTTON','SELECT','TEXTAREA'].includes(e.target.tagName)&&!e.target.isContentEditable){e.preventDefault();roll();}});
$('#bAgain').onclick=()=>{show('sMenu');renderMenu();};
$('#bMenu').onclick=()=>{show('sMenu');renderMenu();};

/* ================= info ================= */
function openInfo(){
  const leg=(set,keys,pre)=>`<div class="leg">${keys.map(k=>`<span><i class="fa-solid ${set[k].i}" style="color:${set[k].c}"></i>${esc(T(pre+k))}</span>`).join('')}</div>`;
  $('#infoBox').innerHTML=`<div style="display:flex;justify-content:space-between;align-items:center"><h2>${esc(T('title'))}</h2><button class="ib" type="button" id="infoX" aria-label="Close"><i class="fa-solid fa-xmark"></i></button></div>
    <h3>${esc(T('h_how'))}</h3><p>${esc(T('info_how'))}</p>
    <h3>${esc(T('h_sym'))}</h3>${leg(SYM,SYMK,'sym_')}
    <h3>${esc(T('h_lines'))}</h3><p>${esc(T('info_lines'))}</p>
    <h3>${esc(T('h_esym'))}</h3>${leg(ESYM,ESYMK,'es_')}
    <h3>${esc(T('h_syn'))}</h3><p>${esc(T('info_runes'))}</p>
    <div class="synl">${SYN.map(s=>`<div><b><i class="fa-solid ${s.i}"></i> ${esc(tr(s.n))}</b> <span class="g">${s.need._distinct?'5 ≠':Object.entries(s.need).map(([r,n])=>RUNES[r].g.repeat(n)).join(' + ')}</span><br>${esc(tr(s.d))}${s.at?`<br><span style="color:var(--brass2)">${esc(synPositionText(s))}</span>`:''}</div>`).join('')}</div>
    <h3>${esc(L()?'Cell effects':'Эффекты ячеек')}</h3><div class="synl">${Object.values(RuneFX.types).map(f=>`<div><b style="color:${f.c}"><i class="fa-solid ${f.i}"></i> ${esc(tr(f.n))}</b><br>${esc(tr(f.d))}</div>`).join('')}</div>
    <h3>${esc(T('h_spins'))}</h3><p>${esc(T('info_spins'))}</p>
    <h3>${esc(T('h_modes'))}</h3><p>${esc(T('info_modes'))}</p>`;
  $('#mInfo').hidden=false;$('#infoX').onclick=closeInfo;$('#infoX').focus();}
function closeInfo(){$('#mInfo').hidden=true;$('#bInfo').focus();autoNext();}
$('#bInfo').onclick=()=>{openInfo();};$('#mInfo').onclick=e=>{if(e.target.id==='mInfo')closeInfo();};

/* ================= seg + boot ================= */
function segThumb(seg){let t=seg.querySelector('.thumb');if(!t){t=document.createElement('i');t.className='thumb';seg.prepend(t);}const b=seg.querySelector('button[aria-pressed="true"]');if(!b||!b.offsetWidth){t.style.opacity=0;return;}t.style.opacity=1;t.style.left=b.offsetLeft+'px';t.style.width=b.offsetWidth+'px';}
function buildSeg(seg,opts,cur,fn){const sig=opts.map(o=>o.join()).join('|');if(seg._sig!==sig){seg._sig=sig;seg.querySelectorAll('button').forEach(b=>b.remove());for(const [v,lab,ic] of opts){const b=document.createElement('button');b.type='button';b.dataset.v=v;b.innerHTML=(ic?`<i class="fa-solid ${ic}"></i>`:'')+esc(lab);seg.appendChild(b);}}
  seg.querySelectorAll('button').forEach(b=>{b.setAttribute('aria-pressed',String(b.dataset.v)===String(cur));b.onclick=()=>fn(b.dataset.v);});requestAnimationFrame(()=>segThumb(seg));}
function show(id){for(const s of ['sMenu','sCampaigns','sModes','sPlay','sEnd'])$('#'+s).hidden=s!==id;if(id!=='sPlay')$('#topTitle').textContent='';requestAnimationFrame(()=>{document.querySelectorAll('.seg').forEach(segThumb);if(id==='sCampaigns'||id==='sModes')refreshCarousels();});}
function applyLang(){document.documentElement.lang=cfg.lang;document.title=T('title');document.querySelectorAll('[data-t]').forEach(el=>el.textContent=T(el.dataset.t));$('#title').textContent=T('title');
  buildSeg($('#langSeg'),[['ru','RU'],['en','EN']],cfg.lang,v=>{cfg.lang=v;saveCfg();applyLang();shellPost('lang',{lang:v});});
  $('#stakeSeg')._sig='';$('#heroSeg')._sig='';renderMenu();if(G&&!$('#sPlay').hidden){renderAll();renderDeck();$('#topTitle').textContent=G.mode==='camp'?tr(G.H.camp):T('m_'+G.mode);}if(!$('#mInfo').hidden)openInfo();}
addEventListener('resize',()=>{document.querySelectorAll('.seg').forEach(segThumb);if(G&&!$('#sPlay').hidden&&!G.rolling){$('#reels')._ch=0;renderDeck();drawEReels();}});
if(!window.claude)$('#hubLink').hidden=false;
if(SHELL)$('#hubLink').addEventListener('click',e=>{e.preventDefault();if(G&&!G.over&&G.gid)shellPost('abort',{gid:G.gid});shellPost('exit');});
applyLang();show('sMenu');shellPost('ready');
window.__runes={get G(){return G},roll,setSpeed:v=>SPEED=v,cfgNow,scoreGrid,start,activeSyn,weekly,setAuto};
})();
</script>
