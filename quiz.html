<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Викторина</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;700;900&family=Rubik+Mono+One&display=swap">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
<style>
/* Layout: a TV game-show stage — question card centre stage under a spotlight, scoreboard rail on the right,
   between-round events take over the stage as a full overlay. */
:root{
  --bg:#120d2b;
  --bg2:#1b1440;
  --panel:#221a50;
  --panel2:#2b2262;
  --line:rgba(255,255,255,.12);
  --ink:#f6f1ff;
  --muted:#a9a0cf;
  --gold:#ffd23f;
  --pink:#ff4f8b;
  --teal:#3ee0c5;
  --ok:#2fd17a;
  --bad:#ff5a5f;
  --a0:#ff5a5f;
  --a1:#3d8bff;
  --a2:#ffb627;
  --a3:#2fd17a;
  --tA:#ff7a45;
  --tB:#4fc3ff;
  --display:"Rubik Mono One","Rubik",system-ui,sans-serif;
  --body:"Rubik",system-ui,sans-serif;
  color-scheme:dark;
}
[hidden]{display:none!important}
*{box-sizing:border-box}
*{scrollbar-width:thin;scrollbar-color:rgba(255,255,255,.2) transparent}
::-webkit-scrollbar{width:8px;height:8px}::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:rgba(255,255,255,.18);border-radius:8px;border:2px solid transparent;background-clip:padding-box}
::-webkit-scrollbar-thumb:hover{background-color:rgba(255,210,63,.6)}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink)}
body{font:400 16px/1.45 var(--body);min-height:100vh;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  background:radial-gradient(ellipse 60% 50% at 50% -5%,rgba(255,210,63,.16),transparent 70%),radial-gradient(ellipse 40% 60% at 0% 100%,rgba(255,79,139,.14),transparent 70%),radial-gradient(ellipse 40% 60% at 100% 100%,rgba(62,224,197,.12),transparent 70%),var(--bg);background-attachment:fixed}
button{font:inherit;color:inherit}
a{color:inherit}
.wrap{max-width:1180px;margin:0 auto;padding-block:18px 48px;display:flex;flex-direction:column;gap:20px}
.top{display:flex;align-items:center;gap:12px}
.back{display:inline-flex;align-items:center;gap:8px;text-decoration:none;color:var(--muted);font-weight:500;background:none;border:0;cursor:pointer;padding:0}
.back:hover{color:var(--gold)}
.top .sp{flex:1}
.seg{position:relative;display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:rgba(0,0,0,.2)}
.seg button{position:relative;z-index:1;background:transparent;border:0;padding:8px 14px;font:700 13px var(--body);cursor:pointer;color:var(--muted);display:inline-flex;align-items:center;gap:8px;transition:color .2s}
.seg button[aria-pressed="true"]{color:var(--bg)}
.seg button:disabled{cursor:default}
.seg .thumb{position:absolute;top:0;bottom:0;left:0;width:0;background:var(--gold);border-radius:999px;transition:left .28s cubic-bezier(.3,1.3,.5,1),width .28s cubic-bezier(.3,1.3,.5,1)}
.btn{font:700 15px var(--body);padding:13px 22px;border:0;border-radius:12px;background:var(--gold);color:#1a1238;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:9px;box-shadow:0 4px 0 #b8901a;transition:transform .1s,box-shadow .1s,background .15s}
.btn:hover{background:#ffe070}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #b8901a}
.btn.ghost{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 2px var(--line)}
.btn.ghost:hover{box-shadow:inset 0 0 0 2px var(--gold);color:var(--gold)}
.btn.pink{background:var(--pink);color:#fff;box-shadow:0 4px 0 #b0285a}
.btn.sm{padding:8px 13px;font-size:13px;border-radius:9px;box-shadow:0 3px 0 #b8901a}
.btn.ghost.sm{box-shadow:inset 0 0 0 2px var(--line)}
.btn.bet{background:var(--gold);color:#1a1238;font:700 11px var(--body);letter-spacing:.08em;padding:7px 10px;border-radius:8px;box-shadow:0 2px 0 #b8901a}
.btn:disabled{opacity:.4;cursor:not-allowed;transform:none}
:focus-visible{outline:3px solid var(--teal);outline-offset:3px}
.eyebrow{margin:0;font:700 12px var(--body);letter-spacing:.2em;text-transform:uppercase;color:var(--muted);display:flex;gap:8px;align-items:center}
.panel{background:linear-gradient(180deg,var(--panel),var(--bg2));border:1px solid var(--line);border-radius:20px;padding:clamp(18px,3vw,28px);display:flex;flex-direction:column;gap:16px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.note{margin:0;color:var(--muted);font-size:14px}
label.f{display:flex;flex-direction:column;gap:6px;font:700 11px var(--body);letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
input[type=text],input[type=number]{font:500 18px var(--body);color:var(--ink);background:rgba(0,0,0,.25);border:2px solid var(--line);border-radius:12px;padding:11px 14px;width:100%}
input:focus{border-color:var(--gold);outline:none}
/* menu */
.hero{display:grid;grid-template-columns:1.1fr 1fr;gap:28px;align-items:center;min-height:62vh}
.hero h1{margin:0;font:400 clamp(44px,7vw,92px)/.95 var(--display);letter-spacing:-.02em;text-shadow:0 6px 0 rgba(0,0,0,.35)}
.hero h1 span{color:var(--gold);display:block}
.hero p.lede{margin:14px 0 26px;font-size:19px;color:var(--muted);max-width:44ch}
.hero .btns{display:flex;flex-direction:column;gap:12px;max-width:380px}
.hero .btns .btn{justify-content:flex-start;font-size:17px;padding:16px 22px}
.hero .btns .btn small{margin-left:auto;font-weight:500;opacity:.75;font-size:13px}
.stage{position:relative;aspect-ratio:1;max-width:460px;justify-self:center;width:100%}
.stage .tile{position:absolute;width:44%;aspect-ratio:1;border-radius:22px;display:grid;place-items:center;font-size:58px;color:#fff;box-shadow:0 10px 0 rgba(0,0,0,.3);animation:bob 3.2s ease-in-out infinite}
.stage .tile:nth-child(1){left:4%;top:4%;background:var(--a0);transform:rotate(-8deg)}
.stage .tile:nth-child(2){right:4%;top:8%;background:var(--a1);transform:rotate(6deg);animation-delay:-.8s}
.stage .tile:nth-child(3){left:8%;bottom:4%;background:var(--a2);transform:rotate(5deg);animation-delay:-1.6s}
.stage .tile:nth-child(4){right:6%;bottom:6%;background:var(--a3);transform:rotate(-5deg);animation-delay:-2.4s}
.stage .q{position:absolute;inset:0;display:grid;place-items:center;font:400 150px/1 var(--display);color:var(--gold);text-shadow:0 8px 0 rgba(0,0,0,.35);pointer-events:none}
@keyframes bob{50%{translate:0 -10px}}
/* lists */
.plist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.plist li{display:flex;align-items:center;gap:10px;padding:10px 12px;background:rgba(0,0,0,.22);border:1px solid var(--line);border-radius:12px;min-width:0}
.plist li .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:500}
.plist li small{display:block;color:var(--muted);font-size:12px}
.av{width:34px;height:34px;flex:none;border-radius:10px;display:grid;place-items:center;font:700 15px var(--body);color:#fff}
.grid2{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:20px;align-items:start}
.teams{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.team{border-radius:14px;padding:12px;border:2px solid color-mix(in srgb,var(--tc) 60%,transparent);background:color-mix(in srgb,var(--tc) 10%,transparent);display:flex;flex-direction:column;gap:8px;min-width:0}
.team h3{margin:0;font:700 15px var(--body);color:var(--tc);display:flex;gap:8px;align-items:center}
.team .plist li{cursor:default}
.team .plist li.move{cursor:pointer}
.team .plist li.move:hover{border-color:var(--tc)}
.sw{display:flex;align-items:center;gap:10px;font-weight:500;cursor:pointer}
.sw input{width:20px;height:20px;accent-color:var(--gold)}
/* game */
.game{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:20px;align-items:start}
.qhead{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.qhead .rnd{font:400 15px var(--display);color:var(--gold)}
.qhead .cat{display:inline-flex;align-items:center;gap:8px;padding:6px 12px;border-radius:999px;background:rgba(255,255,255,.08);font-weight:700;font-size:13px}
.timer{margin-left:auto;width:64px;height:64px;position:relative}
.timer svg{width:100%;height:100%;transform:rotate(-90deg)}
.timer circle{fill:none;stroke-width:7}
.timer .bg{stroke:rgba(255,255,255,.12)}
.timer .fg{stroke:var(--gold);stroke-linecap:round;transition:stroke .3s}
.timer.low .fg{stroke:var(--bad)}
.timer b{position:absolute;inset:0;display:grid;place-items:center;font:400 18px var(--display)}
.qcard{background:linear-gradient(180deg,#fff,#efe9ff);color:#1a1238;border-radius:22px;padding:clamp(22px,4vw,40px);min-height:180px;display:grid;place-items:center;text-align:center;box-shadow:0 10px 0 rgba(0,0,0,.25);position:relative}
.qcard h2{margin:0;font:700 clamp(22px,3.2vw,34px)/1.2 var(--body)}
.qcard .x2{position:absolute;top:14px;right:16px;font:400 14px var(--display);color:var(--pink)}
.answers{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.ans{position:relative;min-height:92px;border:0;border-radius:18px;padding:16px 18px 16px 70px;text-align:left;font:700 clamp(16px,2vw,20px)/1.2 var(--body);color:#fff;cursor:pointer;background:var(--ac);box-shadow:0 6px 0 color-mix(in srgb,var(--ac) 60%,#000);transition:transform .12s,opacity .25s,filter .25s,box-shadow .12s}
.ans:hover:not(:disabled){transform:translateY(-2px)}
.ans:active:not(:disabled){transform:translateY(4px);box-shadow:0 2px 0 color-mix(in srgb,var(--ac) 60%,#000)}
.ans .sh{position:absolute;left:16px;top:50%;translate:0 -50%;width:40px;height:40px;border-radius:12px;background:rgba(0,0,0,.18);display:grid;place-items:center;font-size:20px}
.ans:disabled{cursor:default}
.ans.dim{opacity:.35;filter:saturate(.5)}
.ans.mine{outline:4px solid #fff;outline-offset:3px}
.ans.right{opacity:1;filter:none;box-shadow:0 0 0 4px #fff,0 0 40px var(--ac)}
.ans.right::after{content:"\f00c";font:900 22px "Font Awesome 6 Free";position:absolute;right:16px;top:50%;translate:0 -50%}
.ans.wrong{animation:shake .45s}
@keyframes shake{20%,60%{translate:-6px}40%,80%{translate:6px}}
.ans .who{position:absolute;right:12px;bottom:8px;display:flex;gap:4px}
.ans .who i{font-style:normal;width:22px;height:22px;border-radius:7px;background:rgba(0,0,0,.35);display:grid;place-items:center;font:700 11px var(--body)}
.banner{border-radius:14px;padding:12px 16px;font-weight:700;display:flex;gap:10px;align-items:center;background:rgba(255,255,255,.08)}
.banner.bad{background:rgba(255,90,95,.18);color:#ffb3b5}
.banner.good{background:rgba(47,209,122,.18);color:#a8f0c6}
.gain{font:400 22px var(--display);color:var(--ok)}
.board{position:sticky;top:16px;display:flex;flex-direction:column;gap:10px}
.board h3{margin:0;font:700 13px var(--body);letter-spacing:.16em;text-transform:uppercase;color:var(--muted);display:flex;gap:8px;align-items:center}
.sc{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:12px;background:rgba(0,0,0,.22);border:1px solid var(--line);transition:transform .3s}
.sc.me{border-color:var(--gold)}
.sc .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:500}
.sc .pts{font:400 15px var(--display);font-variant-numeric:tabular-nums}
.sc .st{display:flex;gap:5px;font-size:13px}
.sc .st .ko{color:var(--bad)}.sc .st .sh{color:var(--teal)}.sc .st .x2{color:var(--pink)}.sc .st .ok{color:var(--ok)}
.sc.left{opacity:.4}
.vs{display:flex;flex-direction:column;gap:8px;padding:12px;border-radius:14px;background:rgba(0,0,0,.25);border:1px solid var(--line)}
.vs .bar{height:12px;border-radius:6px;background:rgba(255,255,255,.08);overflow:hidden}
.vs .bar i{display:block;height:100%;border-radius:6px;transition:width .6s}
.vs .lab{display:flex;justify-content:space-between;font-weight:700;font-size:14px}
.vs .lab b{font:400 15px var(--display)}
/* event overlay */
#evo{position:fixed;inset:0;z-index:30;background:rgba(10,6,28,.86);backdrop-filter:blur(6px);display:grid;place-items:center;padding:20px;animation:fadeIn .3s}
@keyframes fadeIn{from{opacity:0}}
.evbox{width:min(640px,100%);display:flex;flex-direction:column;align-items:center;gap:18px;text-align:center;animation:popIn .45s cubic-bezier(.2,1.4,.4,1)}
@keyframes popIn{from{scale:.7;opacity:0}}
.evbox .kind{font:400 clamp(26px,4.5vw,44px)/1 var(--display);color:var(--gold);text-shadow:0 5px 0 rgba(0,0,0,.4)}
.evbox .kind i{margin-right:12px}
.evbox .who{display:flex;align-items:center;gap:12px;font-size:20px;font-weight:700}
.evbox .desc{color:var(--muted);font-size:16px;max-width:48ch;margin:0}
.evbox .big{font:400 clamp(34px,6vw,60px)/1.1 var(--display)}
.evbox .res{font:400 clamp(22px,3.4vw,32px)/1.2 var(--display)}
.evbox .res.ok{color:var(--ok)}.evbox .res.bad{color:var(--bad)}
.evtimer{width:min(420px,100%);height:10px;border-radius:5px;background:rgba(255,255,255,.1);overflow:hidden}
.evtimer i{display:block;height:100%;background:var(--gold);transform-origin:left}
.wheelW{position:relative;width:min(340px,80vw);aspect-ratio:1}
.wheelW svg{width:100%;height:100%;display:block;filter:drop-shadow(0 10px 0 rgba(0,0,0,.35))}
.wheelW .wheel{transition:transform 4.4s cubic-bezier(.15,.85,.2,1);transform-origin:50% 50%}
.wheelW .ptr{position:absolute;left:50%;top:-14px;translate:-50% 0;font-size:40px;color:#fff;filter:drop-shadow(0 3px 0 rgba(0,0,0,.5));z-index:2}
.seq{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;min-height:72px}
.sym{width:68px;height:68px;border-radius:18px;display:grid;place-items:center;font-size:30px;color:#fff;background:var(--sc);opacity:.25;transition:opacity .15s,transform .15s;border:0}
.sym.on{opacity:1;transform:scale(1.12);box-shadow:0 0 30px var(--sc)}
#mSeq .sym{opacity:1;background:rgba(255,255,255,.06)}#mSeq .sym i{opacity:0;transition:opacity .12s}#mSeq .sym.on{background:var(--sc)}#mSeq .sym.on i{opacity:1}
.sf{--fd:30px;max-height:min(46vh,420px);overflow-y:auto}
.sf.ft{-webkit-mask-image:linear-gradient(to bottom,transparent 0,#000 var(--fd));mask-image:linear-gradient(to bottom,transparent 0,#000 var(--fd))}
.sf.fb{-webkit-mask-image:linear-gradient(to top,transparent 0,#000 var(--fd));mask-image:linear-gradient(to top,transparent 0,#000 var(--fd))}
.sf.ft.fb{-webkit-mask-image:linear-gradient(to bottom,transparent 0,#000 var(--fd),#000 calc(100% - var(--fd)),transparent 100%);mask-image:linear-gradient(to bottom,transparent 0,#000 var(--fd),#000 calc(100% - var(--fd)),transparent 100%)}
.mgrid{display:grid;gap:10px;justify-content:center}
.mgrid .sym{width:58px;height:58px;font-size:24px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips button{border:2px solid var(--line);background:rgba(0,0,0,.2);border-radius:999px;padding:7px 12px;font:700 13px var(--body);color:var(--muted);cursor:pointer;display:inline-flex;gap:7px;align-items:center;transition:border-color .15s,background .15s,color .15s}
.chips button[aria-pressed="true"]{border-color:var(--gold);color:var(--ink);background:rgba(255,210,63,.14)}
.chips button[aria-pressed="true"] i{color:var(--gold)}
.chips button:disabled{cursor:default;opacity:.55}
.chips button small{font-weight:500;opacity:.7}
.setrow{display:flex;gap:18px;flex-wrap:wrap}
.setrow>div{display:flex;flex-direction:column;gap:8px}
.lane{position:relative;width:min(520px,100%);height:74px;border-radius:16px;background:rgba(255,255,255,.06);border:2px solid var(--line);overflow:hidden}
.lane .hit{position:absolute;left:44px;top:8px;bottom:8px;width:32px;border-radius:14px;border:3px solid var(--gold);box-shadow:0 0 18px rgba(255,210,63,.4)}
.lane .hit.flash{background:rgba(255,210,63,.35)}
.lane .note{position:absolute;top:50%;width:28px;height:28px;margin:-14px 0 0 -14px;border-radius:50%;background:var(--pink);box-shadow:0 0 14px var(--pink);display:grid;place-items:center;color:#fff;font-size:12px}
.lane .note.miss{background:#4a4370;box-shadow:none}
.lane .note.hitn{background:var(--ok);box-shadow:0 0 18px var(--ok)}
.ogrid{display:grid;gap:8px;width:min(400px,88vw)}
.ot{aspect-ratio:1;border:0;border-radius:12px;background:rgba(255,255,255,.07);font-size:clamp(16px,3vw,26px);cursor:pointer;display:grid;place-items:center}
.ot:hover:not(:disabled){background:rgba(255,255,255,.15)}
.ot:disabled{cursor:default}
.shake{animation:shake .4s}
.sym.pad{opacity:1;cursor:pointer;box-shadow:0 5px 0 color-mix(in srgb,var(--sc) 55%,#000)}
.sym.pad:active{transform:translateY(3px)}
.dots{display:flex;gap:8px}.dots i{width:12px;height:12px;border-radius:50%;background:rgba(255,255,255,.18)}.dots i.f{background:var(--gold)}
.mathIn{display:flex;gap:10px;width:min(360px,100%)}
.mathIn input{text-align:center;font:400 26px var(--display)}
.rbar{position:relative;width:min(480px,100%);height:54px;border-radius:14px;background:rgba(255,255,255,.08);overflow:hidden;border:2px solid var(--line)}
.rbar .zone{position:absolute;top:0;bottom:0;background:rgba(47,209,122,.45);border-left:3px solid var(--ok);border-right:3px solid var(--ok)}
.rbar .needle{position:absolute;top:-4px;bottom:-4px;width:6px;margin-left:-3px;background:#fff;border-radius:3px;box-shadow:0 0 12px #fff}
/* result */
.podium{display:flex;justify-content:center;align-items:flex-end;gap:14px;min-height:260px}
.pod{width:min(170px,30%);display:flex;flex-direction:column;align-items:center;gap:8px}
.pod .col{width:100%;border-radius:16px 16px 0 0;display:grid;place-items:start center;padding-top:12px;font:400 30px var(--display);color:#1a1238}
.pod .nm{font-weight:700;text-align:center;overflow-wrap:anywhere}
.pod .pt{font:400 16px var(--display);color:var(--gold)}
.big-res{text-align:center;font:400 clamp(30px,5vw,56px)/1.05 var(--display);margin:0}
.big-res.ok{color:var(--ok)}.big-res.bad{color:var(--bad)}
.toast{position:fixed;left:50%;bottom:24px;translate:-50% 0;background:var(--ink);color:var(--bg);padding:11px 18px;border-radius:12px;font-weight:700;z-index:50;transition:opacity .3s}
@media (max-width:900px){.hero,.grid2,.game{grid-template-columns:1fr}.board{position:static}}
@media (prefers-reduced-motion:reduce){.stage .tile{animation:none}.wheelW .wheel{transition-duration:.01s}}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <a class="back" id="hubLink" href="index.html" hidden><i class="fa-solid fa-arrow-left"></i><span data-t="all_games"></span></a>
    <span class="sp"></span>
    <div class="seg" id="langSeg" role="group" aria-label="Language"><button type="button" id="lRu">RU</button><button type="button" id="lEn">EN</button></div>
  </div>

  <section id="sMenu">
    <div class="hero">
      <div>
        <p class="eyebrow"><i class="fa-solid fa-microphone-lines"></i><span data-t="eyebrow"></span></p>
        <h1 id="title"></h1>
        <p class="lede" data-t="lede"></p>
        <div class="btns">
          <button class="btn" id="bSolo" type="button"><i class="fa-solid fa-robot"></i><span data-t="solo"></span><small data-t="solo_s"></small></button>
          <button class="btn pink" id="bNet" type="button"><i class="fa-solid fa-users"></i><span data-t="friends"></span><small data-t="friends_s"></small></button>
        </div>
      </div>
      <div class="stage" aria-hidden="true"><div class="tile"><i class="fa-solid fa-bolt"></i></div><div class="tile"><i class="fa-solid fa-star"></i></div><div class="tile"><i class="fa-solid fa-moon"></i></div><div class="tile"><i class="fa-solid fa-heart"></i></div><div class="q">?</div></div>
    </div>
  </section>

  <section id="sLobby" hidden>
    <div class="grid2">
      <div class="panel">
        <h2 style="margin:0;font:400 28px var(--display)" data-t="friends"></h2>
        <label class="f" for="nick"><span data-t="alias"></span><input type="text" id="nick" maxlength="16" autocomplete="off"></label>

  if(s.ph==='lobby'){show('sTable');renderTable();hideEv();}
  else if(s.ph==='over'){show('sResult');renderResult();hideEv();}
  else{show('sGame');renderGame();if(['ev_intro','event','ev_res'].includes(s.ph))renderEv();else hideEv();}
}
function meP(){return ST&&ST.players.find(p=>p.l===ME());}
function pname(p){return p.l===ME()?p.n+T('you'):p.n;}
/* ---- table ---- */

function chipsUI(box,items,sel,fn,dis){
  const sig=items.map(x=>x[0]+x[1]).join();if(box._sig!==sig){box._sig=sig;box.innerHTML='';
    for(const [v,lab,ic,n] of items){const b=document.createElement('button');b.type='button';b.dataset.v=v;b.innerHTML=(ic?`<i class="fa-solid ${ic}"></i>`:'')+esc(lab)+(n?` <small>${n}</small>`:'');b.onclick=()=>fn(v);box.appendChild(b);}}
  box.querySelectorAll('button').forEach(b=>{b.setAttribute('aria-pressed',sel.includes(b.dataset.v));b.disabled=!!dis;});}
function canStartS(s){if(s.mode!=='coop'&&s.players.length<2)return 'need2';if(s.mode==='teams'&&(!s.players.some(p=>p.team==='A')||!s.players.some(p=>p.team==='B')))return 'need_teams';return '';}
function renderInvites(){const ul=$('#invList');if(!ul||$('#invitePanel').hidden)return;
  const at=new Set((ST&&ST.players||[]).map(p=>p.l));const others=Shell.peers.filter(q=>q&&q.label!==ME()&&!at.has(q.label));
  const sig=others.map(q=>q.label+peerName(q)+q.w+q.ig).join('|')+cfg.lang;if(ul._sig===sig)return;ul._sig=sig;ul.innerHTML='';
  if(!others.length){ul.innerHTML=`<li><span class="nm">${esc(T('nobody'))}</span></li>`;return;}
  for(const q of others){const li=document.createElement('li');li.innerHTML=`${avHTML(peerName(q),q.label)}<span class="nm">${esc(peerName(q))}<small>${esc(q.ig?T('in_game'):q.w==='quiz'?T('here'):T('elsewhere'))}</small></span>`;
    const bt=document.createElement('button');bt.type='button';bt.className='btn bet';bt.textContent='BET';bt.disabled=!!q.ig;bt.onclick=()=>shellPost('bet',{target:q.label});li.appendChild(bt);
    if(!q.ig){const iv=document.createElement('button');iv.type='button';iv.className='btn sm';iv.innerHTML='<i class="fa-solid fa-paper-plane"></i>'+esc(T('invite'));iv.onclick=()=>{shellPost('invite',{to:q.label});iv.disabled=true;setTimeout(()=>iv.disabled=false,4000);};li.appendChild(iv);}
    ul.appendChild(li);}}
/* ---- game ---- */
let ansSig='';
function renderGame(){
  const s=ST;const me=meP();
  $('#gRound').textContent=s.ph==='ready'?T('get_ready'):T('round',{r:s.round,n:s.rounds});
  const q=s.q&&BANK[s.q.id];
  if(s.ph==='ready'||!q){$('#gCat').innerHTML='<i class="fa-solid fa-microphone-lines"></i>'+esc(T('eyebrow'));$('#gQ').textContent=T('get_ready');$('#gAns').innerHTML='';$('#gBanner').hidden=true;$('#gX2').hidden=true;renderBoard();return;}
  $('#gCat').innerHTML=`<i class="fa-solid ${CATI[q[0]]}"></i>`+esc(T('cat_'+q[0]));$('#gQ').textContent=qText(s.q.id);$('#gX2').hidden=!(me&&me.x2&&s.ph==='q');
  const reveal=s.ph!=='q';const corr=s.q.perm.indexOf(0);
  const sig=s.q.id+s.ph+s.round+(me?me.pick+''+me.ans+me.out:'')+cfg.lang+(reveal?s.players.map(p=>p.pick).join():'');
  if(sig!==ansSig){ansSig=sig;const box=$('#gAns');box.innerHTML='';
    s.q.perm.forEach((orig,k)=>{const b=document.createElement('button');b.type='button';b.className='ans';b.style.setProperty('--ac',ACOL[k]);
      b.innerHTML=`<span class="sh"><i class="fa-solid ${AICO[k]}"></i></span><span></span>`;b.querySelector('span:last-child').textContent=ansText(q[3][orig]);
      const mine=me&&me.pick===k;if(mine)b.classList.add('mine');
      if(reveal){b.disabled=true;if(k===corr)b.classList.add('right');else{b.classList.add('dim');if(mine)b.classList.add('wrong');}
        const who=s.players.filter(p=>p.pick===k);if(who.length){const w=document.createElement('span');w.className='who';w.innerHTML=who.slice(0,6).map(p=>`<i style="background:hsl(${hue(p.l)} 60% 40%)" title="${esc(p.n)}">${esc(p.n.slice(0,1).toUpperCase())}</i>`).join('');b.appendChild(w);}}
      else{const can=me&&!me.out&&!me.ans;b.disabled=!can;if(me&&me.ans&&!mine)b.classList.add('dim');if(can)b.onclick=()=>{toHost({t:'ans',r:s.round,k});if(!isHost()){me.ans=true;me.pick=k;ansSig='';renderGame();}};}
      box.appendChild(b);});}
  const bn=$('#gBanner');bn.className='banner';bn.hidden=false;
  if(!me){bn.hidden=true;}
  else if(s.ph==='q'){if(me.out){bn.classList.add('bad');bn.innerHTML='<i class="fa-solid fa-ban"></i>'+esc(T('knocked'));}else if(me.ans)bn.innerHTML='<i class="fa-solid fa-lock"></i>'+esc(T('answered'));else bn.hidden=true;}
  else{if(me.out){bn.classList.add('bad');bn.innerHTML='<i class="fa-solid fa-ban"></i>'+esc(T('knocked'));}
    else if(me.ok){bn.classList.add('good');bn.innerHTML=`<i class="fa-solid fa-check"></i>${esc(T('right'))}<span class="gain">+${me.gain}</span>`;}
    else{bn.classList.add('bad');bn.innerHTML=`<i class="fa-solid fa-xmark"></i>${esc(me.pick<0?T('no_ans'):T('wrong'))} ${esc(T('answer_was',{a:ansText(q[3][0])}))}`;}}
  renderBoard();
}
function renderBoard(){
  const s=ST;const b=$('#board');const me=ME();
  const row=p=>`<div class="sc${p.l===me?' me':''}${p.left?' left':''}">${avHTML(p.n,p.l)}<span class="nm">${esc(pname(p))}</span><span class="st">${p.out&&s.ph==='q'?'<i class="fa-solid fa-ban ko"></i>':''}${p.ko?'<i class="fa-solid fa-ban ko"></i>':''}${p.shield?'<i class="fa-solid fa-shield-halved sh"></i>':''}${p.x2?'<i class="fa-solid fa-angles-up x2"></i>':''}${s.ph==='q'&&p.ans?'<i class="fa-solid fa-check ok"></i>':''}</span><span class="pts">${p.score}</span></div>`;
  const ps=s.players.slice().sort((a,c)=>c.score-a.score);let h='';
  if(s.mode==='coop'){const all=s.players.reduce((t,p)=>t+p.score,0);const bot=s.bot?s.bot.score:0;const mx=Math.max(all,bot,1);
    h+=`<h3><i class="fa-solid fa-scale-balanced"></i>${esc(T('score'))}</h3><div class="vs"><div class="lab"><span>${esc(s.players.length>1?T('team_total'):pname(s.players[0]))}</span><b>${all}</b></div><div class="bar"><i style="width:${all/mx*100}%;background:var(--gold)"></i></div>
      <div class="lab"><span><i class="fa-solid fa-robot"></i> ${esc(T('prof'))}</span><b>${bot}</b></div><div class="bar"><i style="width:${bot/mx*100}%;background:var(--pink)"></i></div></div>`;
    if(s.players.length>1)h+=ps.map(row).join('');}
  else if(s.mode==='teams'){for(const t of ['A','B']){const m=ps.filter(p=>p.team===t);const tot=m.reduce((x,p)=>x+p.score,0);
      h+=`<div class="team" style="--tc:${TEAMS[t].c}"><h3><i class="fa-solid ${TEAMS[t].i}"></i>${esc(T('team_'+t))}<span style="margin-left:auto;font:400 16px var(--display)">${tot}</span></h3>${m.map(row).join('')}</div>`;}}
  else h+=`<h3><i class="fa-solid fa-ranking-star"></i>${esc(T('score'))}</h3>`+ps.map(row).join('');
  if(b._h!==h){b._h=h;b.innerHTML=h;}
}

function wheelSVG(){let g='';const cx=100,cy=100,r=96;
  WHEEL.forEach((w,i)=>{const a0=(i*45-90)*Math.PI/180,a1=((i+1)*45-90)*Math.PI/180;const x0=cx+r*Math.cos(a0),y0=cy+r*Math.sin(a0),x1=cx+r*Math.cos(a1),y1=cy+r*Math.sin(a1);
    g+=`<path d="M${cx},${cy} L${x0.toFixed(2)},${y0.toFixed(2)} A${r},${r} 0 0 1 ${x1.toFixed(2)},${y1.toFixed(2)} Z" fill="${w.c}" stroke="#120d2b" stroke-width="2"/>`;
    const am=((i+.5)*45-90)*Math.PI/180;const tx=cx+62*Math.cos(am),ty=cy+62*Math.sin(am);
    g+=`<foreignObject x="${(tx-14).toFixed(1)}" y="${(ty-14).toFixed(1)}" width="28" height="28"><div xmlns="http://www.w3.org/1999/xhtml" style="width:28px;height:28px;display:grid;place-items:center;color:#fff;font-size:17px;transform:rotate(${(i+.5)*45}deg)"><i class="fa-solid ${w.i}"></i></div></foreignObject>`;});
  return `<svg viewBox="0 0 200 200"><g class="wheel" id="wheelG">${g}<circle cx="100" cy="100" r="16" fill="#120d2b" stroke="#ffd23f" stroke-width="4"/></g></svg>`;}

      requestAnimationFrame(run);};requestAnimationFrame(run);
    if(mine){const tap=()=>{if(evLocal.done)return;const now=performance.now()-t0;let best=null;for(const n of notes){if(n.hit||n.missed)continue;const dt=Math.abs(n.t-now);if(dt<=E.win&&(!best||dt<Math.abs(best.t-now)))best=n;}
        const h=$('#hitR');h.classList.add('flash');setTimeout(()=>h.classList.remove('flash'),90);
        if(best){best.hit=true;best.e.classList.add('hitn');evLocal.hits++;tick(1040,.05);}else{evLocal.stray++;tick(160,.08);}
        $('#rhN').textContent=T('rh_hits',{h:evLocal.hits,n:notes.length});};
      $('#bTap').onpointerdown=e=>{e.preventDefault();tap();};evLocal.key=e=>{if(e.code==='Space'){e.preventDefault();if(!e.repeat)tap();}};}
    return;}
  if(ev.type==='odd'){const RS=ev.data.rounds;evLocal={type:'odd',r:0,done:false};
    box.innerHTML=head+`<p class="desc" id="odR"></p><div class="ogrid" id="og"></div>`+(mine?'':`<p class="desc">${esc(T('evd_odd',{n:tn}))}</p>`)+TM;
    const draw=()=>{const g=RS[evLocal.r];$('#odR').textContent=T('odd_round',{i:evLocal.r+1});const og=$('#og');og.style.gridTemplateColumns=`repeat(${g.n},1fr)`;
      og.innerHTML=Array.from({length:g.n*g.n},(_,k)=>{const odd=k===g.pos;const ic=ODDI[odd?g.oi:g.i];const h=odd?(g.h+g.dh)%360:g.h;
        return `<button type="button" class="ot" data-k="${k}" style="color:hsl(${h} 78% 62%);${odd&&g.rot?`rotate:${g.rot}deg;`:''}" ${mine?'':'disabled'}><i class="fa-solid ${ic}"></i></button>`;}).join('');
      if(mine)og.querySelectorAll('.ot').forEach(b=>b.onclick=()=>{if(evLocal.done)return;
        if(+b.dataset.k===g.pos){evLocal.r++;tick(800+evLocal.r*120,.05);if(evLocal.r>=RS.length){evLocal.done=true;b.style.background='var(--ok)';toHost({t:'evres',ok:true,seq:ev.seq});}else draw();}
        else{evLocal.done=true;b.style.background='var(--bad)';const right=og.querySelector(`[data-k="${g.pos}"]`);if(right)right.style.background='rgba(47,209,122,.45)';toHost({t:'evres',ok:false,seq:ev.seq});}});};
    draw();return;}
}
addEventListener('keydown',e=>{if(evLocal&&evLocal.key)evLocal.key(e);});
function tickEv(){}
/* timers */
function frame(){
  if(ST){const left=Math.max(0,num(ST.rem)-(performance.now()-STat));const dur=num(ST.dur,1)||1;
    if(!$('#sGame').hidden){const k=ST.ph==='q'?left/QDUR:ST.ph==='reveal'?0:left/dur;const fg=$('#tFg');fg.style.strokeDashoffset=String(169.6*(1-Math.max(0,Math.min(1,k))));
      $('#tNum').textContent=ST.ph==='q'?Math.ceil(left/1000):'';$('#timer').classList.toggle('low',ST.ph==='q'&&left<5000);}
    const bar=$('#evBar');if(bar&&!$('#evo').hidden){bar.style.transform=`scaleX(${Math.max(0,Math.min(1,left/dur))})`;}}
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
/* ---- result ---- */
function renderResult(){
  const s=ST;const r=s.res||{};const me=ME();const won=(r.winners||[]).includes(me);const big=$('#rBig');
  const sorted=s.players.slice().sort((a,b)=>b.score-a.score);
  if(s.mode==='coop'){big.textContent=r.beat?T('win'):T('lose');big.className='big-res '+(r.beat?'ok':'bad');$('#rSub').textContent=r.beat?T('beat_prof',{a:r.all,b:r.bot}):T('lost_prof',{a:r.all,b:r.bot});}
  else if(s.mode==='teams'){big.textContent=r.win?T('won_by',{n:T('team_'+r.win)}):T('draw');big.className='big-res '+(won?'ok':r.win?'bad':'');$('#rSub').textContent=`${T('team_A')} ${r.a} : ${r.b} ${T('team_B')}`;}
  else{const w=sorted.filter(p=>(r.winners||[]).includes(p.l));big.textContent=w.length===1?T('won_by',{n:w[0].n}):w.length>1?T('draw'):T('draw');big.className='big-res '+(won?'ok':'bad');$('#rSub').textContent='';}
  const pod=$('#podium');const top=sorted.slice(0,3);const order=[top[1],top[0],top[2]].filter(Boolean);const hs={0:200,1:150,2:110};const cols=['var(--gold)','#c9c3e6','#e09a5b'];
  pod.innerHTML=order.map(p=>{const i=sorted.indexOf(p);return `<div class="pod">${avHTML(p.n,p.l)}<span class="nm">${esc(pname(p))}</span><span class="pt">${p.score}</span><div class="col" style="height:${hs[i]}px;background:${cols[i]}">${i+1}</div></div>`;}).join('');
  const m=meP();$('#rStats').innerHTML=m?[T('st_correct',{n:m.correct}),T('st_streak',{n:m.best}),T('st_ko',{n:m.kos})].map(t=>`<span class="cat" style="display:inline-flex;gap:8px;padding:6px 12px;border-radius:999px;background:rgba(255,255,255,.08);font-weight:700;font-size:13px">${esc(t)}</span>`).join(''):'';
  $('#bAgain').hidden=!isHost();$('#rNote').textContent=isHost()?'':T('again_wait');
}
if(typeof window.confetti!=='function'){}

/* ================= lobby UI ================= */
function show(id){for(const s of ['sMenu','sLobby','sTable','sGame','sResult'])$('#'+s).hidden=s!==id;
  requestAnimationFrame(()=>document.querySelectorAll('.seg').forEach(segThumb));}
function pushGp(){shellPost('gp',{d:{n:myName(),host:isHost()&&!H.solo&&(H.ph==='lobby'||H.ph==='over')?1:0,cnt:H?H.players.filter(p=>!p.left).length:0,busy:HOST?1:0,gid:ST&&ST.gid||null}});}
let lobSig='';
function renderLobby(){
  if($('#sLobby').hidden)return;const ok=SHELL&&Shell.inLobby;
  $('#needLobby').hidden=ok;$('#haveLobby').hidden=!ok;$('#peoplePanel').hidden=!ok;
  $('#needNote').textContent=SHELL?T('need_lobby'):T('direct');$('#bNeedT').textContent=SHELL?T('lobby_btn'):T('to_site');
  if(!ok)return;const others=Shell.peers.filter(q=>q&&q.label!==ME());
  const sig=others.map(q=>q.label+peerName(q)+q.w+q.ig+JSON.stringify(q.gp&&[q.gp.host,q.gp.cnt])).join('|')+cfg.lang;if(sig===lobSig)return;lobSig=sig;
  const tables=others.filter(q=>q.w==='quiz'&&q.gp&&q.gp.host===1);const tl=$('#tables');tl.innerHTML='';
  if(!tables.length)tl.innerHTML=`<li><span class="nm" style="white-space:normal;color:var(--muted)">${esc(T('no_tables'))}</span></li>`;
  for(const q of tables){const li=document.createElement('li');li.innerHTML=`${avHTML(peerName(q),q.label)}<span class="nm">${esc(T('table_of',{n:peerName(q),c:num(q.gp.cnt,1)}))}</span>`;
    const b=document.createElement('button');b.type='button';b.className='btn sm';b.innerHTML='<i class="fa-solid fa-chair"></i>'+esc(T('join'));b.onclick=()=>joinTable(q.label);li.appendChild(b);tl.appendChild(li);}
  const pl=$('#people');pl.innerHTML='';if(!others.length)pl.innerHTML=`<li><span class="nm">${esc(T('nobody'))}</span></li>`;
  for(const q of others){const li=document.createElement('li');li.innerHTML=`${avHTML(peerName(q),q.label)}<span class="nm">${esc(peerName(q))}<small>${esc(q.ig?T('in_game'):q.w==='quiz'?T('here'):T('elsewhere'))}</small></span>`;
    const bt=document.createElement('button');bt.type='button';bt.className='btn bet';bt.textContent='BET';bt.disabled=!!q.ig;bt.onclick=()=>shellPost('bet',{target:q.label});li.appendChild(bt);pl.appendChild(li);}
}
function joinTable(l){HOST=l;H=null;sendTo(l,{t:'join',n:myName()});}
function leaveTable(){if(isHost()){if(!H.solo)for(const p of H.players)if(p.l!==ME())sendTo(p.l,{t:'closed'});if(H.gid&&H.ph!=='over'&&H.ph!=='lobby'&&SHELL)shellPost('abort',{gid:H.gid});}else if(HOST)toHost({t:'leave'});
  const wasSolo=H&&H.solo;H=null;HOST=null;ST=null;hideEv();if(wasSolo||!SHELL){show('sMenu');}else{show('sLobby');lobSig='';renderLobby();}pushGp();}
$('#bSolo').onclick=()=>{newHost(true);};
$('#bNet').onclick=()=>{show('sLobby');lobSig='';renderLobby();};
$('#bLobbyBack').onclick=()=>show('sMenu');
$('#bNeed').onclick=()=>{if(SHELL)shellPost('lobby');else location.href='index.html';};
$('#bCreate').onclick=()=>{newHost(false);};
$('#bStart').onclick=()=>hostStart();
$('#bLeave').onclick=leaveTable;
$('#bAgain').onclick=()=>{if(isHost()){H.ph='lobby';H.players=H.players.filter(p=>!p.left);for(const p of H.players)Object.assign(p,fresh());if(H.mode==='teams')balanceTeams();hostBroadcast();}};
$('#bToMenu').onclick=leaveTable;
$('#evOn').onchange=e=>hostSet('evOn',e.target.checked);
$('#nick').addEventListener('input',()=>{try{localStorage.setItem('gs-alias-quiz',clean($('#nick').value));}catch(e){}if(isHost()){const p=H.players.find(x=>x.l===ME());if(p){p.n=myName();hostBroadcast();}}else if(HOST)toHost({t:'name',n:myName()});pushGp();});
addEventListener('resize',()=>document.querySelectorAll('.seg').forEach(segThumb));
function scrollFade(el){const upd=()=>{const t=el.scrollTop>2,b=el.scrollTop+el.clientHeight<el.scrollHeight-2;el.classList.toggle('ft',t);el.classList.toggle('fb',b);};
  el.addEventListener('scroll',upd,{passive:true});try{new ResizeObserver(upd).observe(el);}catch(e){}new MutationObserver(()=>requestAnimationFrame(upd)).observe(el,{childList:true,subtree:true});upd();}
document.querySelectorAll('.sf').forEach(scrollFade);

/* ================= shell messages ================= */
let hostGoneT=0;
addEventListener('message',e=>{if(!SHELL||e.source!==parent)return;const m=e.data;if(!m||m.svo!==1)return;
  if(m.type==='hello'||m.type==='peers'){if(typeof m.me==='string')Shell.me=m.me;Shell.inLobby=!!m.inLobby;Shell.hub=typeof m.hub==='string'?m.hub:null;Shell.peers=Array.isArray(m.peers)?m.peers.slice(0,16):[];
    if(m.type==='hello'){Shell.name=clean(m.name);if(!$('#nick').value)$('#nick').value=Shell.name;if(H&&H.players[0]&&H.players[0].l==='me')H.players[0].l=Shell.me;pushGp();
      if(Shell.pendingJoin){const l=Shell.pendingJoin;Shell.pendingJoin=null;acceptFrom(l);}}
    if(!$('#sLobby').hidden)renderLobby();if(!$('#sTable').hidden)renderInvites();}
  else if(m.type==='ev'&&m.k==='g'&&m.d&&m.d.game==='quiz'){const from=String(m.from||'');const d=m.d.m;if(!d||typeof d!=='object')return;
    if(isHost()&&from!==ME()){hostMsg(from,d);return;}
    if(from!==HOST)return;
    if(d.t==='st')onState(d.s,false);else if(d.t==='busy'){HOST=null;toast(T('busy'));}else if(d.t==='full'){HOST=null;toast(T('full'));}
    else if(d.t==='closed'){HOST=null;ST=null;hideEv();toast(T('table_closed'));show('sLobby');lobSig='';renderLobby();pushGp();}}
  else if(m.type==='accept'&&typeof m.from==='string'){if(!Shell.me){Shell.pendingJoin=m.from;return;}acceptFrom(m.from);}
});
function acceptFrom(l){if(HOST)return;const q=peer(l);show('sLobby');lobSig='';renderLobby();if(q&&q.gp&&q.gp.host===1)joinTable(l);else setTimeout(()=>{const q2=peer(l);if(!HOST&&q2&&q2.gp&&q2.gp.host===1)joinTable(l);},1500);}
setInterval(()=>{ // host gone?
  if(!SHELL||!HOST||isHost()){hostGoneT=0;return;}const q=peer(HOST);
  if(q&&q.w==='quiz'&&Shell.inLobby){hostGoneT=0;return;}if(!hostGoneT){hostGoneT=performance.now();return;}
  if(performance.now()-hostGoneT>3500){hostGoneT=0;HOST=null;ST=null;hideEv();toast(T('host_left'));show('sLobby');lobSig='';renderLobby();pushGp();}
},700);
setInterval(()=>{if(SHELL)pushGp();},1500);

/* ================= lang + boot ================= */
function applyLang(){document.documentElement.lang=cfg.lang;document.title=L()?'Quiz Night':'Викторина';
  document.querySelectorAll('[data-t]').forEach(el=>el.textContent=T(el.dataset.t));
  $('#title').innerHTML=esc(T('title1'))+'<span>'+esc(T('title2'))+'</span>';
  buildSeg($('#langSeg'),[['ru','RU'],['en','EN']],cfg.lang,v=>{cfg.lang=v;saveCfg();applyLang();shellPost('lang',{lang:v});});
  lobSig='';ansSig='';evKey='';$('#invList')._sig='';for(const id of ['#modeSeg','#freqSeg','#diffSeg','#catChips','#evChips'])$(id)._sig='';if(ST)render();renderLobby();}
if(!window.claude)$('#hubLink').hidden=false;
if(SHELL)$('#hubLink').addEventListener('click',e=>{e.preventDefault();if(HOST)leaveTable();shellPost('exit');});
try{$('#nick').value=clean(localStorage.getItem('gs-alias-quiz')||'');}catch(e){}
applyLang();show('sMenu');
shellPost('ready');
window.__quiz={get H(){return H},get ST(){return ST},hostMsg,BANK,ME};
})();
